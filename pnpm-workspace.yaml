packages:
  - contracts/**
  - contract-integrity-verifier/**
  - e2e/**
  - postman/**
  - operations/**
  - ts-libs/**
  - '!contracts/lib/**'

allowBuilds:
  '@arbitrum/nitro-contracts': false
  '@parcel/watcher': false
  '@prisma/engines': false
  better-sqlite3: false
  bigint-buffer: false
  bufferutil: false
  c-kzg: true
  es5-ext: false
  esbuild: false
  keccak: false
  koffi: false
  prisma: false
  secp256k1: false
  sharp: false
  tiny-secp256k1: false
  unrs-resolver: false
  utf-8-validate: false
  web3: false
  web3-bzz: false
  web3-shh: false
  yarn: false

catalog:
  '@jest/globals': 30.5.2
  '@typechain/ethers-v6': 0.5.1
  '@types/jest': 30.0.0
  '@types/yargs': 17.0.35
  axios: 1.20.0
  dotenv: 17.4.2
  eslint: 9.39.5
  ethers: 6.17.0
  express: 5.2.1
  jest: 30.5.2
  jest-environment-node: 30.5.2
  jest-mock-extended: 4.0.1
  neverthrow: 8.2.0
  prettier: 3.9.9
  prom-client: 15.1.3
  ts-jest: 29.4.14
  tsup: 8.5.1
  tsx: 4.23.15
  typechain: 8.3.2
  typescript: 5.9.3
  viem: 2.56.9
  winston: 3.19.0
  yargs: 18.2.0
  zod: 4.6.5

ignoredBuiltDependencies:
  - '@arbitrum/nitro-contracts'
  - '@parcel/watcher'
  - '@prisma/engines'
  - better-sqlite3
  - bigint-buffer
  - bufferutil
  - es5-ext
  - esbuild
  - keccak
  - koffi
  - prisma
  - secp256k1
  - sharp
  - tiny-secp256k1
  - unrs-resolver
  - utf-8-validate
  - web3
  - web3-bzz
  - web3-shh
  - yarn

minimumReleaseAge: 4320

onlyBuiltDependencies:
  # Required by contracts/ blob tests; additions to this allowlist need security review.
  - c-kzg

overrides:
  '@chainlink/contracts>@zksync/contracts': '-'
  '@humanfs/node@<0.16.8': '0.16.8'
  '@istanbuljs/load-nyc-config>js-yaml': '4.3.2'
  '@openzeppelin/contracts-upgradeable@<4.9.6': '4.9.6'
  '@openzeppelin/contracts@<4.9.6': '4.9.6'
  axios@<1.18.0: '1.20.0'
  baseline-browser-mapping@>=2.0.0 <2.11.0: '2.11.26'
  blessed-contrib>lodash: '4.18.1'
  bn.js@<4.12.3: '4.12.5'
  body-parser@>=2.0.0 <2.3.0: '2.3.0'
  brace-expansion@<1.1.21: '1.1.21'
  brace-expansion@>=2.0.0 <2.1.7: '2.1.7'
  brace-expansion@>=3.0.0 <5.0.12: '5.0.12'
  browserslist@<4.28.7: '4.29.1'
  cookie@<0.7.0: '0.7.2'
  cosmiconfig@5.2.1>js-yaml: '4.3.2'
  esbuild@<0.28.1: '0.28.1'
  eslint: '9.39.5'
  fast-uri@>=3.0.0 <3.1.8: '3.1.8'
  fast-xml-parser@>=4.0.0-beta.3 <5.10.1: '5.11.1'
  immutable@>=4.0.0-rc.1 <4.3.9: '4.3.9'
  immutable@>=5.0.0-beta.1 <5.1.8: '5.1.9'
  joi@>=16.0.0 <17.13.7: '17.13.8'
  js-cookie@<3.0.7: '3.0.7'
  js-yaml@>=4.0.0 <4.3.2: '4.3.2'
  mysql2@<3.23.1: '3.24.4'
  postcss@<8.5.23: '8.5.28'
  qs@>=6.0.0 <6.16.0: '6.16.0'
  read-yaml-file@1.1.0>js-yaml: '4.3.2'
  sc-istanbul>js-yaml: '4.3.2'
  serialize-javascript@<7.0.5: '7.0.5'
  shell-quote@<1.9.0: '1.10.0'
  tar@<7.5.21: '7.5.22'
  tmp@<0.2.7: '0.2.7'
  typescript-eslint: '8.70.1'
  undici: '6.29.0'
  uuid@<11.1.1: '11.1.1'
  ws@>=8.0.0 <8.21.0: '8.22.0'
  xml2js@<0.5.0: '0.6.2'
  zod: '4.6.5'
patchedDependencies:
  cosmiconfig@5.2.1: patches/cosmiconfig@5.2.1.patch
  read-yaml-file@1.1.0: patches/read-yaml-file@1.1.0.patch
  sc-istanbul@0.4.6: patches/sc-istanbul@0.4.6.patch

strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Required by eslint-plugin-import and other legacy tooling pulled during Docker deploy.
  # These semver releases predate npm provenance, so pnpm flags them as trust downgrades.
  - semver@6.3.1 || 5.7.2
  # Required by eslint-plugin-import's TypeScript resolver in the operations Docker deploy path.
  # The package version has no provenance evidence, but is pinned by the existing lockfile.
  - eslint-import-resolver-typescript@3.10.1
  # Pulled via ethers -> @types/node@22.7.5 during legacy deploy resolution.
  # Excluded to keep deploy working while trustPolicy remains enabled for all other packages.
  - undici-types@6.19.8
  # Already present in the lockfile via @lidofinance/lsv-cli -> WalletConnect; lacks provenance evidence.
  - "@noble/curves@1.8.0"
  # Already present in the lockfile via @lidofinance/lsv-cli -> WalletConnect; lacks provenance evidence.
  - "@noble/hashes@1.7.0"
  # Already present in the lockfile via Hardhat/Sass tooling; lacks provenance evidence.
  - "chokidar@4.0.3"
  # Already present in the lockfile via WalletConnect logging; lacks provenance evidence.
  - "slow-redact@0.3.2"
  # Already present in the lockfile via OpenZeppelin Defender tooling; pnpm 11 flags these as trust downgrades.
  - "@openzeppelin/defender-admin-client@1.54.6"
  - "@openzeppelin/defender-base-client@1.54.6"
