plugins {
  id 'lineth.kotlin-library-conventions'
}

dependencies {
  implementation project(':jvm-libs:linea:core:signer-interfaces')
  implementation project(':jvm-libs:generic:extensions:kotlin')
  implementation project(':jvm-libs:generic:errors')
  implementation "org.web3j:core:${libs.versions.web3j.get()}"
  implementation project(':jvm-libs:generic:http-rest')

  implementation "io.vertx:vertx-core"
  implementation "io.vertx:vertx-web-client"
  implementation "io.vertx:vertx-lang-kotlin"

  testImplementation "io.vertx:vertx-junit5"
  testImplementation "org.wiremock:wiremock:${libs.versions.wiremock.get()}"
}
