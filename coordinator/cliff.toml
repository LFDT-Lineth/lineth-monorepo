# git-cliff ~ configuration file for the `coordinator` component.
# https://git-cliff.org/docs/configuration
#
# Unlike the default `cliff.toml` (which selects a component's commits by the
# files they touch, via `--include-path`), this config selects commits by their
# conventional-commit SCOPE: only commits scoped to `coordinator` are kept, so
# the version bump and changelog for `coordinator` derive from those commits
# alone. A commit qualifies when `coordinator` is ANY of its comma-separated
# scopes, e.g. `feat(coordinator): x` or `feat(coordinator,prover): x`.
#
# In the release workflows this config is combined with `--include-path` so
# selection is scope-AND-path gated: a commit must both be scoped to
# `coordinator` and touch a `coordinator` path to drive the bump/changelog.


[changelog]
# A Tera template to be rendered for each release in the changelog.
# Kept identical to cliff.toml so the rendered sections look the same.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = []
protect_breaking_commits = false
# Keep ONLY commits whose scope list contains `coordinator` as a whole,
# comma-delimited token; group them by type so the changelog renders sections.
# The scope fragment `\(([^)]*,)?\s*coordinator\s*(,[^)]*)?\)` matches
# `(coordinator)`, `(a,coordinator)`, `(coordinator,b)`, `(a,coordinator,b)`
# (exact-token match). The optional `!` for breaking changes sits after `)`, so
# breaking commits still match and stay flagged.
commit_parsers = [
    # Drop auto-generated CHANGELOG-update commits (any scope) so they never
    # bump the version or appear in the changelog.
    { message = "^chore\\([^)]*\\): update CHANGELOG\\.md", skip = true },

    { message = "^feat\\(([^)]*,)?\\s*coordinator\\s*(,[^)]*)?\\)", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix\\(([^)]*,)?\\s*coordinator\\s*(,[^)]*)?\\)", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^perf\\(([^)]*,)?\\s*coordinator\\s*(,[^)]*)?\\)", group = "<!-- 4 -->⚡ Performance" },
    { message = "^refactor\\(([^)]*,)?\\s*coordinator\\s*(,[^)]*)?\\)", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^(chore|ci)\\(([^)]*,)?\\s*coordinator\\s*(,[^)]*)?\\)", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { message = "^revert\\(([^)]*,)?\\s*coordinator\\s*(,[^)]*)?\\)", group = "<!-- 9 -->◀️ Revert" },

    # Everything else (other scopes, no scope, doc/style/test) is skipped so it
    # neither bumps the version nor shows up in the changelog.
    { message = ".*", skip = true },
]
filter_commits = true
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
