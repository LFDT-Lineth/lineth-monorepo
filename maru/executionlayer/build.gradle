import de.undercouch.gradle.tasks.download.Download

plugins {
  id 'lineth.kotlin-library-conventions'
  id 'java-test-fixtures'
}

dependencies {
  implementation(project(':maru:core'))

  implementation project(':jvm-libs:generic:extensions:kotlin')
  implementation project(':jvm-libs:generic:extensions:futures')
  implementation project(':jvm-libs:linea:core:metrics')
  implementation project(':jvm-libs:generic:json-rpc')
  implementation project(':jvm-libs:generic:serialization:jackson')

  testImplementation(testFixtures(project(':maru:core')))
  testImplementation(testFixtures(project(':jvm-libs:generic:extensions:kotlin')))
  testImplementation(testFixtures(project(':maru:observability')))
  testImplementation(project(':jvm-libs:linea:metrics:micrometer'))
  testImplementation(testFixtures(project(':jvm-libs:generic:json-rpc')))
  testImplementation(testFixtures(project(':jvm-libs:generic:vertx-helper')))
  testImplementation "com.networknt:json-schema-validator:${libs.versions.jsonSchemaValidator.get()}"
  testImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml"
}

// Engine API JSON schemas from ethereum/execution-apis, used by the tests; see README.md (incl. supporting a new fork).
def executionApisCommit = '5aebdfdd45cadeb723be4bd45b4611b71c8b1c85' // tag v1.0.0-beta.7
def engineApiSchemasDir = layout.buildDirectory.dir("execution-apis/$executionApisCommit")

def downloadEngineApiSchemas = tasks.register('downloadEngineApiSchemas', Download) {
  src([
    'src/schemas/base-types.yaml',
    'src/engine/openrpc/schemas/payload.yaml',
    'src/engine/openrpc/schemas/forkchoice.yaml',
  ].collect { "https://raw.githubusercontent.com/ethereum/execution-apis/$executionApisCommit/$it" })
  dest engineApiSchemasDir
  overwrite false
}

tasks.named('processTestResources') {
  from(downloadEngineApiSchemas) { into 'engine-api-schemas' }
}
