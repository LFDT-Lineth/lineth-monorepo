plugins {
  id 'lineth.kotlin-library-conventions'
  id 'java-test-fixtures'
}

dependencies {
  implementation(project(':maru:core'))

  implementation project(':jvm-libs:generic:extensions:kotlin')
  implementation project(':jvm-libs:generic:extensions:futures')
  implementation project(':jvm-libs:linea:core:metrics')
  implementation project(':jvm-libs:generic:json-rpc')
  implementation project(':jvm-libs:generic:serialization:jackson')

  testImplementation(testFixtures(project(':maru:core')))
  testImplementation(testFixtures(project(':jvm-libs:generic:extensions:kotlin')))
  testImplementation(testFixtures(project(':maru:observability')))
  testImplementation(project(':jvm-libs:linea:metrics:micrometer'))
  testImplementation(testFixtures(project(':jvm-libs:generic:vertx-helper')))
  testImplementation "com.networknt:json-schema-validator:${libs.versions.jsonSchemaValidator.get()}"
  testImplementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml"
}
