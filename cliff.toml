# git-cliff ~ configuration file for the `linea` milestone (aggregate) release.
# https://git-cliff.org/docs/configuration
#
# The `linea` milestone bundles every releasable component, so — unlike the
# per-component configs that gate on a single scope — this config keeps a commit
# when ANY of its comma-separated scopes is one of the component scopes:
#   coordinator, linea-besu, maru, prover, postman, tx-exclusion-api
# e.g. `feat(coordinator): x`, `fix(linea-besu): y`, or a shared
# `feat(coordinator,prover): z` all qualify.
#
# In the milestone workflows this config is combined with `--include-path` (the
# union of all component paths) so selection is scope-AND-path gated: a commit
# must both carry a component scope and touch a component path to drive the
# milestone version bump and changelog.
#
# The scope alternation matches each token exactly (bounded by `(` / `,` / `)`),
# so `(linea-besu-package)` does NOT match `linea-besu`, and `(prover-ray)` does
# NOT match `prover`.


[changelog]
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = true
# An array of regex based postprocessors to modify the changelog.
postprocessors = [
    # Replace the placeholder <REPO> with a URL.
    #{ pattern = '<REPO>', replace = "https://github.com/orhun/git-cliff" },
]
# render body even when there are no releases to process
# render_always = true
# output file path
# output = "test.md"

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true
# Require all commits to be conventional.
# Takes precedence over filter_unconventional.
require_conventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [
    # Replace issue numbers with link templates to be updated in `changelog.postprocessors`.
    #{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))"},
    # Check spelling of the commit message using https://github.com/crate-ci/typos.
    # If the spelling is incorrect, it will be fixed automatically.
    #{ pattern = '.*', replace_command = 'typos --write-changes -' },
]
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = false
# Keep ONLY commits whose scope list contains one of the component scopes as a
# whole, comma-delimited token; group them by type so the changelog renders
# sections. The scope fragment
# `\(([^)]*,)?\s*(coordinator|linea-besu|maru|prover|postman|tx-exclusion-api)\s*(,[^)]*)?\)`
# matches `(coordinator)`, `(a,prover)`, `(maru,b)`, `(a,linea-besu,b)` — but NOT
# `(linea-besu-package)` or `(prover-ray)` (exact-token match). The optional `!`
# for breaking changes sits after `)`, so breaking commits still match and stay
# flagged.
commit_parsers = [
    # Drop auto-generated CHANGELOG-update commits (any scope) so they never
    # bump the version or appear in the changelog.
    { message = "^chore\\([^)]*\\): update CHANGELOG\\.md", skip = true },

    { message = "^feat\\(([^)]*,)?\\s*(coordinator|linea-besu|maru|prover|postman|tx-exclusion-api)\\s*(,[^)]*)?\\)", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix\\(([^)]*,)?\\s*(coordinator|linea-besu|maru|prover|postman|tx-exclusion-api)\\s*(,[^)]*)?\\)", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^perf\\(([^)]*,)?\\s*(coordinator|linea-besu|maru|prover|postman|tx-exclusion-api)\\s*(,[^)]*)?\\)", group = "<!-- 4 -->⚡ Performance" },
    { message = "^refactor\\(([^)]*,)?\\s*(coordinator|linea-besu|maru|prover|postman|tx-exclusion-api)\\s*(,[^)]*)?\\)", group = "<!-- 2 -->🚜 Refactor" },
    { message = "^(chore|ci)\\(([^)]*,)?\\s*(coordinator|linea-besu|maru|prover|postman|tx-exclusion-api)\\s*(,[^)]*)?\\)", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
    { message = "^revert\\(([^)]*,)?\\s*(coordinator|linea-besu|maru|prover|postman|tx-exclusion-api)\\s*(,[^)]*)?\\)", group = "<!-- 9 -->◀️ Revert" },

    # Everything else (other scopes, no scope, doc/style/test) is skipped so it
    # neither bumps the version nor shows up in the changelog.
    { message = ".*", skip = true },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = true
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# An array of link parsers for extracting external references, and turning them into URLs, using regex.
link_parsers = []
# Include only the tags that belong to the current branch, false means including all tags in the repo.
use_branch_tags = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# Process submodules commits
recurse_submodules = false
