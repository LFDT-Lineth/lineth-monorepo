# NOTE: '#' only starts a comment at the beginning of a line. A trailing '# ...' after a
# value becomes part of the value, and Gradle then silently ignores the boolean property.
# Keep comments on their own line.

# projects run concurrently
org.gradle.parallel=true
org.gradle.caching=true
# global worker budget (default: CPU count)
# org.gradle.workers.max=8
# intra-project task parallelism
org.gradle.configuration-cache=true
# faster cache store
org.gradle.configuration-cache.parallel=true
# IDE sync (9.4+)
org.gradle.tooling.parallel=true
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

group=build.linea
besuArtifactGroup=org.hyperledger.besu
lineaSequencerProjectPath=:linea-besu:plugins:linea-sequencer
lineaTracerProjectPath=:tracer

# Version of the project, at release override this value with
# /gradlew jvm-libs:blob-compressor:publish -Pversion=0.0.3
# version=0.0.0-SNAPSHOT

# Kotlin version is now managed in gradle/libs.versions.toml
