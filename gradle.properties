org.gradle.parallel=true                      # projects run concurrently
org.gradle.caching=true
# org.gradle.workers.max=8                      # global budget (default: CPU count)
org.gradle.configuration-cache=true           # intra-project task parallelism
org.gradle.configuration-cache.parallel=true  # faster cache store
org.gradle.tooling.parallel=true              # IDE sync (9.4+)
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

group=build.linea
besuArtifactGroup=org.hyperledger.besu
lineaSequencerProjectPath=:linea-besu:plugins:linea-sequencer
lineaTracerProjectPath=:tracer

# Version of the project, at release override this value with
# /gradlew jvm-libs:blob-compressor:publish -Pversion=0.0.3
# version=0.0.0-SNAPSHOT

# Kotlin version is now managed in gradle/libs.versions.toml
