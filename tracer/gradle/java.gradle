// Takes the version, and if it equals "SNAPSHOT" or the suffix is "-SNAPSHOT" replaces SNAPSHOT
// with the checked out git commit hash. A timestamp would change the jar on every build and defeat
// up-to-date checks and the build cache for every consumer of the tracer jars.
def gitCommitHash = providers.exec {
  commandLine 'git', 'rev-parse', '--short=7', 'HEAD'
  ignoreExitValue = true
}.standardOutput.asText.map { it.trim() ?: 'unknown' }

ext.calculateVersion = { ->
  def lineaTracerProject = project(lineaTracerProjectPath)
  String version = lineaTracerProject.version
  if (version.equals("SNAPSHOT") || version.endsWith("-SNAPSHOT")) {
    def lastSnapshot = version.lastIndexOf("SNAPSHOT")
    version = version.substring(0, lastSnapshot) + "dev-${gitCommitHash.get()}"
  }

  return version
}
