[profile.default]
src = 'src'
out = 'out'
libs = ['node_modules', 'lib']
remappings = ["forge-std/=node_modules/forge-std/src/"]
cache_path  = 'cache_forge'
foundry_version = "stable"

# Test settings
match-path = 'test/foundry/*'

# Default solc compiler settings (osaka: clz + transient storage; matches Hardhat)
evm_version = "osaka"
optimizer = true
optimizer_runs = 10_000