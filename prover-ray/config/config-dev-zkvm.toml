# dev-zkvm: the guest runs under ZkC Execute, without a trace, and the public
# inputs come from the guest output. The native runner is optional: when set,
# the guest output is also checked against it (temporary). The guests folder
# is mounted read-only, like the legacy prover-assets; scripts/stage-guest.sh
# stages a guest ELF into it.
version = "0.0.0-riscv"
log_level = 4
guests_dir = "/opt/linea/prover-ray/guests"
# Run the guests with gogen (Go code built with the Go toolchain on PATH)
# instead of the interpreter: same output, much faster. On by default.
gogen = true

[execution]
prover_mode = "dev-zkvm"
requests_root_dir = "/opt/linea/prover-ray/requests"
