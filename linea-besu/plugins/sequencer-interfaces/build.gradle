buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
  dependencies {
    classpath(libs.jreleaser)
  }
}

repositories {
  mavenCentral()
  maven {
    name = 'linea-besu'
    url = "https://artifacts.consensys.net/public/linea-besu/maven/"
  }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

group = 'build.linea'
description = 'Lineth chain security interfaces'
// publishing.gradle uses project.artifactId when set (or else falling back to project.name)
ext.artifactId = 'sequencer-interfaces'

jar { enabled = true }

dependencies {
  // Besu Plugin API and core dependencies
  compileOnly "org.hyperledger.besu:besu-plugin-api:${rootProject.ext.resolveBesuVersion()}"
  compileOnly "org.hyperledger.besu:besu-evm:${rootProject.ext.resolveBesuVersion()}"
  compileOnly "org.hyperledger.besu:besu-datatypes:${rootProject.ext.resolveBesuVersion()}"
}

apply from: rootProject.file("gradle/publishing.gradle")

tasks.withType(GenerateModuleMetadata).configureEach {
  suppressedValidationErrors.add('enforced-platform')
}
