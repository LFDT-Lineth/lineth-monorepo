def lineaSequencerProject = project(lineaSequencerProjectPath)

tasks.register('sourcesJar', Jar) {
  dependsOn classes
  archiveClassifier = 'sources'
  from sourceSets.main.allSource
}

tasks.register('javadocJar', Jar) {
  dependsOn javadoc
  archiveClassifier = 'javadoc'
  from javadoc.destinationDir
}

jar {
  archiveBaseName = lineaSequencerProject.distributionIdentifier
  version = calculateVersion()

  manifest {
    attributes(
      'Specification-Title': archiveBaseName.get(),
      'Specification-Version': calculateVersion(),
      'Implementation-Title': archiveBaseName.get(),
      'Implementation-Version': calculateVersion()
    )
  }

  // Include the Kotlin 2.4 core stdlib so classes such as kotlin.time.Instant are available when
  // Besu loads the plugin. The jdk7/jdk8 compatibility JARs contain duplicate module-info entries,
  // so unpacking every kotlin-stdlib* artifact would make this JAR fail with duplicate entries.
  from {
    configurations.runtimeClasspath
      .filter { it.name == "kotlin-stdlib-${libs.versions.kotlin.get()}.jar" }
      .collect { zipTree(it) }
  }
}
