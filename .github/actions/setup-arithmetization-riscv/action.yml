name: 'Setup Arithmetization RISC-V Environment'
description: 'Install what is needed for building / testing'
inputs:
  enable-ssh:
    description: 'Enable ability to ssh into session'
    required: false
    default: 'false'
  zkc-ref:
    description: 'Optional zkc commit/branch/tag override (default: arithmetization/Makefile ZKC_REF)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
      - name: Setup upterm session
        if: ${{ inputs.enable-ssh == 'true' }}
        uses: lhotari/action-upterm@b0357f23233f5ea6d58947c0c402e0631bab7334 #v1

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24.6'
          cache-dependency-path: "**/*.sum"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.16.0'

      - name: Install Rust nightly
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustup component add rust-src --toolchain nightly

      - name: Install mise
        shell: bash
        run: |
          curl https://mise.run | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.local/share/mise/shims" >> "${GITHUB_PATH}"

      # blst + mcl are not packaged for Ubuntu; `install-native-crypto-deps` (riscv-guests/Makefile)
      # builds them from the pinned tags once and installs into /usr/local — the SAME command a
      # developer runs locally, and the same one .github/actions/setup-riscv-guests calls, so there
      # is one recipe to keep in sync instead of two. The l2-execution guest's native host tools
      # (l2-execution-wrap, l2-execution-runner) link them via the default `zig build` step this job
      # also runs, even though the benchmark itself only consumes the freestanding riscv64 ELF.
      - name: Cache blst + mcl builds
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            /usr/local/lib/libblst.a
            /usr/local/lib/libmcl.so
            /usr/local/include/blst.h
            /usr/local/include/blst_aux.h
            /usr/local/include/mcl
          key: crypto-libs-blst-e7f90de551e8df682f3cc99067d204d8b90d27ad-mcl-0499298adcfad3bbcebf77f17700ebbe97166060

      - name: Install native crypto deps (blst, mcl)
        shell: bash
        run: make -C riscv-guests install-native-crypto-deps

      - name: Install riscv64-unknown-elf toolchain
        # Install the riscv64-unknown-elf toolchain
        # Use the xpack-dev-tools/riscv-none-elf-gcc-xpack for riscv64-none-elf-gcc
        # Simlinked riscv64-none-elf-gcc to riscv64-none-elf-gcc
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y binutils-riscv64-unknown-elf time
          XPACK_GCC_VERSION="15.2.0-1"
          XPACK_GCC_DIR="${HOME}/riscv-none-elf-gcc"
          mkdir -p "${XPACK_GCC_DIR}"
          curl --fail --location \
            "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${XPACK_GCC_VERSION}/xpack-riscv-none-elf-gcc-${XPACK_GCC_VERSION}-linux-x64.tar.gz" \
            | tar xz --directory="${XPACK_GCC_DIR}" --strip-components=1
          ln -sf "${XPACK_GCC_DIR}/bin/riscv-none-elf-gcc" "${XPACK_GCC_DIR}/bin/riscv64-unknown-elf-gcc"
          echo "${XPACK_GCC_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Set zkc version
        shell: bash
        run: |
          zkc_ref="${{ inputs.zkc-ref }}"
          if [ -z "$zkc_ref" ]; then
            zkc_ref="$(make -C arithmetization -s --no-print-directory echo-zkc-version)"
          fi
          {
            echo "ZKC_REF<<EOF"
            echo "$zkc_ref"
            echo "EOF"
          } >> "$GITHUB_ENV"



