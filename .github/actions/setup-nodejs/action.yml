name: 'Setup nodes'
description: 'Setup nodejs'

inputs:
  pnpm-install-options:
    description: 'The options to pass to pnpm install'
    required: true
    default: '--frozen-lockfile --prefer-offline --ignore-scripts'
  commands:
    description: |
      Optional newline-separated list of commands to run after install.
      Example:
        commands: |
          pnpm run build
          pnpm run build:libs
    required: false
    default: ''
  working-directory:
    description: 'Directory (relative to github.workspace) containing package.json/.nvmrc/pnpm-lock.yaml'
    required: false
    default: '.'

outputs:
  node-version:
    description: 'Resolved Node.js version'
    value: ${{ steps.versions.outputs.node }}
  pnpm-version:
    description: 'Resolved pnpm version'
    value: ${{ steps.versions.outputs.pnpm }}

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      name: setup-pnpm
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - uses: ./.github/actions/setup-node-with-cache
      name: setup-nodejs
      with:
        node-version-file: ${{ inputs.working-directory }}/.nvmrc
        cache: ''

    # Release/publish dispatches check out a commit other than the ref's HEAD;
    # their verdicts must not be saved under this ref's cache keys.
    - id: guard
      name: Check the checkout matches the running ref
      shell: bash
      env:
        RUNNING_SHA: ${{ github.sha }}
      run: |
        head=$(git rev-parse HEAD 2>/dev/null || echo unknown)
        echo "checkout-matches-ref=$([ "$head" = "$RUNNING_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # Cache pnpm's lockfile verification verdicts (pnpm cacheDir). A verdict only
    # applies to the exact lockfile and policy it was computed for.
    - id: verdict-path
      name: Locate the pnpm verification verdict file
      shell: bash
      run: echo "path=$(pnpm cache path)/lockfile-verified.jsonl" >> "$GITHUB_OUTPUT"

    - id: verdict-restore
      name: Restore pnpm lockfile verification verdicts
      if: ${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) != '' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.verdict-path.outputs.path }}
        key: pnpm-verified-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
        # A fallback restore only carries older verdicts, which pnpm ignores
        # unless the lockfile hash and policy match.
        restore-keys: |
          pnpm-verified-${{ runner.os }}-

    - id: versions
      name: Capture versions
      shell: bash
      run: |
        echo "node=$(node -v | sed 's/^v//')" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(pnpm -v)" >> "$GITHUB_OUTPUT"

    - name: pnpm install
      working-directory: ${{ inputs.working-directory }}
      run: pnpm i ${{ inputs.pnpm-install-options }}
      shell: bash

    # Save only from main runs whose checkout matches the running ref, so
    # release/publish dispatches cannot write verdicts under another ref's key.
    - name: Save pnpm lockfile verification verdicts
      if: >-
        ${{ steps.verdict-restore.outcome == 'success'
        && steps.verdict-restore.outputs.cache-hit != 'true'
        && steps.guard.outputs.checkout-matches-ref == 'true'
        && github.ref == 'refs/heads/main'
        && !startsWith(github.event_name, 'pull_request') }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.verdict-path.outputs.path }}
        key: ${{ steps.verdict-restore.outputs.cache-primary-key }}

    - name: Run post-install commands
      if: inputs.commands != ''
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: ${{ inputs.commands }}
