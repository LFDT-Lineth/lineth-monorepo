name: 'Setup nodes'
description: 'Setup nodejs'

inputs:
  pnpm-install-options:
    description: 'The options to pass to pnpm install'
    required: true
    default: '--frozen-lockfile --prefer-offline --ignore-scripts'
  commands:
    description: |
      Optional newline-separated list of commands to run after install.
      Example:
        commands: |
          pnpm run build
          pnpm run build:libs
    required: false
    default: ''
  working-directory:
    description: 'Directory (relative to github.workspace) containing package.json/.nvmrc/pnpm-lock.yaml'
    required: false
    default: '.'

outputs:
  node-version:
    description: 'Resolved Node.js version'
    value: ${{ steps.versions.outputs.node }}
  pnpm-version:
    description: 'Resolved pnpm version'
    value: ${{ steps.versions.outputs.pnpm }}

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      name: setup-pnpm
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - uses: ./.github/actions/setup-node-with-cache
      name: setup-nodejs
      with:
        node-version-file: ${{ inputs.working-directory }}/.nvmrc
        cache: 'pnpm'
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - id: versions
      name: Capture versions
      shell: bash
      run: |
        echo "node=$(node -v | sed 's/^v//')" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(pnpm -v)" >> "$GITHUB_OUTPUT"

    # pnpm re-verifies every lockfile entry against minimumReleaseAge/trustPolicy on each install,
    # regardless of --filter (~30s of registry round trips). The verdict is keyed on lockfile content
    # and policy, and lives in pnpm's cacheDir, which the store cache above doesn't cover.
    - id: verdict
      name: Locate pnpm lockfile verification cache
      shell: bash
      run: echo "path=${XDG_CACHE_HOME:-$HOME/.cache}/pnpm/lockfile-verified.jsonl" >> "$GITHUB_OUTPUT"

    - id: verdict-restore
      name: Restore pnpm lockfile verification cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.verdict.outputs.path }}
        key: pnpm-lockfile-verified-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
        # Safe fallback: pnpm only reuses a record matching the lockfile hash and current policy.
        restore-keys: pnpm-lockfile-verified-${{ runner.os }}-

    - name: pnpm install
      working-directory: ${{ inputs.working-directory }}
      run: pnpm i ${{ inputs.pnpm-install-options }}
      shell: bash

    - name: Save pnpm lockfile verification cache
      if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event_name, 'pull_request') && steps.verdict-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.verdict.outputs.path }}
        key: ${{ steps.verdict-restore.outputs.cache-primary-key }}

    - name: Run post-install commands
      if: inputs.commands != ''
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: ${{ inputs.commands }}
