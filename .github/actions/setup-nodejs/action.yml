name: 'Setup nodes'
description: 'Setup nodejs'

inputs:
  pnpm-install-options:
    description: 'The options to pass to pnpm install'
    required: true
    default: '--frozen-lockfile --prefer-offline --ignore-scripts'
  commands:
    description: |
      Optional newline-separated list of commands to run after install.
      Example:
        commands: |
          pnpm run build
          pnpm run build:libs
    required: false
    default: ''
  working-directory:
    description: 'Directory (relative to github.workspace) containing package.json/.nvmrc/pnpm-lock.yaml'
    required: false
    default: '.'

outputs:
  node-version:
    description: 'Resolved Node.js version'
    value: ${{ steps.setup.outputs.runtime-version }}
  pnpm-version:
    description: 'Resolved pnpm version'
    value: ${{ steps.versions.outputs.pnpm }}

runs:
  using: 'composite'
  steps:
    - id: setup
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        working-directory: ${{ inputs.working-directory }}
        node-version-file: .nvmrc
        cache: true
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
        require-lockfile: true
        install: false

    - id: versions
      name: Capture versions
      shell: bash
      run: |
        echo "pnpm=$(pnpm -v)" >> "$GITHUB_OUTPUT"

    - name: pnpm install
      working-directory: ${{ inputs.working-directory }}
      run: pnpm i ${{ inputs.pnpm-install-options }}
      shell: bash

    - name: Run post-install commands
      if: inputs.commands != ''
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: ${{ inputs.commands }}
