name: 'Setup nodes'
description: 'Setup nodejs'

inputs:
  pnpm-install-options:
    description: 'The options to pass to pnpm install'
    required: true
    default: '--frozen-lockfile --prefer-offline --ignore-scripts'
  commands:
    description: |
      Optional newline-separated list of commands to run after install.
      Example:
        commands: |
          pnpm run build
          pnpm run build:libs
    required: false
    default: ''
  working-directory:
    description: 'Directory (relative to github.workspace) containing package.json/.nvmrc/pnpm-lock.yaml'
    required: false
    default: '.'

outputs:
  node-version:
    description: 'Resolved Node.js version'
    value: ${{ steps.versions.outputs.node }}
  pnpm-version:
    description: 'Resolved pnpm version'
    value: ${{ steps.versions.outputs.pnpm }}

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      name: setup-pnpm
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - uses: ./.github/actions/setup-node-with-cache
      name: setup-nodejs
      with:
        node-version-file: ${{ inputs.working-directory }}/.nvmrc
        cache: ''

    # Release/publish dispatches check out a commit other than the ref's HEAD;
    # their verdicts must not be saved under this ref's cache keys.
    - id: guard
      name: Check the checkout matches the running ref
      shell: bash
      env:
        RUNNING_SHA: ${{ github.sha }}
      run: |
        head=$(git rev-parse HEAD 2>/dev/null || echo unknown)
        echo "checkout-matches-ref=$([ "$head" = "$RUNNING_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    # pnpm records the result of its lockfile supply-chain verification
    # (minimumReleaseAge, trustPolicy, tarball URL binding, ...) in
    # lockfile-verified.jsonl. A verdict is reused only when the normalized
    # lockfile hash and the full policy match, so any dependency, resolution
    # or policy change forces a fresh verification. Restored on every ref, but
    # saved only by main runs (see ./.github/actions/cache), never by PRs.
    #
    # The path must be a literal, not a step output: actions/cache re-reads its
    # inputs in the post step, where outputs of earlier steps are not available,
    # so an output-derived path is empty there and the save fails with
    # "Input required and not supplied: path". This is pnpm's default cache
    # directory on Linux runners (XDG_CACHE_HOME is unset on them).
    - uses: ./.github/actions/cache
      name: Cache pnpm lockfile verification verdicts
      if: ${{ runner.os == 'Linux' && hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) != '' }}
      with:
        path: ~/.cache/pnpm/lockfile-verified.jsonl
        key: pnpm-verified-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
        # Append-only JSONL: a fallback restore carries older verdicts (inert
        # unless the lockfile hash and policy match) and the next save adds the new one.
        restore-keys: |
          pnpm-verified-
        cache-save: ${{ steps.guard.outputs.checkout-matches-ref }}

    - id: versions
      name: Capture versions
      shell: bash
      run: |
        echo "node=$(node -v | sed 's/^v//')" >> "$GITHUB_OUTPUT"
        echo "pnpm=$(pnpm -v)" >> "$GITHUB_OUTPUT"

    - name: pnpm install
      working-directory: ${{ inputs.working-directory }}
      run: pnpm i ${{ inputs.pnpm-install-options }}
      shell: bash

    - name: Run post-install commands
      if: inputs.commands != ''
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: ${{ inputs.commands }}
