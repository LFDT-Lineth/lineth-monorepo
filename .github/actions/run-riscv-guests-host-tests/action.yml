name: 'Run RISC-V guests host tests'
description: 'Check Zig formatting and run native unit tests for all RISC-V guests.'

runs:
  using: 'composite'
  steps:
    - name: Setup RISC-V guests environment
      uses: ./.github/actions/setup-riscv-guests
      with:
        needs-zkevm-fixtures: 'true'

    # The rollup guest's tests and sample request are proved by verifier-ray's Go devmode prover.
    - name: Install Go
      uses: ./.github/actions/setup-go
      with:
        go-version: "1.27.4"
        cache-dependency-path: "**/*.sum"
        cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    - name: Check Zig formatting
      shell: bash
      run: make fmt-check
      working-directory: riscv-guests

    - name: Run native unit tests for all guests
      shell: bash
      run: make test
      working-directory: riscv-guests
