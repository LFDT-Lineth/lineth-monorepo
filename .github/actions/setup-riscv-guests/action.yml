name: 'Setup RISC-V Guests Environment'
description: >
  Toolchain + native crypto libraries for building and host-testing the riscv-guests packages.
  Installs the Zig version pinned in riscv-guests/.zigversion (via community mirrors — ziglang.org
  prunes dev builds) and the native crypto stack that zesu's host backend links: libsecp256k1 and
  OpenSSL from apt, blst and mcl built from pinned upstream sources into /usr/local (the build's
  default -Dcrypto-prefix on Linux). Mirrors zesu's own `make install-apt-deps` recipe.

runs:
  using: 'composite'
  steps:
    - name: Read pinned Zig version
      id: zigversion
      shell: bash
      run: echo "version=$(cat riscv-guests/.zigversion)" >> "$GITHUB_OUTPUT"

    - name: Install Zig
      uses: ./.github/actions/setup-zig
      with:
        version: ${{ steps.zigversion.outputs.version }}
        dependency-hash-paths: riscv-guests/*/build.zig.zon
        cache-save: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    # blst + mcl are not packaged for Ubuntu; `install-native-crypto-deps` builds them from the
    # pinned tags once and installs into /usr/local — the SAME command a developer runs locally.
    # Restore needs temporary write access to these root-owned installation paths.
    - name: Prepare native crypto cache destinations
      id: crypto-cache-permissions
      shell: bash
      run: |
        sudo mkdir -p /usr/local/lib /usr/local/include/mcl
        echo "lib-owner=$(stat -c '%u:%g' /usr/local/lib)" >> "$GITHUB_OUTPUT"
        echo "include-owner=$(stat -c '%u:%g' /usr/local/include)" >> "$GITHUB_OUTPUT"
        owner="$(id -u):$(id -g)"
        sudo chown "$owner" /usr/local/lib /usr/local/include
        sudo chown -R "$owner" /usr/local/include/mcl
        # Do not create placeholders: make treats an existing library as installed.
        for path in /usr/local/lib/libblst.a /usr/local/lib/libmcl.so /usr/local/include/blst.h /usr/local/include/blst_aux.h; do
          if [ -e "$path" ]; then sudo chown "$owner" "$path"; fi
        done

    - name: Cache blst + mcl builds
      uses: ./.github/actions/cache
      with:
        path: |
          /usr/local/lib/libblst.a
          /usr/local/lib/libmcl.so
          /usr/local/include/blst.h
          /usr/local/include/blst_aux.h
          /usr/local/include/mcl
        key: crypto-libs-blst-e7f90de551e8df682f3cc99067d204d8b90d27ad-mcl-0499298adcfad3bbcebf77f17700ebbe97166060

    - name: Restore native crypto destination ownership
      if: ${{ always() && steps.crypto-cache-permissions.outputs.lib-owner != '' }}
      shell: bash
      env:
        LIB_OWNER: ${{ steps.crypto-cache-permissions.outputs.lib-owner }}
        INCLUDE_OWNER: ${{ steps.crypto-cache-permissions.outputs.include-owner }}
      run: |
        for path in /usr/local/lib/libblst.a /usr/local/lib/libmcl.so /usr/local/include/blst.h /usr/local/include/blst_aux.h /usr/local/include/mcl; do
          if [ -e "$path" ]; then sudo chown -R root:root "$path"; fi
        done
        sudo chown "$LIB_OWNER" /usr/local/lib
        sudo chown "$INCLUDE_OWNER" /usr/local/include

    - name: Install native crypto deps (blst, mcl)
      shell: bash
      run: |
        make -C riscv-guests install-native-crypto-deps
        sudo ldconfig

    # Zig package fetches (zesu, zesu-zkvm, EF zkevm fixtures) land in each guest's zig-pkg/.
    - name: Cache Zig package fetches
      uses: ./.github/actions/cache
      with:
        path: riscv-guests/*/zig-pkg
        key: riscv-guests-zig-pkg-${{ hashFiles('riscv-guests/**/build.zig.zon') }}
        restore-keys: |
          riscv-guests-zig-pkg-

    # Compile cache (the Makefiles pass --cache-dir <guest>/.zig-cache). Restoring it turns the
    # multi-minute zesu graph rebuild into a no-op; zig's cache is content-addressed, so a stale
    # restore (restore-keys fallback) still reuses every unchanged object. Keys hash only tracked
    # build inputs — zig-pkg/ is populated at run time and must stay out of the key.
    - name: Cache Zig compile cache
      uses: ./.github/actions/cache
      with:
        path: riscv-guests/*/.zig-cache
        key: riscv-guests-zig-cache-${{ hashFiles('riscv-guests/.zigversion', 'riscv-guests/build_common/**', 'riscv-guests/*/build.zig', 'riscv-guests/*/build.zig.zon', 'riscv-guests/*/src/**') }}
        restore-keys: |
          riscv-guests-zig-cache-

