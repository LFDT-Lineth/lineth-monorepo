---
name: Compute docker tag
description: 'Composite action to compute docker tag'

inputs:
  version_prefix:
    description: "Version tag prefix"
    required: true

  image_tag_suffix:
    description: 'Custom docker image tag suffix'
    required: false
    default: ''
  
  commit_tag:
    description: 'Commit tag'
    required: true

outputs:
  dockertag:
    description: "Docker image tag base (without suffix)"
    value: ${{ steps.dockertag.outputs.dockertag }}

  dockertag_with_suffix:
    description: "Docker image tag with suffix (same value as docker_tag if no suffix is given)"
    value: ${{ steps.dockertag.outputs.dockertag_with_suffix }}

runs:
  using: "composite"
  steps:
    - name: set docker tag
      id: dockertag
      shell: bash
      # Inputs reach the script through env, never through ${{ }} inside `run:`: the version prefix
      # and the suffix can carry a user-supplied release/image tag suffix, and expression expansion
      # happens before bash parses the script, so a quote or $(...) in them would be executed.
      env:
        VERSION_PREFIX: ${{ inputs.version_prefix }}
        COMMIT_TAG: ${{ inputs.commit_tag }}
        IMAGE_TAG_SUFFIX: ${{ inputs.image_tag_suffix }}
      run: |
        timestamp="$(date -u +%Y%m%d)"
        base="${VERSION_PREFIX}-${timestamp}-${COMMIT_TAG}"
        suffix=""
        if [[ -n "${IMAGE_TAG_SUFFIX}" ]]; then
          suffix="-${IMAGE_TAG_SUFFIX}"
        fi
        echo "dockertag_with_suffix=${base}${suffix}" >> "$GITHUB_OUTPUT"
        echo "dockertag=${base}" >> "$GITHUB_OUTPUT"
