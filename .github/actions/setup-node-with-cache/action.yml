name: 'Setup Node with shared pnpm cache'
description: 'Keep setup-node caching on main and restore the same pnpm cache without saving on other refs.'
inputs:
  node-version-file:
    description: 'File containing the Node version'
    required: true
  cache:
    description: 'pnpm to enable the dependency cache, or empty to disable it.'
    default: ''
  cache-dependency-path:
    description: 'Lockfiles hashed for the dependency cache'
    default: 'pnpm-lock.yaml'
outputs:
  node-version:
    description: 'Installed Node version'
    value: ${{ steps.node.outputs.node-version }}
  cache-hit:
    description: 'Whether the exact cache key was restored'
    value: ${{ steps.node.outputs.cache-hit || steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      id: node
      with:
        node-version-file: ${{ inputs.node-version-file }}
        package-manager-cache: false
        cache: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event_name, 'pull_request') && inputs.cache || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: Locate the setup-node pnpm cache
      id: cache
      if: ${{ inputs.cache == 'pnpm' && (github.ref != 'refs/heads/main' || startsWith(github.event_name, 'pull_request')) }}
      shell: bash
      run: |
        arch=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        echo "prefix=node-cache-${RUNNER_OS}-${arch}-pnpm-" >> "$GITHUB_OUTPUT"
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: restore
      if: ${{ steps.cache.outcome == 'success' && hashFiles(inputs.cache-dependency-path) != '' }}
      with:
        path: ${{ steps.cache.outputs.path }}
        key: ${{ steps.cache.outputs.prefix }}${{ hashFiles(inputs.cache-dependency-path) }}
