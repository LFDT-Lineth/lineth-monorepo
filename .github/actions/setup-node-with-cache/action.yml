name: 'Setup Node with shared pnpm cache'
description: 'Keep setup-node caching on main and restore the same pnpm cache without saving on other refs.'
inputs:
  node-version-file:
    description: 'File containing the Node version'
    required: true
  cache:
    description: 'pnpm to enable the dependency cache, or empty to disable it.'
    default: ''
  cache-dependency-path:
    description: 'Lockfiles hashed for the dependency cache'
    default: 'pnpm-lock.yaml'
runs:
  using: composite
  steps:
    # Release/publish dispatches check out a commit other than the ref's HEAD;
    # their store must not be saved under this ref's cache keys.
    - name: Check the checkout matches the running ref
      id: guard
      shell: bash
      run: |
        head=$(git rev-parse HEAD 2>/dev/null || echo unknown)
        echo "checkout-matches-ref=$([ "$head" = "${{ github.sha }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      id: node
      with:
        node-version-file: ${{ inputs.node-version-file }}
        package-manager-cache: false
        cache: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event_name, 'pull_request') && steps.guard.outputs.checkout-matches-ref == 'true' && inputs.cache || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: Locate the setup-node pnpm cache
      id: cache
      if: ${{ inputs.cache == 'pnpm' && (github.ref != 'refs/heads/main' || startsWith(github.event_name, 'pull_request') || steps.guard.outputs.checkout-matches-ref != 'true') }}
      shell: bash
      run: |
        arch=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        echo "prefix=node-cache-${RUNNER_OS}-${arch}-pnpm-" >> "$GITHUB_OUTPUT"
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: restore
      if: ${{ steps.cache.outcome == 'success' && hashFiles(inputs.cache-dependency-path) != '' }}
      with:
        path: ${{ steps.cache.outputs.path }}
        key: ${{ steps.cache.outputs.prefix }}${{ hashFiles(inputs.cache-dependency-path) }}
        # Prefix fallback: on a lockfile change, restore the previous store so
        # pnpm downloads only the dependency diff instead of refetching all.
        restore-keys: |
          ${{ steps.cache.outputs.prefix }}
