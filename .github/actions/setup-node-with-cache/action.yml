name: 'Setup Node with pnpm verification cache'
description: 'Cache the pnpm lockfile verification verdict instead of the store. Restore on every ref; save only on main runs whose checkout matches the ref.'
inputs:
  node-version-file:
    description: 'File containing the Node version'
    required: true
  cache:
    description: 'pnpm to enable the verification cache, or empty to disable it.'
    default: ''
  cache-dependency-path:
    description: 'Lockfiles hashed for the verification cache key'
    default: 'pnpm-lock.yaml'
runs:
  using: composite
  steps:
    # Release/publish dispatches check out a commit other than the ref's HEAD;
    # their verdicts must not be saved under this ref's cache keys.
    - name: Check the checkout matches the running ref
      id: guard
      shell: bash
      run: |
        head=$(git rev-parse HEAD 2>/dev/null || echo unknown)
        echo "checkout-matches-ref=$([ "$head" = "${{ github.sha }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      id: node
      with:
        node-version-file: ${{ inputs.node-version-file }}
        package-manager-cache: false
        # The pnpm store is deliberately NOT cached: under pnpm 12, restoring
        # the ~500MB store archive (~26s) costs more than a cold fetch of all
        # packages (~2-6s). The dominant install cost is trust-policy
        # verification of the lockfile (~25s per fresh runner); its verdicts
        # live in lockfile-verified.jsonl and are what we cache below.
        cache: ''

    - name: Locate the pnpm verdict cache
      id: cache
      if: ${{ inputs.cache == 'pnpm' }}
      shell: bash
      run: |
        # pnpm records lockfile trust-policy verdicts here ("verified X ago").
        # Verdicts are keyed by lockfile content hash + policy and are portable
        # across runners (path is constant in CI; mtime/inode changes tolerated).
        echo "path=${XDG_CACHE_HOME:-$HOME/.cache}/pnpm/lockfile-verified.jsonl" >> "$GITHUB_OUTPUT"
        echo "prefix=pnpm-verified-" >> "$GITHUB_OUTPUT"

    - uses: ./.github/actions/cache
      id: verdict
      if: ${{ steps.cache.outcome == 'success' && hashFiles(inputs.cache-dependency-path) != '' }}
      with:
        path: ${{ steps.cache.outputs.path }}
        key: ${{ steps.cache.outputs.prefix }}${{ hashFiles(inputs.cache-dependency-path) }}
        # Append-only JSONL, one verdict per lockfile: a fallback restore
        # carries older verdicts and the next save appends the new one.
        restore-keys: |
          ${{ steps.cache.outputs.prefix }}
        cache-save: ${{ steps.guard.outputs.checkout-matches-ref }}
