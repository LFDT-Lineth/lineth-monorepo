name: 'Collect runner info'

description: >
  Logs the specs and runtime behaviour of the runner executing the job (CPU model and cgroup quota,
  memory, disk, Docker daemon, tool versions) as collapsed log groups, a job summary table and one
  greppable RUNNER_INFO log line. Call it with phase "start" early in the job (after checkout) and
  with phase "end" (if: always()) as the last step to also report CPU throttling, pressure stalls,
  OOM kills and peak memory. Best effort: it never fails the job.

inputs:
  phase:
    description: >
      "start" collects the specs and records baseline counters; "end" reports what the job consumed
      since "start".
    required: false
    default: 'start'
  benchmark:
    description: >
      "true" runs a ~10 s CPU and disk micro-benchmark to compare raw speed across runners
      (phase "start" only).
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Collect runner info (${{ inputs.phase }})
      shell: bash
      continue-on-error: true
      env:
        ACTION_PATH: ${{ github.action_path }}
        RUNNER_INFO_PHASE: ${{ inputs.phase }}
        RUNNER_INFO_BENCHMARK: ${{ inputs.benchmark }}
      run: bash "$ACTION_PATH/scripts/collect-runner-info.sh" "$RUNNER_INFO_PHASE"
