name: 'Upload Jacoco execution data'
description: >
  Uploads the Jacoco *.exec files produced by a JVM test job as a workflow artifact named
  `jacoco-<suite>-exec`. The jacoco-report job in testing.yml downloads every artifact matching
  `jacoco-*-exec`, so a new JVM suite only has to call this action to be included in the root report.
inputs:
  name:
    description: 'Artifact name; must match jacoco-*-exec (e.g. jacoco-coordinator-exec)'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Upload Jacoco execution data
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        # Must not be rooted at a module directory: upload-artifact strips the matches' least common
        # ancestor, so the exec files would be restored without the module prefix and
        # jacocoRootReport would not find them.
        path: |
          **/build/jacoco/*.exec
        if-no-files-found: ignore
