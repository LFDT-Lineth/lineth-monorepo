name: Docker Build and Publish
description: Build and publish Docker images with caching support

inputs:
  image_name:
    description: 'Docker image name (e.g., consensys/linea-coordinator)'
    required: true
  image_tags:
    description: 'Comma-separated list of docker image tags to apply (e.g. "0.3.4-20260511-935ef04,0.3.4-20260511-935ef04-rc1"). The first entry is treated as the primary tag; all entries are pushed when push_image is true. Duplicates and empty entries will be dropped.'
    required: true
  develop_tag:
    description: 'Develop tag (used when on main branch)'
    required: false
    default: ''
  push_image:
    description: 'Whether to push the image to registry'
    required: false
    default: 'false'
  dockerfile_path:
    description: 'Path to Dockerfile'
    required: true
  docker_context:
    description: 'Docker build context'
    required: false
    default: '.'
  build_args:
    description: 'Docker build arguments (multiline)'
    required: false
    default: ''
  build_secrets:
    description: 'Docker build secrets (one per line, in buildx --secret format: id=mysecret,src=<path> or "id=mysecret,env=VAR_NAME")'
    required: false
    default: ''
  build_contexts:
    description: 'Docker build contexts (multiline)'
    required: false
    default: ''
  requires_qemu:
    description: 'Whether QEMU setup is required for multi-arch builds'
    required: false
    default: 'false'
  push_platforms:
    description: 'Platforms to build for when pushing'
    required: false
    default: 'linux/amd64,linux/arm64'
  save_artifact:
    description: 'Whether to save and upload the Docker image as an artifact (only applies when push_image is false)'
    required: false
    default: 'false'
  artifact_name:
    description: 'Name for the uploaded artifact (required when save_artifact is true)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up QEMU
      if: ${{ inputs.requires_qemu == 'true' }}
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      with:
        platforms: 'arm64,arm'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    # The actual build is delegated to scripts/docker/build-image.sh so that CI
    # and `make docker-build-<image>` run the exact same buildx invocation.
    # See scripts/docker/README.md.
    - name: Build image
      shell: bash
      env:
        IMAGE_NAME: ${{ inputs.image_name }}
        RAW_IMAGE_TAGS: ${{ inputs.image_tags }}
        DEVELOP_TAG: ${{ inputs.develop_tag }}
        IS_MAIN_REF: ${{ github.ref == 'refs/heads/main' }}
        PUSH_IMAGE: ${{ inputs.push_image }}
        DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
        DOCKER_CONTEXT: ${{ inputs.docker_context }}
        BUILD_ARGS: ${{ inputs.build_args }}
        BUILD_CONTEXTS: ${{ inputs.build_contexts }}
        BUILD_SECRETS: ${{ inputs.build_secrets }}
        PUSH_PLATFORMS: ${{ inputs.push_platforms }}
        SAVE_ARTIFACT: ${{ inputs.save_artifact }}
        ARTIFACT_NAME: ${{ inputs.artifact_name }}
        IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true }}
      run: |
        set -euo pipefail

        # develop_tag is only added on main; all other tag handling (trimming,
        # de-duplication, primary-tag selection, empty check) lives in the script.
        IMAGE_TAGS="${RAW_IMAGE_TAGS}"
        if [[ "${IS_MAIN_REF}" == "true" && -n "${DEVELOP_TAG}" ]]; then
          IMAGE_TAGS="${IMAGE_TAGS:+${IMAGE_TAGS},}${DEVELOP_TAG}"
        fi
        export IMAGE_TAGS

        ARGS=()
        if [[ "${PUSH_IMAGE}" == "true" ]]; then
          ARGS+=(--push --platforms "${PUSH_PLATFORMS}")
        fi
        if [[ "${SAVE_ARTIFACT}" == "true" ]]; then
          ARGS+=(--save-to "${ARTIFACT_NAME}-docker-image.tar.gz")
        fi
        # Fork PRs cannot read the registry cache (no registry credentials).
        if [[ "${IS_FORK_PR}" == "true" ]]; then
          ARGS+=(--no-registry-cache)
        fi

        "${GITHUB_WORKSPACE}/scripts/docker/build-image.sh" "${ARGS[@]+"${ARGS[@]}"}"

    - name: Upload Docker image artifact
      if: ${{ inputs.save_artifact == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.artifact_name }}-docker-image.tar.gz

