name: 'Setup Besu in Maven Local (artifact fast path)'

description: >
  Restores the Besu artifacts (maven-local tree + source distribution tarball) uploaded by the
  prepare-linea-besu-maven job in main.yml. This action is a
  no-op when the Besu BOM for besuCommit (gradle/libs.versions.toml) is already available in a
  remote maven repo.

outputs:
  besu_version:
    description: 'Resolved Besu version (e.g. 26.9.0-ee9c64c)'
    value: ${{ steps.resolve_besu_version.outputs.besu_version }}
  distribution_restored:
    description: 'true when the prebuilt Besu artifacts were restored from the workflow artifact'
    value: ${{ steps.verify_restore.outputs.distribution_restored }}

runs:
  using: 'composite'
  steps:
    - name: Read besuCommit from gradle/libs.versions.toml
      id: read_besu_commit
      shell: bash
      run: |
        BESU_COMMIT=$(grep -E '^besuCommit\s*=' gradle/libs.versions.toml | sed -E 's/^[^"]*"([^"]+)".*/\1/')
        if [ -z "$BESU_COMMIT" ]; then
          echo "Failed to parse besuCommit from gradle/libs.versions.toml" >&2
          exit 1
        fi
        echo "besu_commit=$BESU_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Resolve Besu version
      id: resolve_besu_version
      shell: bash
      env:
        BESU_COMMIT: ${{ steps.read_besu_commit.outputs.besu_commit }}
      run: |
        # Fast path: reuse the cache file when it already matches besuCommit.
        if [ -f linea-besu/besu/.besu-resolved ]; then
          CACHED_COMMIT=$(grep -E '^besuCommit=' linea-besu/besu/.besu-resolved | cut -d= -f2 | tr -d '[:space:]')
          CACHED_VERSION=$(grep -E '^besuVersion=' linea-besu/besu/.besu-resolved | cut -d= -f2 | tr -d '[:space:]')
        fi
        if [ -n "${CACHED_COMMIT:-}" ] && [ "$CACHED_COMMIT" = "$BESU_COMMIT" ] && [ -n "${CACHED_VERSION:-}" ]; then
          RESOLVED_BESU_VERSION="$CACHED_VERSION"
        else
          # Partial-clone the besu repo (commit graph + tags only) and resolve the version.
          RESOLVED_BESU_VERSION=$(
            BESU_DIR="$GITHUB_WORKSPACE/tmp/besu-eth" \
            BESU_COMMIT="$BESU_COMMIT" \
            VERSION_LABEL="" \
            SKIP_CHECKOUT_AFTER_CLONE="true" \
              bash linea-besu/besu/scripts/checkout-and-resolve-version.sh | tail -n 1 | tr -d '[:space:]'
          )
        fi
        if [ -z "$RESOLVED_BESU_VERSION" ]; then
          echo "Failed to resolve Besu version for besuCommit $BESU_COMMIT" >&2
          exit 1
        fi
        echo "besu_version=$RESOLVED_BESU_VERSION" >> "$GITHUB_OUTPUT"
        echo "Resolved Besu version: $RESOLVED_BESU_VERSION"

    - name: Check Besu BOM availability in remote maven
      id: check_bom
      shell: bash
      env:
        RESOLVED_BESU_VERSION: ${{ steps.resolve_besu_version.outputs.besu_version }}
      run: |
        BOM_PATH="org/hyperledger/besu/bom/${RESOLVED_BESU_VERSION}/bom-${RESOLVED_BESU_VERSION}.pom"
        for BASE in \
          "https://artifacts.consensys.net/public/linea-besu/maven" \
          "https://repo.maven.apache.org/maven2" \
          "https://hyperledger.jfrog.io/hyperledger/besu-maven"; do
          if curl -sfI --connect-timeout 5 --max-time 10 "${BASE}/${BOM_PATH}" > /dev/null 2>&1; then
            echo "Besu BOM ${RESOLVED_BESU_VERSION} found at ${BASE}; skipping artifact restore"
            echo "bom_available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "Besu BOM ${RESOLVED_BESU_VERSION} not found in any remote maven repo"
        echo "bom_available=false" >> "$GITHUB_OUTPUT"

    - name: Download Besu artifacts
      id: download_artifacts
      if: ${{ steps.check_bom.outputs.bom_available == 'false' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: linea-besu-dist-${{ steps.resolve_besu_version.outputs.besu_version }}
        path: /tmp/linea-besu-dist

    - name: Restore maven local and Besu distribution
      id: verify_restore
      if: ${{ steps.check_bom.outputs.bom_available == 'false' }}
      shell: bash
      env:
        RESOLVED_BESU_VERSION: ${{ steps.resolve_besu_version.outputs.besu_version }}
      run: |
        set -e
        STAGE="/tmp/linea-besu-dist"
        DIST_TGZ="$STAGE/besu-${RESOLVED_BESU_VERSION}.tar.gz"
        M2_BESU="$STAGE/m2-repo/org/hyperledger/besu"
        if [ ! -f "$DIST_TGZ" ] || [ ! -d "$M2_BESU" ]; then
          echo "::warning::Artifact linea-besu-dist-${RESOLVED_BESU_VERSION} is missing or incomplete; falling back to the on-demand Besu source build"
          echo "distribution_restored=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # 1. Restore the maven-local tree published by the prepare job.
        mkdir -p ~/.m2/repository/org/hyperledger
        cp -r "$M2_BESU" ~/.m2/repository/org/hyperledger/
        if [ -d "$STAGE/m2-repo/besu" ]; then
          cp -r "$STAGE/m2-repo/besu" ~/.m2/repository/
        fi
        # 2. Restore the distribution tarball where the Gradle check expects it.
        mkdir -p tmp/besu-eth/build/distributions
        cp "$DIST_TGZ" tmp/besu-eth/build/distributions/
        echo "Restored Besu ${RESOLVED_BESU_VERSION} (maven local + distribution) from workflow artifact"
        echo "distribution_restored=true" >> "$GITHUB_OUTPUT"
