name: 'Setup Besu in Maven Local (artifact fast path)'

description: >
  Restores the Besu source distribution tarball (besu-<version>.tar.gz) uploaded by the
  prepare-linea-besu-maven job into tmp/besu-eth/build/distributions/, then publishes the
  Besu jars/BOM into ~/.m2/repository via publishToMavenLocal. This is the fast path used by
  testing.yml jobs when the Besu version pinned by besuCommit (gradle/libs.versions.toml) is
  not yet available in any remote maven repo, so each test job can skip the multi-minute
  on-demand Besu source build. When the Besu BOM is already available in a remote maven repo
  the whole action is a no-op (except the cheap version resolution) and the existing Gradle
  logic in linea-besu/besu/build.gradle consumes the remote artifacts as before.

outputs:
  besu_version:
    description: 'Resolved Besu version (e.g. 26.9.0-ee9c64c), empty when resolution failed'
    value: ${{ steps.resolve_besu_version.outputs.besu_version }}
  distribution_restored:
    description: 'true when the prebuilt Besu distribution was restored from the workflow artifact'
    value: ${{ steps.restore_distribution.outputs.distribution_restored }}

runs:
  using: 'composite'
  steps:
    - name: Read besuCommit from gradle/libs.versions.toml
      id: read_besu_commit
      shell: bash
      run: |
        BESU_COMMIT=$(grep -E '^besuCommit\s*=' gradle/libs.versions.toml | sed -E 's/^[^"]*"([^"]+)".*/\1/')
        if [ -z "$BESU_COMMIT" ]; then
          echo "Failed to parse besuCommit from gradle/libs.versions.toml" >&2
          exit 1
        fi
        echo "besu_commit=$BESU_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Resolve Besu version
      id: resolve_besu_version
      shell: bash
      env:
        BESU_COMMIT: ${{ steps.read_besu_commit.outputs.besu_commit }}
      run: |
        # Fast path: reuse the cache file when it already matches besuCommit.
        if [ -f linea-besu/besu/.besu-resolved ]; then
          CACHED_COMMIT=$(grep -E '^besuCommit=' linea-besu/besu/.besu-resolved | cut -d= -f2 | tr -d '[:space:]')
          CACHED_VERSION=$(grep -E '^besuVersion=' linea-besu/besu/.besu-resolved | cut -d= -f2 | tr -d '[:space:]')
        fi
        if [ -n "${CACHED_COMMIT:-}" ] && [ "$CACHED_COMMIT" = "$BESU_COMMIT" ] && [ -n "${CACHED_VERSION:-}" ]; then
          BESU_VERSION="$CACHED_VERSION"
        else
          # Partial-clone the besu repo (commit graph + tags only) and resolve the version.
          BESU_VERSION=$(
            BESU_DIR="$GITHUB_WORKSPACE/tmp/besu-eth" \
            BESU_COMMIT="$BESU_COMMIT" \
            VERSION_LABEL="" \
            SKIP_CHECKOUT_AFTER_CLONE="true" \
              bash linea-besu/besu/scripts/checkout-and-resolve-version.sh | tail -n 1 | tr -d '[:space:]'
          )
        fi
        if [ -z "$BESU_VERSION" ]; then
          echo "Failed to resolve Besu version for besuCommit $BESU_COMMIT" >&2
          exit 1
        fi
        echo "besu_version=$BESU_VERSION" >> "$GITHUB_OUTPUT"
        echo "Resolved Besu version: $BESU_VERSION"

    - name: Check Besu BOM availability in remote maven
      id: check_bom
      shell: bash
      env:
        BESU_VERSION: ${{ steps.resolve_besu_version.outputs.besu_version }}
      run: |
        BOM_PATH="org/hyperledger/besu/bom/${BESU_VERSION}/bom-${BESU_VERSION}.pom"
        for BASE in \
          "https://artifacts.consensys.net/public/linea-besu/maven" \
          "https://repo.maven.apache.org/maven2" \
          "https://hyperledger.jfrog.io/hyperledger/besu-maven"; do
          if curl -sfI --connect-timeout 5 --max-time 10 "${BASE}/${BOM_PATH}" > /dev/null 2>&1; then
            echo "Besu BOM ${BESU_VERSION} found at ${BASE}"
            echo "bom_available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "Besu BOM ${BESU_VERSION} not found in any remote maven repo"
        echo "bom_available=false" >> "$GITHUB_OUTPUT"

    - name: Restore Besu distribution artifact
      id: restore_distribution
      if: ${{ steps.check_bom.outputs.bom_available == 'false' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: linea-besu-dist-${{ steps.resolve_besu_version.outputs.besu_version }}
        path: tmp/besu-eth/build/distributions

    - name: Record restore outcome
      id: restore_outcome
      if: ${{ steps.check_bom.outputs.bom_available == 'false' }}
      shell: bash
      env:
        BESU_VERSION: ${{ steps.resolve_besu_version.outputs.besu_version }}
      run: |
        DIST="tmp/besu-eth/build/distributions/besu-${BESU_VERSION}.tar.gz"
        if [ -f "$DIST" ]; then
          echo "Restored $DIST from workflow artifact"
          echo "distribution_restored=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Artifact linea-besu-dist-${BESU_VERSION} was not found; falling back to the on-demand Besu source build"
          echo "distribution_restored=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish restored Besu distribution to maven local
      if: ${{ steps.restore_outcome.outputs.distribution_restored == 'true' }}
      shell: bash
      env:
        BESU_VERSION: ${{ steps.resolve_besu_version.outputs.besu_version }}
        BESU_COMMIT: ${{ steps.read_besu_commit.outputs.besu_commit }}
      run: |
        set -e
        # The restored tarball is extracted under tmp/besu-eth/, so the checkout script's
        # git-checkout path cleans it up via `git reset --hard`. Check out at besuCommit in a
        # scratch clone, publishToMavenLocal from there, then move the restored tarball back.
        SCRATCH_DIR="$GITHUB_WORKSPACE/tmp/besu-publish-scratch"
        mkdir -p tmp
        git clone --shared --no-checkout "$GITHUB_WORKSPACE/tmp/besu-eth" "$SCRATCH_DIR"
        (cd "$SCRATCH_DIR" && git checkout "$BESU_COMMIT")
        (cd "$SCRATCH_DIR" && ./gradlew -Prelease.releaseVersion="$BESU_VERSION" -Pversion="$BESU_VERSION" publishToMavenLocal)
        rm -rf tmp/besu-eth
        mkdir -p tmp/besu-eth/build/distributions
        # Recover the distribution tarball from the scratch clone (it was extracted there too).
        mv "$SCRATCH_DIR/build/distributions/besu-${BESU_VERSION}.tar.gz" tmp/besu-eth/build/distributions/
        rm -rf "$SCRATCH_DIR"
        echo "Published Besu ${BESU_VERSION} to maven local from the cached distribution"
