name: 'Setup Go with shared cache'
description: 'Keep setup-go caching on main and restore the same caches without saving on other refs.'
inputs:
  go-version:
    description: >
      Go version to install. Takes precedence over go-version-file. When neither is set, the
      highest `go` directive across all go.mod files in the repository is used.
    default: ''
  go-version-file:
    description: >
      Path to a go.mod (or go.work) file whose `go` directive sets the version to install.
      Used when go-version is empty; when both are empty, the highest `go` directive across
      all go.mod files in the repository is used.
    default: ''
  architecture:
    description: 'Optional target architecture for setup-go'
    default: ''
  cache:
    description: 'Set false to disable both cache restore and save.'
    default: 'true'
  cache-dependency-path:
    description: 'Files hashed for the dependency cache, matching setup-go.'
    default: 'go.mod'
  cache-go-build:
    description: >
      Set true to also cache the Go build cache (~/.cache/go-build and its macOS/Windows equivalents)
      under a key made of the runner OS and the hash of go-build-cache-hash-files. Restored on every
      ref, saved only on main (see the shared cache action).
    default: 'false'
  go-build-cache-hash-files:
    description: 'Files hashed into the go-build cache key; only used when cache-go-build is true.'
    default: '**/go.sum'
runs:
  using: composite
  steps:
    - name: Resolve Go version
      id: version
      shell: bash
      env:
        GO_VERSION: ${{ inputs.go-version }}
        GO_VERSION_FILE: ${{ inputs.go-version-file }}
      run: |
        # Precedence: go-version, then go-version-file, then the highest go directive in the repo.
        # A newer toolchain builds modules with older go directives, so the highest one covers
        # every module with a single install and avoids per-run toolchain downloads.
        if [ -n "$GO_VERSION" ]; then
          version="$GO_VERSION"
        elif [ -n "$GO_VERSION_FILE" ]; then
          if [ ! -f "$GO_VERSION_FILE" ]; then
            echo "::error::go-version-file '$GO_VERSION_FILE' not found"
            exit 1
          fi
          version=$(grep -h -m1 -E '^go [0-9]' "$GO_VERSION_FILE" | awk '{ print $2 }')
        else
          version=$(find . -name go.mod -not -path '*/node_modules/*' -exec grep -h -m1 -E '^go [0-9]' {} + | awk '{ print $2 }' | sort -V | tail -n 1)
        fi
        if [ -z "$version" ]; then
          echo "::error::Could not determine a Go version (no go-version set and no go directive found)"
          exit 1
        fi
        echo "Using Go $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      id: go
      with:
        go-version: ${{ steps.version.outputs.version }}
        architecture: ${{ inputs.architecture }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
        cache: ${{ inputs.cache == 'true' && github.ref == 'refs/heads/main' && !startsWith(github.event_name, 'pull_request') }}
    - name: Locate the setup-go cache
      id: cache
      if: ${{ inputs.cache == 'true' && (github.ref != 'refs/heads/main' || startsWith(github.event_name, 'pull_request')) }}
      shell: bash
      run: |
        # Match setup-go v6: runtime architecture (not the target Go architecture),
        # ImageOS on Linux, and GOMODCACHE then GOCACHE in that order.
        arch=$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
        image=""
        if [ "$RUNNER_OS" = Linux ]; then image="${ImageOS:-undefined}-"; fi
        {
          echo "prefix=setup-go-${RUNNER_OS}-${arch}-${image}go-"
          echo 'paths<<CACHE_PATHS'
          go env GOMODCACHE
          go env GOCACHE
          echo CACHE_PATHS
        } >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      id: restore
      if: ${{ steps.cache.outcome == 'success' && hashFiles(inputs.cache-dependency-path) != '' }}
      with:
        path: ${{ steps.cache.outputs.paths }}
        key: ${{ steps.cache.outputs.prefix }}${{ steps.go.outputs.go-version }}-${{ hashFiles(inputs.cache-dependency-path) }}
        # Reuse main's cache when dependencies change; Go fetches missing modules.
        restore-keys: ${{ steps.cache.outputs.prefix }}${{ steps.go.outputs.go-version }}-
    - name: Cache the Go build cache
      if: ${{ inputs.cache-go-build == 'true' }}
      uses: ./.github/actions/cache
      with:
        path: |
          ~/.cache/go-build
          ~/Library/Caches/go-build
          %LocalAppData%\go-build
        key: ${{ runner.os }}-go-${{ hashFiles(inputs.go-build-cache-hash-files) }}
        restore-keys: |
          ${{ runner.os }}-go-
