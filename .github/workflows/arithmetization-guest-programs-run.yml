name: Tracer guest programs run - l2-execution, Add in Zig and Blake in Rust

on:
  pull_request:
    branches:
      - main
    paths:
      - 'arithmetization/**'
      - 'riscv-guests/l2-execution/**'
      - 'riscv-guests/build_common/**'
      - 'riscv-guests/lineth-accelerators/**'
      - '.github/actions/setup-arithmetization-riscv/**'
      - '.github/workflows/arithmetization-*.yml'
  push:
    branches:
     - main
    paths:
     - 'arithmetization/**'
     - 'riscv-guests/l2-execution/**'
     - 'riscv-guests/build_common/**'
     - 'riscv-guests/lineth-accelerators/**'
     - '.github/actions/setup-arithmetization-riscv/**'
     - '.github/workflows/arithmetization-*.yml'
  workflow_call:
    inputs:
      zkc-ref:
        description: 'Optional zkc commit/branch/tag (default: arithmetization/Makefile ZKC_REF)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      zkc-ref:
        description: 'Optional zkc commit/branch/tag (default: arithmetization/Makefile ZKC_REF)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sample-guest-programs-run:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    env:
      ZKC_EXEC_FLAGS: "--fast"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Setup Environment
        uses: ./.github/actions/setup-arithmetization-riscv
        with:
          zkc-ref: ${{ inputs.zkc-ref }}

      - name: Install zkc and run simple Zig guest program with zkc interpreter
        # IN_BYTES values not used in the sum test program but is still written in memory
        run: make TEST=test.zig IN_BYTES="0xAABB" IN_ORIGIN=0x08800000
        working-directory: arithmetization/src/test
        timeout-minutes: 6

      - name: Run Blake rust against test vectors with zkc interpreter
        run: make blake-rust-exec
        working-directory: arithmetization/src/test
        timeout-minutes: 30

      # Builds sha2_provider.zig with SHA2_ACCEL=true (the Zig SHA-256 wrapper) and runs it through
      # the full interpreter, exercising the R_EVM_SHA2 custom-op dispatch. The target forces tracing
      # mode (ZKC_EXEC_FLAGS=) because the interpreter's fast backend currently fails on an unrelated
      # pre-existing instruction; the guest is self-checking and exits non-zero on any mismatch.
      - name: Run SHA-256 accelerator guest with zkc interpreter
        run: make sha2-zig-exec
        working-directory: arithmetization/src/test
        timeout-minutes: 30

      - name: Run l2-execution guest program with zkc interpreter
        run: make -C riscv-guests/l2-execution exec
        timeout-minutes: 30
        env:
          INPUT: test/testdata/stateless_input.ssz
          KECCAK_ACCEL: true

