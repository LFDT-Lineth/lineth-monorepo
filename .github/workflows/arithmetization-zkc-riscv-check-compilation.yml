name: Tracer riscv-constraints check compilation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'arithmetization/**'
      - 'riscv-guests/Makefile'
      - '.github/actions/setup-arithmetization-riscv/**'
      - '.github/actions/setup-zig/**'
      - '.github/workflows/arithmetization-zkc-riscv-check-compilation.yml'
      - '.github/workflows/arithmetization-*.yml'
  push:
    branches:
     - main
    paths:
     - 'arithmetization/**'
     - 'riscv-guests/Makefile'
     - '.github/actions/setup-arithmetization-riscv/**'
     - '.github/actions/setup-zig/**'
     - '.github/workflows/arithmetization-zkc-riscv-check-compilation.yml'
     - '.github/workflows/arithmetization-*.yml'
  workflow_call:
    inputs:
      zkc-ref:
        description: 'Optional zkc commit/branch/tag (default: version pinned in arithmetization/go.mod)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      zkc-ref:
        description: 'Optional zkc commit/branch/tag (default: version pinned in arithmetization/go.mod)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  check-compilation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Setup Environment
        uses: ./.github/actions/setup-arithmetization-riscv
        with:
          zkc-ref: ${{ inputs.zkc-ref }}
          # Share caches for go.mod-pinned runs from trusted refs; fork PRs and custom ZKC refs must not write to shared caches.
          cache-save: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && inputs.zkc-ref == '' }}

      - name: Check compilation of RISC-V in ZkC
        run: make -C arithmetization riscv-check-compilation

      - name: Linting Check
        run: make -C arithmetization riscv-check-lint
