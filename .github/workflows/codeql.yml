name: CodeQL

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1' # Every Monday at 03:25 UTC

jobs:
  changes:
    name: Detect Changes
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    outputs:
      languages: ${{ steps.set-matrix.outputs.languages }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 #v3.0.2
        id: changes
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
            java-kotlin:
              - '**/*.java'
              - '**/*.kt'
              - '**/*.gradle'
              - '**/*.gradle.kts'
              - '**/pom.xml'
              - '**/build.gradle'
              - '**/gradle.properties'
              - '**/settings.gradle'
              - 'build.gradle'
              - 'gradle.properties'
              - 'settings.gradle'
              - 'gradle/**'
            javascript-typescript:
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.jsx'
              - '**/*.json'
              - '**/package.json'
              - '**/tsconfig.json'
              - '**/pnpm-lock.yaml'
              - '**/yarn.lock'
              - '**/package-lock.json'
            actions:
              - '.github/workflows/**'
              - '.github/actions/**'
            python:
              - '**/*.py'
              - '**/requirements.txt'
              - '**/pyproject.toml'
              - '**/setup.py'
              - '**/Pipfile'
      - name: Build matrix
        id: set-matrix
        run: |
          # Scheduled and manual runs analyze all languages
          if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo 'languages=["go","java-kotlin","javascript-typescript","actions","python"]' >> $GITHUB_OUTPUT
            exit 0
          fi

          languages=()
          if [ "${{ steps.changes.outputs.go }}" == "true" ]; then languages+=("\"go\""); fi
          if [ "${{ steps.changes.outputs.java-kotlin }}" == "true" ]; then languages+=("\"java-kotlin\""); fi
          if [ "${{ steps.changes.outputs.javascript-typescript }}" == "true" ]; then languages+=("\"javascript-typescript\""); fi
          if [ "${{ steps.changes.outputs.actions }}" == "true" ]; then languages+=("\"actions\""); fi
          if [ "${{ steps.changes.outputs.python }}" == "true" ]; then languages+=("\"python\""); fi

          echo "languages=[$(IFS=,; echo "${languages[*]}")]" >> $GITHUB_OUTPUT

  analyze:
    name: Analyze
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    needs: changes
    if: ${{ needs.changes.outputs.languages != '[]' }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.changes.outputs.languages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e #v4.36.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-java-and-gradle

      - name: Setup Tracer Environment
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-tracer-environment

      - name: Autobuild
        if: matrix.language != 'actions'
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e #v4.36.2
        env:
          GITHUB_TOKEN: ${{ secrets._GITHUB_TOKEN_RELEASE_ACCESS }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e #v4.36.2
        with:
          category: "/language:${{matrix.language}}"
          output: sarif-results

      - name: Upload CodeQL Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-results-${{ matrix.language }}
          path: sarif-results
          retention-days: 1
