name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        description: >
          JSON array of languages to analyze, already computed by the caller with
          ./.github/actions/codeql-languages. Leave empty to detect them here.
        required: false
        type: string
        default: ''
  workflow_dispatch:
  schedule:
    - cron: '25 3 * * 1' # Every Monday at 03:25 UTC

jobs:
  changes:
    name: Detect Changes
    # Callers that already ran ./.github/actions/codeql-languages pass the result
    # in, so this job doesn't need a runner of its own.
    if: ${{ inputs.languages == '' }}
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect CodeQL languages
        id: languages
        uses: ./.github/actions/codeql-languages

  analyze:
    name: Analyze
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    needs: changes
    # !cancelled(): still run when `changes` was skipped because the caller passed languages.
    if: >
      !cancelled() &&
      needs.changes.result != 'failure' &&
      (inputs.languages || needs.changes.outputs.languages || '[]') != '[]'
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(inputs.languages || needs.changes.outputs.languages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CodeQL expects every toolchain to be installed before `init` (it records `which go`
      # there and warns if Go changes afterwards), so Go is set up first.
      - name: Detect Go version
        if: matrix.language == 'go'
        id: go-version
        shell: bash
        run: |
          # Highest `go` directive across all modules: a newer toolchain builds modules with
          # older directives, and this avoids per-run toolchain downloads (the runner image
          # ships an older Go). Deriving it keeps this in step with go.mod bumps.
          version=$(find . -name go.mod -not -path '*/node_modules/*' -exec grep -h -m1 -E '^go [0-9]' {} + | awk '{ print $2 }' | sort -V | tail -n 1)
          if [ -z "$version" ]; then
            echo "::error::No go.mod with a go directive found"
            exit 1
          fi
          echo "Using Go $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: matrix.language == 'go'
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          # CodeQL's dependency-caching already manages the Go module cache.
          cache: "false"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml
          # Only main populates shared dependencies; PRs restore without saving duplicates.
          dependency-caching: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event_name, 'pull_request') && 'full' || 'restore' }}

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-java-and-gradle

      - name: Setup Tracer Environment
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-tracer-environment

      # Kotlin 2.4.0 (bumped in #3454) isn't supported yet by CodeQL's Kotlin
      # extractor: github/codeql#21938. Non-blocking until upstream adds support;
      # remove continue-on-error from this and the next two steps once it does.
      - name: Autobuild
        if: matrix.language != 'actions'
        continue-on-error: ${{ matrix.language == 'java-kotlin' }}
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        env:
          GITHUB_TOKEN: ${{ secrets._GITHUB_TOKEN_RELEASE_ACCESS }}

      - name: Perform CodeQL Analysis
        continue-on-error: ${{ matrix.language == 'java-kotlin' }}
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{matrix.language}}"
          output: sarif-results

      - name: Upload CodeQL Results
        continue-on-error: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-results-${{ matrix.language }}
          path: sarif-results
          retention-days: 1

