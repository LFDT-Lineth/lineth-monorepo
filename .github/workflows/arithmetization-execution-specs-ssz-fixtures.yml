name: arithmetization execution-specs SSZ fixtures

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run-fixtures:
    name: l2-execution execution-specs SSZ fixtures
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup RISC-V guests environment
        uses: ./.github/actions/setup-riscv-guests

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.25.7
          cache-dependency-path: "**/*.sum"

      - name: Install zkc
        run: make -C arithmetization install-zkc

      - name: Run execution-specs SSZ fixtures
        env:
          ZKC_REF: ""
        run: make -C riscv-guests/l2-execution run-execution-specs-ssz-fixtures
