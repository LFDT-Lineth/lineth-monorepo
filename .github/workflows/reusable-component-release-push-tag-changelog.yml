name: "Reusable: Component Release Push Tag and Changelog"

on:
  workflow_call:
    inputs:
      component-name:
        description: "Component name — used to derive tag pattern (e.g. coordinator, postman)"
        required: true
        type: string
      folder-name:
        description: "Folder name of the component which hosts CHANGELOG.md (e.g. linea-besu's home folder is linea-besu/package)"
        required: true
        type: string
      include-path:
        description: >
          newline-separated string to represent the "git-cliff --include-path filter".
          Optional — defaults to component-name's entry in
          .github/actions/run-git-cliff-commands/scripts/components.sh.
        required: false
        type: string
        default: ''
      scopes:
        description: >
          Regex alternation of conventional-commit scopes to gate on (e.g. 'coordinator' or
          'linea-besu|tracer|sequencer|deps|misc'). Optional — defaults to component-name's
          entry in .github/actions/run-git-cliff-commands/scripts/components.sh.
        required: false
        type: string
        default: ''
      release_tag_suffix:
        description: "Custom tag release tag suffix, i.e. releases/[component]/v[semver]-[suffix]"
        required: false
        type: string
        default: ''
      upload_changelog:
        description: "Upload the updated CHANGELOG.md and skip pushing the commit or creating PR"
        required: false
        type: boolean
        default: false
      create_pull_request:
        description: "Create PR instead of direct commit"
        required: false
        type: boolean
        default: false
      compute_docker_tag:
        description: "Also compute the docker image tag ([semver]-[YYYYMMDD]-[commit][-suffix]) once the release tag is pushed"
        required: false
        type: boolean
        default: false
      image_tag_suffix:
        description: "Custom docker image tag suffix; only used when compute_docker_tag is true"
        required: false
        type: string
        default: ''
    outputs:
      release_tag:
        description: "Full release tag (e.g. releases/coordinator/v0.2.0)"
        value: ${{ jobs.release-component.outputs.release_tag }}
      release_version:
        description: "Bare semver (e.g. 0.2.0)"
        value: ${{ jobs.release-component.outputs.release_version }}
      changelog:
        description: "Latest changelog section content"
        value: ${{ jobs.release-component.outputs.changelog }}
      docker_tag:
        description: "Docker image tag base (without suffix); empty unless compute_docker_tag is true"
        value: ${{ jobs.release-component.outputs.docker_tag }}
      docker_tag_with_suffix:
        description: "Docker image tag with suffix (same value as docker_tag if no suffix is given); empty unless compute_docker_tag is true"
        value: ${{ jobs.release-component.outputs.docker_tag_with_suffix }}

jobs:
  release-component:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    # upload_changelog never creates the release bot token, so it needs no environment.
    environment: ${{ !inputs.create_pull_request && !inputs.upload_changelog && (github.ref == 'refs/heads/main' && 'release-bot' || 'release-bot-approval') || '' }}
    permissions:
      contents: write
      pull-requests: write
    name: Release ${{ inputs.component-name }} (push changelog + tag)
    outputs:
      release_tag: ${{ steps.prepend-changelog.outputs.next_tag }}
      release_version: ${{ steps.prepend-changelog.outputs.next_version }}
      changelog: ${{ steps.prepend-changelog.outputs.changelog_content }}
      docker_tag: ${{ steps.docker-tag.outputs.dockertag }}
      docker_tag_with_suffix: ${{ steps.docker-tag.outputs.dockertag_with_suffix }}
    steps:
      # Mint a short-lived token either for the release bot GitHub App to commit the changelog changes
      # directly bypassin the branch-protection or for PR bot GitHub App to create PR with the changelog changes.
      - name: Generate release or PR bot App token
        id: app-token
        if: ${{ !inputs.upload_changelog }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ !inputs.create_pull_request && secrets.RELEASE_BOT_APP_ID || secrets.CREATE_GITHUB_PR_APP_ID }}
          private-key: ${{ !inputs.create_pull_request && secrets.RELEASE_BOT_PRIVATE_KEY || secrets.CREATE_GITHUB_PR_PRIVATE_KEY }}

      # Look up the App's bot user id so the commit author email follows
      # GitHub's canonical noreply format and shows up under the App in the UI.
      - name: Resolve bot user id
        id: bot-user
        if: ${{ !inputs.upload_changelog }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          echo "user-id=${user_id}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use the App token so subsequent `git push` is authenticated as the App.
          token: ${{ (!inputs.upload_changelog && steps.app-token.outputs.token) ||  github.token }}
          # Outside main, run the approved commit rather than whatever the branch tip is now.
          ref: ${{ github.ref == 'refs/heads/main' && github.ref_name || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Configure git identity for app bot
        if: ${{ !inputs.upload_changelog }}
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.bot-user.outputs.user-id }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Configure git identity for push tag use
        if: ${{ inputs.upload_changelog }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install git-cliff
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: git-cliff

      # Stamp the prepended entry with the bare semver (e.g. "## [0.2.0] - 2026-04-27")
      - name: Generate and prepend release changelog section
        id: prepend-changelog
        uses: ./.github/actions/run-git-cliff-commands
        with:
          component-name: ${{ inputs.component-name }}
          folder-name: ${{ inputs.folder-name }}
          include-path: ${{ inputs.include-path }}
          scopes: ${{ inputs.scopes }}
          release_tag_suffix: ${{ inputs.release_tag_suffix }}
          prepend-changelog: 'true'
          # This workflow commits and pushes CHANGELOG.md below, so fast-forward to the
          # latest push on this branch first to dodge a race with a concurrent writer.
          # Safe here: this workflow is only reachable via workflow_dispatch release
          # pipelines, so github.head_ref is always empty (never a pull_request/fork ref).
          # Outside main, skip the fast-forward to the branch tip so git-cliff runs on the approved commit.
          target-ref: ${{ github.ref == 'refs/heads/main' && github.ref_name || '' }}
          generate-changelog-with-next-tag-version: 'true'

      - name: Commit and push ${{ inputs.component-name }}/CHANGELOG.md
        if: ${{ !inputs.upload_changelog && !inputs.create_pull_request }}
        uses: ./.github/actions/commit-and-push
        with:
          paths: ${{ inputs.folder-name }}/CHANGELOG.md
          message: "chore(${{ inputs.component-name == 'linea-besu-package' && 'linea-besu' || inputs.component-name }}): update CHANGELOG.md for ${{ steps.prepend-changelog.outputs.next_tag }} release [skip ci]"

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        if: ${{ !inputs.upload_changelog && inputs.create_pull_request }}
        id: create-pull-request
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(${{ inputs.component-name == 'linea-besu-package' && 'linea-besu' || inputs.component-name }}): update CHANGELOG.md for ${{ steps.prepend-changelog.outputs.next_tag }} release [skip ci]"
          branch: ci/chore-${{ inputs.component-name == 'linea-besu-package' && 'linea-besu' || inputs.component-name }}-changelog-update-release-v${{ steps.prepend-changelog.outputs.next_version }}
          base: ${{ github.head_ref || github.ref_name }}
          title: "chore(${{ inputs.component-name == 'linea-besu-package' && 'linea-besu' || inputs.component-name }}): update CHANGELOG.md for ${{ steps.prepend-changelog.outputs.next_tag }} release [skip ci]"
          add-paths: ${{ inputs.folder-name }}/CHANGELOG.md

      - name: Upload CHANGELOG.md artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.upload_changelog }}
        with:
          name: prepended-changelog-${{ inputs.component-name }}
          path: ${{ inputs.folder-name }}/CHANGELOG.md

      - name: Create and push ${{ inputs.component-name }} release tag
        uses: ./.github/actions/create-release-tag
        with:
          tag: ${{ steps.prepend-changelog.outputs.next_tag }}
          component: ${{ inputs.component-name }}
          # Pin the release tag to the commit that triggered the workflow, not to the
          # (possibly changelog-update) HEAD the checkout fast-forwarded to. The docker
          # image is built and named from the same commit, so tag and image stay aligned.
          target: ${{ github.sha }}

      # compute-version-tags resolves github.sha (the commit that triggered the workflow), not
      # HEAD, so the docker tag embeds that commit's short SHA even though this checkout may sit
      # on a later CHANGELOG.md update commit. The full-history checkout above also satisfies the
      # github.sha~1 lookup.
      - name: Compute version tags
        id: version-tags
        if: ${{ inputs.compute_docker_tag }}
        uses: ./.github/actions/compute-version-tags

      - name: Compute docker tag
        id: docker-tag
        if: ${{ inputs.compute_docker_tag }}
        uses: ./.github/actions/compute-docker-tag
        with:
          version_prefix: ${{ steps.prepend-changelog.outputs.next_version }}
          image_tag_suffix: ${{ inputs.image_tag_suffix }}
          commit_tag: ${{ steps.version-tags.outputs.commit_tag }}
