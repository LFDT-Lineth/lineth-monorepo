name: "Reusable: Run E2E Tests"

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The commit tag to use'
        required: true
        type: string
      e2e-tests-with-ssh:
        description: Run end to end tests with ability to ssh into environment
        required: false
        type: boolean
        default: false
      e2e-tests-logs-dump:
        description: Dump logs after running end to end tests
        required: false
        type: boolean
        default: false
      e2e-tests-containers-list:
        description: List containers before starting end to end tests
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      linea_besu_package_tag:
        required: false
        type: string
        default: ""
      coordinator_tag:
        required: false
        type: string
        default: ""
      postman_tag:
        required: false
        type: string
        default: ""
      prover_tag:
        required: false
        type: string
        default: ""
      tx_exclusion_api_tag:
        required: false
        type: string
        default: ""
      maru_tag:
        required: false
        type: string
        default: ""
      e2e-tests-with-ssh:
        description: Run end to end tests with ability to ssh into environment
        required: false
        type: boolean
        default: false
      e2e-tests-logs-dump:
        description: Dump logs after running end to end tests
        required: false
        type: boolean
        default: false
      e2e-tests-containers-list:
        description: List containers before starting end to end tests
        required: false
        type: boolean
        default: true
      has-changes-requiring-e2e-testing:
        type: string
    outputs:
      tests_outcome:
        value: ${{ jobs.run-e2e-tests.outputs.tests_outcome }}
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  run-e2e-suite:
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.has-changes-requiring-e2e-testing == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        stack: [zkevm, riscv]
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-xl
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run e2e tests
        id: run-e2e-tests
        uses: ./.github/actions/run-e2e-tests
        with:
          stack: ${{ matrix.stack }}
          image_tag: ${{ inputs.image_tag }}
          linea_besu_package_tag: ${{ inputs.linea_besu_package_tag }}
          coordinator_tag: ${{ inputs.coordinator_tag }}
          postman_tag: ${{ inputs.postman_tag }}
          prover_tag: ${{ inputs.prover_tag }}
          tx_exclusion_api_tag: ${{ inputs.tx_exclusion_api_tag }}
          maru_tag: ${{ inputs.maru_tag }}
          e2e-tests-with-ssh: ${{ inputs.e2e-tests-with-ssh }}
          e2e-tests-logs-dump: ${{ inputs.e2e-tests-logs-dump }}
          e2e-tests-containers-list: ${{ inputs.e2e-tests-containers-list }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Keep the existing required check and publish gate dependent on both stacks.
  run-e2e-tests:
    needs: run-e2e-suite
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || inputs.has-changes-requiring-e2e-testing == 'true') }}
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    outputs:
      tests_outcome: ${{ needs.run-e2e-suite.result }}
    steps:
      - name: Check both suites passed
        env:
          RESULT: ${{ needs.run-e2e-suite.result }}
        run: test "$RESULT" = success
