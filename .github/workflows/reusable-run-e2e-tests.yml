name: "Reusable: Run E2E Tests"

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The commit tag to use'
        required: true
        type: string
      stack:
        description: E2E stack to run
        required: false
        type: choice
        options: [riscv, zkevm]
        default: riscv
      riscv_prover_mode:
        description: prover-ray mode for the RISC-V stack (dev-zkvm builds prover-ray from this commit)
        required: false
        type: choice
        options: [dev-mock, dev-zkvm]
        default: dev-mock
      e2e-tests-with-ssh:
        description: Run end to end tests with ability to ssh into environment
        required: false
        type: boolean
        default: false
      e2e-tests-logs-dump:
        description: Dump logs after running end to end tests
        required: false
        type: boolean
        default: false
      e2e-tests-containers-list:
        description: List containers before starting end to end tests
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      # Callers (main, component and milestone releases) default to zkEVM. Do not derive this from
      # github.event_name: in a called workflow it is the caller's event, e.g. a dispatched release.
      stack:
        required: false
        type: string
        default: zkevm
      # RISC-V only: dev-mock uses the pinned prover-ray image; dev-zkvm builds it from this commit.
      riscv_prover_mode:
        required: false
        type: string
        default: dev-mock
      linea_besu_package_tag:
        required: false
        type: string
        default: ""
      coordinator_tag:
        required: false
        type: string
        default: ""
      postman_tag:
        required: false
        type: string
        default: ""
      prover_tag:
        required: false
        type: string
        default: ""
      tx_exclusion_api_tag:
        required: false
        type: string
        default: ""
      maru_tag:
        required: false
        type: string
        default: ""
      e2e-tests-with-ssh:
        description: Run end to end tests with ability to ssh into environment
        required: false
        type: boolean
        default: false
      e2e-tests-logs-dump:
        description: Dump logs after running end to end tests
        required: false
        type: boolean
        default: false
      e2e-tests-containers-list:
        description: List containers before starting end to end tests
        required: false
        type: boolean
        default: true
      has-changes-requiring-e2e-testing:
        type: string
    outputs:
      tests_outcome:
        value: ${{ jobs.run-e2e-tests.outputs.tests_outcome }}
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  run-e2e-suite:
    # Direct dispatch leaves has-changes-requiring-e2e-testing unset, so it always runs.
    if: ${{ inputs.has-changes-requiring-e2e-testing != 'false' }}
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-xl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run e2e tests
        id: run-e2e-tests
        uses: ./.github/actions/run-e2e-tests
        with:
          stack: ${{ inputs.stack }}
          riscv_prover_mode: ${{ inputs.riscv_prover_mode }}
          image_tag: ${{ inputs.image_tag }}
          linea_besu_package_tag: ${{ inputs.linea_besu_package_tag }}
          coordinator_tag: ${{ inputs.coordinator_tag }}
          postman_tag: ${{ inputs.postman_tag }}
          prover_tag: ${{ inputs.prover_tag }}
          tx_exclusion_api_tag: ${{ inputs.tx_exclusion_api_tag }}
          maru_tag: ${{ inputs.maru_tag }}
          e2e-tests-with-ssh: ${{ inputs.e2e-tests-with-ssh }}
          e2e-tests-logs-dump: ${{ inputs.e2e-tests-logs-dump }}
          e2e-tests-containers-list: ${{ inputs.e2e-tests-containers-list }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Preserve the required check and publish gate for the selected stack.
  run-e2e-tests:
    needs: run-e2e-suite
    if: ${{ always() && inputs.has-changes-requiring-e2e-testing != 'false' }}
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    outputs:
      tests_outcome: ${{ needs.run-e2e-suite.result }}
    steps:
      - name: Check selected suite passed
        env:
          RESULT: ${{ needs.run-e2e-suite.result }}
        run: test "$RESULT" = success
