name: Build and Publish Linea Besu

permissions: {}

on:
  workflow_call:

jobs:
  preflight:
    permissions:
      contents: read
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    outputs:
      besu_commit: ${{ steps.besu_commit.outputs.value }}
      version_changed: ${{ steps.check_besu_commit.outputs.version_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read besuCommit
        id: besu_commit
        shell: bash
        run: |
          BESU_COMMIT=$(sed -nE 's/^besuCommit[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)
          if [[ -z "$BESU_COMMIT" ]]; then
            echo "::error::Could not read besuCommit from gradle/libs.versions.toml"
            exit 1
          fi
          echo "value=$BESU_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check besuCommit change
        uses: ./.github/actions/check-lib-version-change
        id: check_besu_commit
        with:
          target_lib: besuCommit
          target_file_path: gradle/libs.versions.toml

  publish:
    needs: preflight
    if: ${{ needs.preflight.outputs.version_changed == 'true' }}
    permissions:
      contents: read
    environment: cloudsmith-publish
    concurrency:
      group: cloudsmith-linea-besu-${{ needs.preflight.outputs.besu_commit }}
      cancel-in-progress: false
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-and-gradle

      - name: Build Besu and publish Maven artifacts to Cloudsmith
        run: ./gradlew :linea-besu:besu:build -PpublishToMaven=true
        env:
          JAVA_OPTS: -Xmx2g -Dorg.gradle.daemon=false
          ORG_GRADLE_PROJECT_cloudsmithUser: ${{ secrets.CLOUDSMITH_USER }}
          ORG_GRADLE_PROJECT_cloudsmithApiKey: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Parse besu version from lib.versions.toml
        id: release_versions
        uses: ./.github/actions/parse-release-versions

      - name: Require Besu distribution
        id: besu_dist
        run: |
          BESU_DIST="tmp/besu-eth/build/distributions/besu-${{ steps.release_versions.outputs.besu_version }}.tar.gz"
          if [[ ! -f "$BESU_DIST" ]]; then
            echo "::error::Expected Besu distribution was not created: $BESU_DIST"
            exit 1
          fi
          echo "path=$BESU_DIST" >> "$GITHUB_OUTPUT"

      - name: Install Cloudsmith CLI
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip python3-venv
          python3 -m venv tmp/cloudsmith-env
          tmp/cloudsmith-env/bin/python -m pip install 'cloudsmith-cli==1.24.0'

      - name: Publish Besu distribution to Cloudsmith
        run: |
          tmp/cloudsmith-env/bin/cloudsmith push raw consensys/linea-besu "$BESU_DIST" \
            --republish \
            --name 'linea-besu.tar.gz' \
            --version "${LINEA_BESU_VERSION}" \
            --summary "Linea Besu ${LINEA_BESU_VERSION} binary distribution" \
            --description "Binary distribution of Linea Besu ${LINEA_BESU_VERSION}." \
            --content-type 'application/tar+gzip'
        env:
          CLOUDSMITH_USER: ${{ secrets.CLOUDSMITH_USER }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          BESU_DIST: ${{ steps.besu_dist.outputs.path }}
          LINEA_BESU_VERSION: ${{ steps.release_versions.outputs.besu_version }}

      - name: Stage resolved Besu cache
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linea-besu-resolved-${{ needs.preflight.outputs.besu_commit }}
          path: linea-besu/besu/.besu-resolved
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  commit-resolved-cache:
    needs: [preflight, publish]
    if: ${{ github.event_name == 'pull_request' && needs.publish.result == 'success' }}
    permissions:
      actions: read
      contents: write
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download resolved Besu cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linea-besu-resolved-${{ needs.preflight.outputs.besu_commit }}
          path: linea-besu/besu

      # The cache file is gitignored for local builds, so CI stages it explicitly.
      - name: Commit and push resolved Besu cache
        env:
          BRANCH: ${{ github.head_ref }}
          EXPECTED_BESU_COMMIT: ${{ needs.preflight.outputs.besu_commit }}
        run: |
          CURRENT_BESU_COMMIT=$(sed -nE 's/^besuCommit[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)
          if [[ "$CURRENT_BESU_COMMIT" != "$EXPECTED_BESU_COMMIT" ]]; then
            echo "::error::PR besuCommit changed while Cloudsmith publishing was awaiting approval"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force linea-besu/besu/.besu-resolved
          if git diff --cached --quiet; then
            echo "No cache updates to commit"
          else
            git commit -m "chore(linea-besu): refresh linea-besu/besu/.besu-resolved after besuCommit bump"
            git push origin "HEAD:$BRANCH"
          fi
