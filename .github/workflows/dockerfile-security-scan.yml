name: Weekly Dockerfile Security Scan

# The KICS GitHub Action is intentionally NOT used: it builds/pulls a mutable
# image tag at run time. Instead we run the KICS image directly, pinned by
# digest. Bump the digest deliberately when upgrading KICS.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Tuesday 04:23 UTC (off the :00/:30 marks)
    - cron: '23 4 * * 2'

permissions:
  security-events: write
  contents: read

jobs:
  kics-scan:
    name: KICS Dockerfile Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run KICS (digest-pinned image)
        # checkmarx/kics@sha256:49ccc... = kics:latest at pin time; bump deliberately.
        run: |
          docker run --rm -t \
            -v "$GITHUB_WORKSPACE:/path" \
            checkmarx/kics@sha256:49ccc54b6ae7f5d5fc95e96f8f95c18c57f3bba047ab611a03d80792bdff6757 \
            scan \
              --path /path \
              --type Dockerfile \
              --output-path /path/kics-results \
              --report-formats sarif \
              --ignore-on-exit results \
              --ci --no-progress

      - name: Upload SARIF to GitHub Security
        if: ${{ !cancelled() && hashFiles('kics-results/results.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: kics-results/results.sarif
          category: kics-dockerfiles
