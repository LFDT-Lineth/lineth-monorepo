name: Weekly Dockerfile Security Scan

# The KICS GitHub Action is intentionally NOT used: it builds/pulls a mutable
# image tag at run time. Instead we run the KICS image directly, pinned by
# digest. Bump the digest deliberately when upgrading KICS.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Tuesday 04:23 UTC (off the :00/:30 marks)
    - cron: '23 4 * * 2'

permissions:
  security-events: write
  contents: read

jobs:
  kics-scan:
    name: KICS Dockerfile Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run KICS (digest-pinned image)
        # checkmarx/kics@sha256:49ccc... = kics:latest at pin time; bump deliberately.
        run: |
          docker run --rm -t \
            -v "$GITHUB_WORKSPACE:/path" \
            checkmarx/kics@sha256:49ccc54b6ae7f5d5fc95e96f8f95c18c57f3bba047ab611a03d80792bdff6757 \
            scan \
              --path /path \
              --type Dockerfile \
              --output-path /path/kics-results \
              --report-formats sarif \
              --ignore-on-exit results \
              --ci --no-progress

      - name: Deduplicate SARIF taxa
        # KICS emits duplicate taxa ids under runs[].taxonomies (e.g. CWE-710
        # once per rule), which code scanning rejects: "taxa contains duplicate
        # item". Dedupe by id before upload.
        if: ${{ !cancelled() && hashFiles('kics-results/results.sarif') != '' }}
        run: |
          jq '(.runs[].taxonomies[]?.taxa) |= unique_by(.id)' \
            kics-results/results.sarif > "$RUNNER_TEMP/kics.sarif"

      - name: Upload SARIF to GitHub Security
        if: ${{ !cancelled() && hashFiles('kics-results/results.sarif') != '' }}
        # No continue-on-error: a failed upload must fail the job so we notice.
        continue-on-error: false
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/kics.sarif
          category: kics-dockerfiles
