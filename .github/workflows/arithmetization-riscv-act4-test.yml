name: Tracer riscv ACT4 test

on:
  pull_request:
    # No branches: filter — this must also run on PRs targeting stacked, non-main
    # integration branches (e.g. feat/l2-execution-guest-rollup-v2 and its own stack of
    # PRs), not just PRs whose base is main. The paths: filter below still scopes it.
    paths:
      - 'arithmetization/**'
      - 'riscv-guests/build_common/**'
      - 'riscv-guests/Makefile'
      - '.github/actions/setup-arithmetization-riscv/**'
      - '.github/actions/setup-zig/**'
      - '.github/workflows/arithmetization-*.yml'
  push:
    branches:
     - main
    paths:
     - 'arithmetization/**'
     - 'riscv-guests/build_common/**'
     - 'riscv-guests/Makefile'
     - '.github/actions/setup-arithmetization-riscv/**'
     - '.github/actions/setup-zig/**'
     - '.github/workflows/arithmetization-*.yml'
  workflow_call:
    inputs:
      zkc-ref:
        description: 'Optional zkc commit/branch/tag (default: arithmetization/Makefile ZKC_REF)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      zkc-ref:
        description: 'Optional zkc commit/branch/tag (default: arithmetization/Makefile ZKC_REF)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  act4-reference-tests:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    env:
      ZKC_EXEC_FLAGS: "--fast --gogen"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Setup Environment
        uses: ./.github/actions/setup-arithmetization-riscv
        with:
          zkc-ref: ${{ inputs.zkc-ref }}

      - name: Install Sail
        run: make -C arithmetization install-sail

      - name: Build ACT4 ELFs
        run: make act4-build
        working-directory: arithmetization/src/test

      - name: Run ACT4 tests
        run: make act4-exec
        working-directory: arithmetization/src/test

