name: "RISC-V Lineth DA Library Release"

permissions:
  contents: write
  actions: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      release_tag_suffix:
        description: 'Required on non-main branches; appended to releases/riscv-lineth-da/v<semver>'
        required: false
        type: string
        default: ''
      pre_release:
        description: 'Pre-release if checked; draft otherwise'
        required: false
        type: boolean
        default: false

concurrency:
  group: riscv-lineth-da-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-branch-and-release-tag-suffix:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    steps:
      - name: Check branch release suffix
        env:
          SUFFIX: ${{ inputs.release_tag_suffix }}
        run: test "$GITHUB_REF_NAME" = main || test -n "$SUFFIX"

  compute-release-metadata:
    needs: check-branch-and-release-tag-suffix
    uses: ./.github/workflows/reusable-component-release-metadata.yml
    with:
      component-name: riscv-lineth-da
      release_tag_suffix: ${{ inputs.release_tag_suffix }}

  preflight:
    needs: compute-release-metadata
    if: needs.compute-release-metadata.outputs.tag_changed == 'true'
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup guest toolchain
        uses: ./.github/actions/setup-riscv-guests
        with:
          needs-zkevm-fixtures: 'true'
      - name: Test and build the host library
        run: make -C riscv-guests/lineth_da test

  push-tag-and-changelog:
    needs: [compute-release-metadata, preflight]
    if: needs.preflight.result == 'success'
    uses: ./.github/workflows/reusable-component-release-push-tag-changelog.yml
    with:
      component-name: riscv-lineth-da
      folder-name: riscv-guests/lineth_da
      release_tag_suffix: ${{ inputs.release_tag_suffix }}
    secrets: inherit

  build:
    name: Build ${{ matrix.target }}
    needs: push-tag-and-changelog
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux_x86_64
            runner: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
          - target: linux_arm64
            runner: gha-lfdt-lineth-ss-ubuntu-24-arm64-med
          - target: darwin_arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.push-tag-and-changelog.outputs.release_tag }}
          persist-credentials: false
      - name: Setup guest toolchain
        uses: ./.github/actions/setup-riscv-guests
      - name: Build library asset
        env:
          RELEASE_VERSION: ${{ needs.push-tag-and-changelog.outputs.release_version }}
          RELEASE_DIR: ${{ github.workspace }}/release-assets
        run: |
          test -n "$RELEASE_VERSION"
          make -C riscv-guests/lineth_da host-lib-asset RELEASE_VERSION="$RELEASE_VERSION" RELEASE_DIR="$RELEASE_DIR"
      - name: Upload library asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lineth-da-${{ matrix.target }}
          path: ${{ github.workspace }}/release-assets
          if-no-files-found: error

  publish:
    needs: [push-tag-and-changelog, build]
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.push-tag-and-changelog.outputs.release_tag }}
          persist-credentials: false
      - name: Verify release tag
        env:
          TAG: ${{ needs.push-tag-and-changelog.outputs.release_tag }}
        run: |
          test -n "$TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
      - name: Refuse existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.push-tag-and-changelog.outputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1 || gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; published assets are immutable" >&2
            exit 1
          fi
      - name: Download library assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lineth-da-*
          merge-multiple: true
          path: ${{ github.workspace }}/release-assets
      - name: Bundle library assets
        id: bundle
        env:
          RELEASE_VERSION: ${{ needs.push-tag-and-changelog.outputs.release_version }}
          RELEASE_DIR: ${{ github.workspace }}/release-assets
        run: |
          test -n "$RELEASE_VERSION"
          make -C riscv-guests/lineth_da host-lib-bundle RELEASE_VERSION="$RELEASE_VERSION" RELEASE_DIR="$RELEASE_DIR"
      - name: Write release notes
        env:
          CHANGELOG: ${{ needs.push-tag-and-changelog.outputs.changelog }}
          TAG: ${{ needs.push-tag-and-changelog.outputs.release_tag }}
          FILENAME: ${{ steps.bundle.outputs.filename }}
        run: |
          printf '%s\n' "$CHANGELOG" > "$RUNNER_TEMP/lineth-da-release-notes.md"
          printf '\n### Native libraries\n\nBundle: `%s`\n\nSource tag: `%s`\n' "$FILENAME" "$TAG" >> "$RUNNER_TEMP/lineth-da-release-notes.md"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: RISC-V lineth-da v${{ needs.push-tag-and-changelog.outputs.release_version }}
          tag_name: ${{ needs.push-tag-and-changelog.outputs.release_tag }}
          body_path: ${{ runner.temp }}/lineth-da-release-notes.md
          files: ${{ steps.bundle.outputs.asset }}
          draft: ${{ !inputs.pre_release }}
          prerelease: ${{ inputs.pre_release }}
          generate_release_notes: false
          fail_on_unmatched_files: true
