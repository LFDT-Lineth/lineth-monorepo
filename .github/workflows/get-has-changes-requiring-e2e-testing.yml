name: get-has-changes-requiring-e2e-testing

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      has-changes-requiring-e2e-testing:
        description: Changes affect the zkEVM e2e suite
        value: ${{ jobs.get-has-changes-requiring-e2e-testing.outputs.has_changes_requiring_e2e_testing }}
      has-changes-requiring-riscv-e2e-testing:
        description: Changes affect the RISC-V e2e suite
        value: ${{ jobs.get-has-changes-requiring-e2e-testing.outputs.has_changes_requiring_riscv_e2e_testing }}
      riscv-prover-mode:
        description: dev-zkvm when the RISC-V prover or guests changed, dev-mock otherwise
        value: ${{ jobs.get-has-changes-requiring-e2e-testing.outputs.riscv_prover_mode }}

jobs:
  get-has-changes-requiring-e2e-testing:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    outputs:
      has_changes_requiring_e2e_testing: ${{ steps.evaluate.outputs.zkevm }}
      has_changes_requiring_riscv_e2e_testing: ${{ steps.evaluate.outputs.riscv }}
      riscv_prover_mode: ${{ steps.evaluate.outputs.riscv_prover_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter for e2e-relevant paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # On manual dispatch, diff against main so a stacked branch's e2e-relevant
          # changes are detected (github.ref would diff the branch vs itself).
          base: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}
          list-files: json
          filters: |
            shared: &shared
              - 'coordinator/**/src/main/**'
              - 'jvm-libs/**/src/main/**'
              - 'config/**/*.toml'
              - 'linea-besu/**'
              - 'maru/**/src/main/**'
              - 'gradle/libs.versions.toml'
              - 'contracts/local-deployments-artifacts/**'
              - 'docker/**'
              - '**/Dockerfile'
              - 'e2e/src/**'
              - 'e2e/package.json'
              - 'e2e/jest*.config.ts'
              - 'Makefile'
              - '.github/actions/run-e2e-tests/**'
              - 'linea-besu/plugins/linea-sequencer/**'
              - 'linea-besu/plugins/sequencer-interfaces/**'
              - 'ts-libs/**/src/**'
              - 'ts-libs/**/package.json'
              - '.github/workflows/reusable-run-e2e-tests.yml'
              - '.nvmrc'
              - 'package.json'
            zkevm:
              - *shared
              - 'transaction-exclusion-api/**/src/main/**'
              - 'postman/src/**'
              - 'postman/package.json'
              - 'prover/**/*.go'
              - 'prover/**/*.mod'
              - 'tracer/**'
              - 'tracer-constraints/**'
            riscv:
              - *shared
              - 'prover-ray/**'
              - 'riscv-guests/**'

      - name: Evaluate excluding test/doc files and other-stack paths
        id: evaluate
        env:
          ZKEVM_FILES: ${{ steps.filter.outputs.zkevm_files }}
          RISCV_FILES: ${{ steps.filter.outputs.riscv_files }}
        run: |
          set -euo pipefail

          is_test_or_doc() {
            local file="$1"
            # Unit tests, except the e2e tests themselves.
            [[ "$file" =~ \.(test|spec)\.ts$ && ! "$file" =~ ^e2e/src/ ]] && return 0
            [[ "$file" =~ _test\.go$ ]] && return 0
            # Tracer, sequencer and guest test support paths.
            [[ "$file" =~ ^tracer/(reference-tests|testing)/ ]] && return 0
            [[ "$file" =~ ^linea-besu/plugins/linea-sequencer/acceptance-tests/ ]] && return 0
            [[ "$file" =~ ^riscv-guests/[^/]+/test/ ]] && return 0
            [[ "$file" =~ \.(md|mdx)$ ]] && return 0
            return 1
          }

          # Files that only one of the stacks uses.
          is_riscv_only() {
            [[ "$1" =~ (^|/)riscv[./] || "$1" =~ [-.]riscv[-.] || "$1" =~ ^(prover-ray|riscv-guests)/ ]]
          }
          is_zkevm_only() {
            [[ "$1" =~ ^e2e/src/.*\.spec\.ts$ || "$1" =~ [-.]zkevm[-.] || "$1" =~ ^docker/config/prover/v3/ ]]
          }

          # Usage: evaluate <files-json> <skip-fn>; prints the first relevant file.
          evaluate() {
            local file
            while read -r file; do
              [ -z "$file" ] && continue
              is_test_or_doc "$file" && continue
              "$2" "$file" && continue
              echo "$file"
              return 0
            done < <(jq -r '.[]' <<< "${1:-[]}")
            return 1
          }

          if file="$(evaluate "$ZKEVM_FILES" is_riscv_only)"; then
            echo "✓ zkEVM e2e-relevant file: $file"
            echo "zkevm=true" >> "$GITHUB_OUTPUT"
          else
            echo "No zkEVM e2e-relevant files"
            echo "zkevm=false" >> "$GITHUB_OUTPUT"
          fi

          if file="$(evaluate "$RISCV_FILES" is_zkevm_only)"; then
            echo "✓ RISC-V e2e-relevant file: $file"
            echo "riscv=true" >> "$GITHUB_OUTPUT"
          else
            echo "No RISC-V e2e-relevant files"
            echo "riscv=false" >> "$GITHUB_OUTPUT"
          fi

          # Prove for real when the prover, the guests or their config changed.
          mode=dev-mock
          while read -r file; do
            if [[ "$file" =~ ^(prover-ray|riscv-guests|docker/config/prover/riscv)/ ]] && ! is_test_or_doc "$file"; then
              mode=dev-zkvm
              break
            fi
          done < <(jq -r '.[]' <<< "${RISCV_FILES:-[]}")
          echo "RISC-V prover mode: $mode"
          echo "riscv_prover_mode=$mode" >> "$GITHUB_OUTPUT"
