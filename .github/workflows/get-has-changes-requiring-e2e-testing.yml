name: get-has-changes-requiring-e2e-testing

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      has-changes-requiring-e2e-testing:
        description: Changes affect the zkEVM e2e suite
        value: ${{ jobs.get-has-changes-requiring-e2e-testing.outputs.has_changes_requiring_e2e_testing }}
      has-changes-requiring-riscv-e2e-testing:
        description: Changes affect the RISC-V e2e suite
        value: ${{ jobs.get-has-changes-requiring-e2e-testing.outputs.has_changes_requiring_riscv_e2e_testing }}
      riscv-prover-mode:
        description: dev-zkvm when the RISC-V prover or guests changed, dev-mock otherwise
        value: ${{ jobs.get-has-changes-requiring-e2e-testing.outputs.riscv_prover_mode }}

jobs:
  get-has-changes-requiring-e2e-testing:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    outputs:
      has_changes_requiring_e2e_testing: ${{ steps.evaluate.outputs.zkevm }}
      has_changes_requiring_riscv_e2e_testing: ${{ steps.evaluate.outputs.riscv }}
      riscv_prover_mode: ${{ steps.evaluate.outputs.riscv_prover_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter for e2e-relevant paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # On manual dispatch, diff against main so a stacked branch's e2e-relevant
          # changes are detected (github.ref would diff the branch vs itself).
          base: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}
          list-files: json
          filters: |
            shared: &shared
              - 'coordinator/**/src/main/**'
              - 'jvm-libs/**/src/main/**'
              - 'config/**/*.toml'
              - 'linea-besu/**'
              - 'maru/**/src/main/**'
              - 'gradle/libs.versions.toml'
              - 'contracts/local-deployments-artifacts/**'
              - 'docker/**'
              - '**/Dockerfile'
              - 'e2e/src/**'
              - 'e2e/package.json'
              - 'e2e/jest*.config.ts'
              - 'Makefile'
              - '.github/actions/run-e2e-tests/**'
              - 'scripts/e2e/**'
              - 'linea-besu/plugins/linea-sequencer/**'
              - 'linea-besu/plugins/sequencer-interfaces/**'
              - 'ts-libs/**/src/**'
              - 'ts-libs/**/package.json'
              - '.github/workflows/reusable-run-e2e-tests.yml'
              - '.nvmrc'
              - 'package.json'
            zkevm:
              - *shared
              - 'transaction-exclusion-api/**/src/main/**'
              - 'postman/src/**'
              - 'postman/package.json'
              - 'prover/**/*.go'
              - 'prover/**/*.mod'
              - 'tracer/**'
              - 'tracer-constraints/**'
            riscv:
              - *shared
              - 'prover-ray/**'
              - 'riscv-guests/**'

      - name: Evaluate excluding test/doc files and other-stack paths
        id: evaluate
        env:
          E2E_ZKEVM_FILES: ${{ steps.filter.outputs.zkevm_files }}
          E2E_RISCV_FILES: ${{ steps.filter.outputs.riscv_files }}
        run: make -s e2e-ci-detect-changes >> "$GITHUB_OUTPUT"
