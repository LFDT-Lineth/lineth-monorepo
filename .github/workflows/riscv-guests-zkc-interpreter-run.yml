# Guest-in-ZKC-interpreter CI for the l2-execution RISC-V guest.
#
# Builds the guest as a statically-linked rv64im ELF (KECCAK_ACCEL=true — the prover-accelerated
# custom keccak op, the production proving config), converts it to the interpreter's JSON input, and
# runs it through the Lineth ZKC interpreter via the existing `gp-exec` entry point. This is the
# RISC-V/ZKC counterpart to the host-machine guest tests, which run the guest logic natively (no
# RISC-V, no ZKC). It bridges the riscv-guests/ and arithmetization/ trees — depending on both the
# guest source AND the interpreter + ELF->JSON tooling — so it triggers on changes to either.
#
# Scope: this is a *runnability* smoke gate — it proves the build -> ELF -> ELF->JSON -> `zkc exec`
# pipeline runs one representative committed block end-to-end under the production keccak op and exits
# cleanly. Output/correctness equivalence over the full EF zkevm corpus is the native host suite's job.
name: riscv-guests zkc interpreter run

on:
  pull_request:
    branches:
      - main
    paths:
      - 'riscv-guests/**'
      - 'arithmetization/src/main/riscv/**'      # main.zkc — the interpreter (ZKC_MAIN)
      - 'arithmetization/src/main/lib/**'         # zkc stdlib used by the interpreter
      - 'arithmetization/src/main/wrappers/**'    # linea_zkvm_accel — imported by the guest build (l2-execution/build.zig)
      - 'arithmetization/src/test/Makefile'       # elf-exec / elf-to-json / linker-script
      - 'arithmetization/src/test/scripts/**'     # elf_to_json_gen
      - 'arithmetization/Makefile'                # install-zkc / ZKC_REF
      - '.github/actions/setup-riscv-guests/**'
      - '.github/workflows/riscv-guests-zkc-interpreter-run.yml'
  push:
    branches:
      - main
    paths:
      - 'riscv-guests/**'
      - 'arithmetization/src/main/riscv/**'
      - 'arithmetization/src/main/lib/**'
      - 'arithmetization/src/main/wrappers/**'
      - 'arithmetization/src/test/Makefile'
      - 'arithmetization/src/test/scripts/**'
      - 'arithmetization/Makefile'
      - '.github/actions/setup-riscv-guests/**'
      - '.github/workflows/riscv-guests-zkc-interpreter-run.yml'
  workflow_dispatch:
    inputs:
      zkc-ref:
        description: 'zkc commit/branch/tag (defaults to main)'
        required: false
        type: string
  workflow_call:
    inputs:
      zkc-ref:
        description: 'zkc commit/branch/tag (defaults to main)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  zkc-interpreter-run:
    name: l2-execution guest in ZKC interpreter (accel)
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large   # 32 GB; the trace run peaks ~15 GB resident
    # Generous bound: the trace-mode interpreter run (below) dominates and its true wall time on this
    # runner isn't measured yet (it's memory-bound and could not be timed cleanly on a constrained dev
    # box). Tighten once the first real runs establish the actual duration.
    timeout-minutes: 60
    env:
      ZKC_REF: ${{ inputs.zkc-ref || 'main' }}   # arithmetization/Makefile reads ZKC_REF from the env
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false

      # Pinned Zig (from .zigversion) + zig-pkg/.zig-cache caches that make the zesu graph build a
      # near-no-op. This action also builds native crypto libs (blst/mcl/…) that the FREESTANDING
      # guest ELF does not link (its precompiles are pure-Zig or a custom op) — that work is cached
      # and harmless; we reuse the action for the Zig pin + caching, so do not "optimize" it away.
      - name: Setup RISC-V guests environment (Zig + caches)
        uses: ./.github/actions/setup-riscv-guests

      # gp-exec needs Go twice: zkc's `go install` and elf_to_json_gen's `go run`. The Zig setup above
      # installs no Go. Pin chosen to match the repo's other Go pins (keep in sync). setup-go@v5 puts
      # $(go env GOPATH)/bin on PATH, so `zkc` is found in later steps without adding ~/go/bin
      # manually — the same precedent the repo's existing zkc workflows rely on.
      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24.6'
          cache-dependency-path: "**/*.sum"

      # gp-exec -> elf-exec does NOT install zkc itself (only the zkc-exec/exec targets do). Install it
      # here as a distinct concern (ownership: arithmetization/Makefile). ZKC_REF comes from the env
      # above (empty-default behavior is "skip if already on PATH"; we set it to main).
      - name: Install zkc interpreter CLI
        run: make -C arithmetization install-zkc
        timeout-minutes: 10

      # Trace mode (gp-exec passes -q, not -f): the interpreter materializes the full execution trace,
      # not just runs the program — this is the heavy, dominant step. Uses gp-exec's default GP_INPUT
      # (the committed sample stateless input). A trap/failure exits non-zero even under -q.
      - name: Run l2-execution guest through the ZKC interpreter (accel keccak)
        run: make -C riscv-guests/l2-execution gp-exec KECCAK_ACCEL=true
        timeout-minutes: 50
