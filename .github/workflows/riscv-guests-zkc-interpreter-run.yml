# Guest-in-ZKC-interpreter CI for the RISC-V guest programs.
#
# Builds each guest as a statically-linked rv64im ELF (l2-execution with KECCAK_ACCEL=true — the
# prover-accelerated custom keccak op, the production proving config), converts it to zkc's JSON
# input, and executes it under zkc in fast mode (--fast). This gate only needs to prove each guest
# runs, and skipping tracing keeps it cheap. Tracing and constraint checking are measured by
# arithmetization-weekly-zkc-metrics.yml.
# This is the RISC-V/ZKC counterpart to the host-machine guest tests, which run the
# guest logic natively (no RISC-V, no zkc). It bridges the riscv-guests/ and arithmetization/ trees —
# depending on both the guest source AND the interpreter program + ELF->JSON tooling — so it triggers
# on changes to either.
#
# Scope: this is a *runnability* smoke gate — it proves the build -> ELF -> ELF->JSON -> `zkc exec`
# pipeline runs one representative committed block end-to-end under the production keccak op and exits
# cleanly. Output/correctness equivalence over the full EF zkevm corpus is the native host suite's job.
name: riscv-guests zkc interpreter run

on:
  pull_request:
    # Intentionally unfiltered by base branch: stacked PRs also need this focused gate.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "riscv-guests/**"
      - "arithmetization/src/main/riscv/**" # main.zkc — the interpreter (ZKC_MAIN)
      - "arithmetization/src/main/lib/**" # zkc stdlib used by the interpreter
      - "arithmetization/src/test/Makefile" # elf-exec / elf-to-json / linker-script
      - "arithmetization/cmd/elf_to_json/**"
      - "arithmetization/gopkg/elfmapping/**"
      - "arithmetization/gopkg/predecoding/**"
      - "arithmetization/go.mod"
      - "arithmetization/go.sum"
      - "arithmetization/Makefile" # prepare-zkc / ZKC_REF
      - ".github/actions/setup-riscv-guests/**"
      - ".github/actions/setup-zig/**"
      - ".github/workflows/riscv-guests-zkc-interpreter-run.yml"
  push:
    branches:
      - main
    paths:
      - "riscv-guests/**"
      - "arithmetization/src/main/riscv/**"
      - "arithmetization/src/main/lib/**"
      - "arithmetization/src/test/Makefile"
      - "arithmetization/cmd/elf_to_json/**"
      - "arithmetization/gopkg/elfmapping/**"
      - "arithmetization/gopkg/predecoding/**"
      - "arithmetization/go.mod"
      - "arithmetization/go.sum"
      - "arithmetization/Makefile"
      - ".github/actions/setup-riscv-guests/**"
      - ".github/actions/setup-zig/**"
      - ".github/workflows/riscv-guests-zkc-interpreter-run.yml"
  workflow_dispatch:
    inputs:
      zkc-ref:
        description: "Optional zkc commit/branch/tag (default: version pinned in arithmetization/go.mod)"
        required: false
        type: string
      reference-args:
        description: 'Extra args for reference-test-zkc (e.g. "--match bal_ --limit 200"); default runs the whole corpus'
        required: false
        type: string
  workflow_call:
    inputs:
      zkc-ref:
        description: "Optional zkc commit/branch/tag (default: version pinned in arithmetization/go.mod)"
        required: false
        type: string
      reference-args:
        description: 'Extra args for reference-test-zkc (e.g. "--match bal_ --limit 200"); default runs the whole corpus'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  zkc-interpreter-run:
    name: guests in ZKC interpreter (accel)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Fast-mode execution is light (~tens of MB, seconds), so this job is build-bound, not
    # memory-bound and the mid tier (16 GB) covers the zig/zesu build and the run comfortably.
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Pinned Zig (from .zigversion) + zig-pkg/.zig-cache caches that make the zesu graph build a
      # near-no-op. This action also builds native crypto libs (blst/mcl/…) that the FREESTANDING
      # guest ELF does not link (its precompiles are pure-Zig or a custom op) — that work is cached
      # and harmless; we reuse the action for the Zig pin + caching, so do not "optimize" it away.
      - name: Setup RISC-V guests environment (Zig + caches)
        uses: ./.github/actions/setup-riscv-guests

      - name: Build l2-execution guest
        run: make -C riscv-guests/l2-execution compile KECCAK_ACCEL=true

      - name: Build rollup guest and sample input
        run: make -C riscv-guests/rollup compile require-input KECCAK_ACCEL=true

      - name: Upload prepared l2-execution ELF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l2-execution-accel-${{ github.sha }}
          path: riscv-guests/l2-execution/zig-out/bin/evm_execution_guest
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Upload prepared rollup artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollup-accel-${{ github.sha }}
          path: riscv-guests/rollup/zig-out
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  host-tests:
    name: Guest unit tests (host)
    needs: build-guest-artifacts
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup RISC-V guests environment
        uses: ./.github/actions/setup-riscv-guests

      - name: Check Zig formatting
        run: make fmt-check
        working-directory: riscv-guests

      - name: Run native unit tests for all guests
        run: make test
        working-directory: riscv-guests

  reference-tests:
    name: l2-execution extended-guest reference-test guards (host)
    needs: host-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup RISC-V guests environment
        uses: ./.github/actions/setup-riscv-guests

      - name: Run extended-guest reference-test guards
        run: make reference-test
        working-directory: riscv-guests/l2-execution

  zkc-interpreter-run:
    name: l2-execution guest in ZKC interpreter (accel)
    # The host comparator fetches the same Zig dependency graph as the host reference suite.
    needs: reference-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Download prepared l2-execution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: l2-execution-accel-${{ github.sha }}
          path: riscv-guests/l2-execution/zig-out

      - name: Download prepared rollup artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rollup-accel-${{ github.sha }}
          path: riscv-guests/rollup/zig-out

      - name: Setup RISC-V guests environment
        uses: ./.github/actions/setup-riscv-guests

      # Install Go for the module-pinned zkc and elf_to_json tools.
      - name: Install Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.25.7"
          cache-dependency-path: "**/*.sum"
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      # Apply an optional zkc override up front. With no override, go.mod's pinned tool is used.
      - name: Prepare zkc interpreter CLI
        env:
          ZKC_REF: ${{ inputs.zkc-ref }}
        run: make -C arithmetization prepare-zkc
      # Execute the guest under zkc in fast mode (--fast): a runnability check, so it skips tracing
      # to stay light. Tracing and constraint checking are measured weekly instead — see
      # arithmetization-weekly-zkc-metrics.yml. Uses exec's default
      # INPUT (the committed sample stateless input). A trap/failure still exits non-zero here.
      # ZKC_REF is step-scoped above, so elf-exec does not apply the override a second time.
      - name: Run l2-execution guest under zkc (fast, accel keccak) and check guest_output
        run: make -C riscv-guests/l2-execution zkc-smoke-exec KECCAK_ACCEL=true ZKC_EXEC_FLAGS="--fast"

      # The stub guest decodes a freshly-generated sample request and emits the echo/sentinel
      # output. Running it here proves the build -> ELF -> ELF->JSON -> `zkc exec` pipeline
      # end-to-end for an additional guest program. KECCAK_ACCEL=true matches the production
      # proving configuration; its keccak use is comptime-only in this stub.
      - name: Run rollup guest under zkc (fast, accel keccak)
        run: >-
          make -f arithmetization/src/test/Makefile elf-exec
          BIN_EXT=${{ github.workspace }}/riscv-guests/rollup/zig-out/bin/rollup_guest
          IN_BYTES=@${{ github.workspace }}/riscv-guests/rollup/zig-out/sample.request.ssz
          ZKC_EXEC_FLAGS="--fast"

  zkc-interpreter-trace:
    name: l2-execution guest trace in ZKC interpreter (accel)
    needs: build-guest-artifacts
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-xxl
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Download prepared l2-execution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: l2-execution-accel-${{ github.sha }}
          path: riscv-guests/l2-execution/zig-out

      - name: Install Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.25.7"
          cache-dependency-path: "**/*.sum"
          cache: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Prepare zkc interpreter CLI
        env:
          ZKC_REF: ${{ inputs.zkc-ref }}
        run: make -C arithmetization prepare-zkc

      - name: Trace l2-execution guest under zkc (accel keccak)
        run: >-
          make -f arithmetization/src/test/Makefile elf-trace
          BIN_EXT=${{ github.workspace }}/riscv-guests/l2-execution/zig-out/evm_execution_guest
          IN_BYTES=@${{ github.workspace }}/riscv-guests/l2-execution/test/testdata/stateless_input.ssz
          ZKC_TRACE_FLAGS="--stats -vv"

  # Manual-only: the emulator is too slow for a per-PR gate. Runs the whole corpus by default;
  # scope with reference-args.
  zkc-reference-test:
    name: l2-execution zkc reference-test (manual)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup RISC-V guests environment (Zig + caches)
        uses: ./.github/actions/setup-riscv-guests

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.7"
          cache-dependency-path: "**/*.sum"

      # Apply an optional zkc override up front. With no override, go.mod's pinned tool is used.
      - name: Prepare zkc interpreter CLI
        env:
          ZKC_REF: ${{ inputs.zkc-ref }}
        run: make -C arithmetization prepare-zkc

      - name: Run zkc reference-test
        env:
          REFERENCE_ARGS: ${{ inputs.reference-args }}
        run: make -C riscv-guests/l2-execution reference-test-zkc KECCAK_ACCEL=true ZKC_EXEC_FLAGS="--fast"
