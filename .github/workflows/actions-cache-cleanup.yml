name: actions-cache-cleanup

permissions:
  actions: write
  contents: read

# PR caches compete with main's shared dependency caches for repository storage.
# GitHub-managed Code Quality still writes PR caches independently of codeql.yml.
on:
  pull_request_target:
    types:
      - closed
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

jobs:
  cleanup-closed-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    timeout-minutes: 10
    steps:
      - name: Delete caches of the closed PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          for ref in "refs/pull/${PR}/merge" "refs/pull/${PR}/head"; do
            gh cache list --repo "$REPO" --ref "$ref" --limit 100 --json id --jq '.[].id' \
              | while read -r id; do gh cache delete "$id" --repo "$REPO" || true; done
          done

  sweep-stale-pr-caches:
    if: github.event_name != 'pull_request_target'
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    timeout-minutes: 10
    steps:
      - name: Delete PR caches not accessed for 3 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          # jq's fromdateiso8601 does not accept GitHub's fractional seconds.
          gh api --paginate "repos/${REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.ref | startswith("refs/pull/")) | select((.last_accessed_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < (now - 259200)) | .id' \
            | while read -r id; do
                gh api -X DELETE "repos/${REPO}/actions/caches/${id}" || true
              done

      - name: Delete PR CodeQL dependency caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Collect every page before deleting; a failed inventory must not trigger cleanup.
          # Remove PR copies to protect shared main caches; uploads can recur between sweeps.
          cache_ids=$(gh api --paginate "repos/${REPO}/actions/caches?per_page=100" \
            | jq -rs '
                .[].actions_caches[]
                | select(.ref | test("^refs/pull/[0-9]+/(head|merge)$"))
                | select(.key | startswith("codeql-dependencies-"))
                | .id
              ')
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            echo "Deleting PR CodeQL dependency cache $id"
            gh api -X DELETE "repos/${REPO}/actions/caches/${id}"
          done <<< "$cache_ids"
