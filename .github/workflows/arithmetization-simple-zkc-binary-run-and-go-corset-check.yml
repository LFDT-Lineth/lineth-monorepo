name: Tracer simple zkc binary runs and checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'arithmetization/**'
      - '.github/actions/setup-arithmetization-riscv/**'
      - '.github/workflows/arithmetization-*.yml'
  push:
    branches:
     - main
    paths:
     - 'arithmetization/**'
     - '.github/actions/setup-arithmetization-riscv/**'
     - '.github/workflows/arithmetization-*.yml'
  workflow_call:
  workflow_dispatch:
    inputs:
      zkc-ref:
        description: 'zkc commit/branch/tag (defaults to pinned ref below)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  binary-run-and-zkc-check:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Setup Environment
        uses: ./.github/actions/setup-arithmetization-riscv

      - name: Install zkc, compile risc binary for simple zkc test program and check it
        run: make -C arithmetization zkc-compile-and-check
        env:
          ZKC_REF: ${{ inputs.zkc-ref || 'v1.2.20' }}
          ZKC_MAIN: src/test/zkc/simple_add.zkc
          ZKC_FILES: src/test/zkc/simple_add.zkc
          ZKC_INPUT: src/test/zkc/simple_add.json

      - name: Trace Keccak rust and check it
        run: make keccak-rust-exec
        working-directory: arithmetization/src/test
        env:
          ZKC_REF: ${{ inputs.zkc-ref || '8e19e640b6fe99746be464d591b0cec3533d9b83' }}
          KECCAK_N_VECTORS: 1
          KECCAK_JSON_FILE: rust/src/keccak/keccak.json
          ZKC_EXEC_FLAGS: "--check -q"