name: maru-it-method-parallel-experiment

# TEMPORARY experiment for #4178: runs the maru integration suite with method-level concurrency
# (-PmaruItMethodParallel) to collect flake-rate data. Delete this file when the issue closes.
#
# Two triggers:
# - push to the experiment branch: one run per push with the input defaults (N=2, 1 iteration).
# - workflow_dispatch: fire it once per data point, e.g. 10 sequential runs spaced out:
#     for i in {1..10}; do
#       gh workflow run maru-it-method-parallel-experiment.yml --ref <branch>
#       sleep 1200
#     done
#
# IMPORTANT: GitHub only allows manual dispatch of a workflow whose file exists on the DEFAULT
# branch. A push-triggered run on a feature branch does NOT register it for dispatch — to use
# workflow_dispatch, this file must first be merged to main (it is inert there: costs nothing
# until dispatched).

permissions:
  contents: read
  actions: read

on:
  # Auto-run on pushes to the experiment branch (with the input defaults below: methods N=2,
  # single iteration), so the workflow is exercised and its runs are visible without dispatch.
  push:
    branches:
      - maru-method-level-parallel-experiment
  workflow_dispatch:
    inputs:
      method_parallel:
        description: 'Value for -PmaruItMethodParallel (0 = methods sequential, 2 = up to 2 concurrent methods per class)'
        required: false
        type: string
        default: '2'
      iterations:
        description: 'JSON array of iteration indexes; each entry repeats the suite as a parallel matrix job, e.g. [1,2,3]'
        required: false
        type: string
        default: '[1]'

jobs:
  run:
    uses: ./.github/workflows/maru-testing.yml
    with:
      maru_it_method_parallel: ${{ inputs.method_parallel || 4 }}
      maru_it_iterations: ${{ inputs.iterations || '[1]' }}
      upload_coverage: false
      artifact_suffix: '-method-parallel'
    secrets: inherit
