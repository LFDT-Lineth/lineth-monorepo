name: Docker build and publish

permissions:
  contents: read
  actions: read
  packages: write

on:
  workflow_call:
    inputs:
      commit_tag:
        required: true
        type: string
      develop_tag:
        required: true
        type: string
      coordinator_changed:
        required: true
        type: string
      native_yield_automation_service_changed:
        required: true
        type: string
      lido_governance_monitor_changed:
        required: true
        type: string
      postman_changed:
        required: true
        type: string
      prover_changed:
        required: true
        type: string
      transaction_exclusion_api_changed:
        required: true
        type: string
      maru_changed:
        required: true
        type: string
      build_linea_besu_package:
        required: true
        type: string
    outputs:
      linea_besu_package_tag:
        value: ${{ jobs.linea_besu_package_build_and_upload.outputs.linea_besu_package_tag }}

jobs:
  coordinator:
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-docker-service-build.yml
    if: ${{ inputs.coordinator_changed == 'true' }}
    with:
      component: coordinator
      image_tag: ${{ inputs.commit_tag }}
      develop_tag: ${{ inputs.develop_tag }}
      push_image: false
    secrets: inherit

  native_yield_automation_service:
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-docker-service-build.yml
    if: ${{ inputs.native_yield_automation_service_changed == 'true' }}
    with:
      component: native-yield-automation-service
      image_tag: ${{ inputs.commit_tag }}
      develop_tag: ${{ inputs.develop_tag }}
      push_image: false
    secrets: inherit

  lido_governance_monitor:
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-docker-service-build.yml
    if: ${{ inputs.lido_governance_monitor_changed == 'true' }}
    with:
      component: lido-governance-monitor
      image_tag: ${{ inputs.commit_tag }}
      develop_tag: ${{ inputs.develop_tag }}
      push_image: false
    secrets: inherit

  prover:
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-docker-service-build.yml
    if: ${{ inputs.prover_changed == 'true' }}
    with:
      component: prover
      image_tag: ${{ inputs.commit_tag }}
      develop_tag: ${{ inputs.develop_tag }}
      push_image: false
    secrets: inherit

  postman:
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-docker-service-build.yml
    if: ${{ inputs.postman_changed == 'true' }}
    with:
      component: postman
      image_tag: ${{ inputs.commit_tag }}
      develop_tag: ${{ inputs.develop_tag }}
      push_image: false
    secrets: inherit

  transaction_exclusion_api:
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-docker-service-build.yml
    if: ${{ inputs.transaction_exclusion_api_changed == 'true' }}
    with:
      component: transaction-exclusion-api
      image_tag: ${{ inputs.commit_tag }}
      develop_tag: ${{ inputs.develop_tag }}
      push_image: false
    secrets: inherit

  maru:
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-docker-service-build.yml
    if: ${{ inputs.maru_changed == 'true' }}
    with:
      component: maru
      image_tag: ${{ inputs.commit_tag }}
      develop_tag: ${{ inputs.develop_tag }}
      push_image: false
    secrets: inherit

  linea_besu_package_build_and_upload:
    uses: ./.github/workflows/linea-besu-package-build-and-upload.yml
    if: ${{ inputs.build_linea_besu_package == 'true' }}
    with:
      release_version: 'dev'
    secrets: inherit
  
  # If all jobs are skipped, the workflow will still succeed.
  always_succeed:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    needs: [coordinator, postman, prover, transaction_exclusion_api, native_yield_automation_service, maru, linea_besu_package_build_and_upload]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'success') && !contains(needs.*.result, 'cancelled') }}
    steps:
      - name: Ensure Workflow Success
        run: echo "All jobs were skipped, but workflow succeeds."
