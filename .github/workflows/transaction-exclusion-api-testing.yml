name: transaction-exclusion-api-testing

permissions:
  contents: read
  actions: read
  id-token: write

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      coverage:
        description: To generate test report
        required: false
        type: boolean
        default: false

concurrency:
  group: transaction-exclusion-api-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run-tests:
    # ~1.5 mins saved vs small
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    environment: dockerhub-pull
    name: Transaction exclusion api tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-and-gradle
      # Restores the Besu distribution prebuilt by prepare-linea-besu-maven (main.yml) and
      # publishes it to maven local; no-op when the Besu BOM is already in a remote maven repo.
      - name: Setup Besu in maven local
        uses: ./.github/actions/setup-besu-maven-local
      - name: Run tests with coverage
        if: ${{ inputs.coverage }}
        run: |
          ./gradlew transaction-exclusion-api:app:buildNeeded jacocoRootReport
      - name: Run tests without coverage
        if: ${{ !inputs.coverage }}
        run: |
          ./gradlew transaction-exclusion-api:app:buildNeeded
      - name: Login to Docker Hub
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID_PULL }}
          DOCKERHUB_OIDC_EXPIREIN: 1800
        with:
          username: consensys
      - name: Run integration tests
        run: |
          ./gradlew transaction-exclusion-api:app:integrationTestAllNeeded
      - name: Upload Jacoco execution data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-transaction-exclusion-api-exec
          path: |
            **/build/jacoco/*.exec
          if-no-files-found: ignore

