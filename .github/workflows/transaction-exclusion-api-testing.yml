name: transaction-exclusion-api-testing

permissions:
  contents: read
  actions: read
  id-token: write

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      coverage:
        description: To generate test report
        required: false
        type: boolean
        default: false

concurrency:
  group: transaction-exclusion-api-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run-tests:
    # ~1.5 mins saved vs small
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    environment: dockerhub-pull
    name: Transaction exclusion api tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java, Gradle and Besu
        uses: ./.github/actions/setup-jvm-with-besu
      - name: Run tests with coverage
        if: ${{ inputs.coverage }}
        run: |
          ./gradlew transaction-exclusion-api:app:buildNeeded jacocoRootReport
      - name: Run tests without coverage
        if: ${{ !inputs.coverage }}
        run: |
          ./gradlew transaction-exclusion-api:app:buildNeeded
      - name: Login to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID_PULL }}
      - name: Run integration tests
        run: |
          ./gradlew transaction-exclusion-api:app:integrationTestAllNeeded
      - name: Upload Jacoco execution data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-transaction-exclusion-api-exec
          path: |
            **/build/jacoco/*.exec
          if-no-files-found: ignore

