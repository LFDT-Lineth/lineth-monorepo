name: verifier-ray

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'verifier-ray/**'
      # verifier-ray builds against prover-ray HEAD (go.mod `replace`), so a
      # prover-ray change can make the generated verifier assets stale;
      # `make verify-testdata` below fails on that.
      - 'prover-ray/**'
      # Keep arithmetization integration dependencies documented but non-blocking
      # while the RISC-V/zkc pipeline is still moving quickly.
      # - 'arithmetization/src/test/main.go'
      # - 'arithmetization/src/main/riscv/main.zkc'
      - '.github/workflows/verifier-ray.yml'
  push:
    branches:
      - main
    paths:
      - 'verifier-ray/**'
      # verifier-ray builds against prover-ray HEAD (go.mod `replace`), so a
      # prover-ray change can make the generated verifier assets stale;
      # `make verify-testdata` below fails on that.
      - 'prover-ray/**'
      # Keep arithmetization integration dependencies documented but non-blocking
      # while the RISC-V/zkc pipeline is still moving quickly.
      # - 'arithmetization/src/test/main.go'
      # - 'arithmetization/src/main/riscv/main.zkc'
      - '.github/workflows/verifier-ray.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GO_VERSION: '1.27.4'
  ZIG_VERSION: '0.16.0'

concurrency:
  group: verifier-ray-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Keep this aligned with .github/actions/setup-arithmetization-riscv, but use
      # newer Go because verifier-ray/prover-ray modules declare go 1.27.1.
      - name: Install Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: "**/*.sum"

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          dependency-hash-paths: verifier-ray/**/build.zig.zon
          cache-save: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Install native tools
        run: sudo apt-get update && sudo apt-get install -y binutils-riscv64-unknown-elf xxd

      - name: Verifier-ray format check
        working-directory: verifier-ray
        run: make fmt

      - name: Verifier-ray generated testdata
        working-directory: verifier-ray
        run: make verify-testdata

      - name: Verifier-ray release build
        working-directory: verifier-ray
        run: make build-release

      - name: Verifier-ray tests
        working-directory: verifier-ray
        run: make test

      - name: Native verifier passing smoke test
        working-directory: verifier-ray
        run: make run-passing

      - name: Native verifier failing smoke test
        working-directory: verifier-ray
        run: make run-failing-expected

