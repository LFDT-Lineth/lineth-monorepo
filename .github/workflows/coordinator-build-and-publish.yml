name: coordinator-build-and-publish

permissions:
  contents: read
  actions: read
  packages: write

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      image_tag_with_suffix:
        required: false
        type: string
        default: ''
      develop_tag:
        required: true
        type: string
      image_name:
        required: false
        type: string
        default: consensys/linea-coordinator
      push_image:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

concurrency:
  group: coordinator-build-and-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-publish:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    name: Coordinator build
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_TAG_WITH_SUFFIX: ${{ inputs.image_tag_with_suffix }}
      DEVELOP_TAG: ${{ inputs.develop_tag }}
      IMAGE_NAME: ${{ inputs.image_name }}
      PUSH_IMAGE: ${{ inputs.push_image }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-java-and-gradle

      - name: Build dist
        run: ./gradlew coordinator:app:installDist

      # For published images (releases and develop): verify the config is documented and
      # regenerate the reference docs so they can be attached to the image as an artifact.
      - name: Generate coordinator config docs
        if: ${{ env.PUSH_IMAGE == 'true' }}
        run: |
          ./gradlew -V :coordinator:app:checkConfigDocs :coordinator:app:generateConfigDocs
          # Stage flat so the files sit at the artifact root (not under docs/tech/components/).
          mkdir -p "${{ runner.temp }}/coordinator-config-docs"
          cp docs/tech/components/coordinator-config-reference.md \
             docs/tech/components/coordinator-config-schema.json \
             "${{ runner.temp }}/coordinator-config-docs/"

      - name: Upload coordinator config docs
        if: ${{ env.PUSH_IMAGE == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coordinator-config-docs-${{ env.IMAGE_TAG_WITH_SUFFIX != '' && env.IMAGE_TAG_WITH_SUFFIX || env.IMAGE_TAG }}
          path: ${{ runner.temp }}/coordinator-config-docs
          if-no-files-found: error

      - name: Build and publish Docker image
        uses: ./.github/actions/docker-build-publish
        with:
          docker_context: .
          image_name: ${{ env.IMAGE_NAME }}
          image_tags: ${{ env.IMAGE_TAG_WITH_SUFFIX && format('{0},{1}', env.IMAGE_TAG, env.IMAGE_TAG_WITH_SUFFIX) || env.IMAGE_TAG }}
          develop_tag: ${{ env.DEVELOP_TAG }}
          push_image: ${{ env.PUSH_IMAGE }}
          dockerfile_path: ./coordinator/Dockerfile
          requires_qemu: ${{ env.PUSH_IMAGE }}
          build_contexts: libs=./coordinator/app/build/install/coordinator/lib
          save_artifact: ${{ env.PUSH_IMAGE == 'false' }}
          artifact_name: linea-coordinator

