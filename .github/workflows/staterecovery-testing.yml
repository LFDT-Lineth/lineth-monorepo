name: staterecovery-testing

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      commit_tag:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

concurrency:
  group: staterecovery-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run-tests:
    env:
      COMMIT_TAG: ${{ inputs.commit_tag }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    # ~2.5 mins saved vs large
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    name: Staterecovery tests
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-and-gradle
      - name: Staterecovery - Build and Unit tests
        run: |
          ./gradlew linea-besu:plugins:state-recovery:besu-plugin:buildNeeded
      # Install pnpm to deploy smart contracts
      # FIXME: use web3j to deploy contracts and remove this.
      - name: Setup nodejs environment
        uses: ./.github/actions/setup-nodejs
        with:
          pnpm-install-options: '--frozen-lockfile --prefer-offline --filter contracts --ignore-scripts'
      - name: Staterecovery - Build plugin shadowJar
        run: |
          ./gradlew linea-besu:plugins:state-recovery:besu-plugin:shadowJar
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 #v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run integration tests
        timeout-minutes: 15
        run: |
          ./gradlew linea-besu:plugins:state-recovery:test-cases:integrationTest
      - name: Upload Jacoco execution data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-staterecovery-exec
          path: |
            **/build/jacoco/*.exec
          if-no-files-found: ignore
