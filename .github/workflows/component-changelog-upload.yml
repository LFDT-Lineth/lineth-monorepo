name: "Component Changelog Upload"

on:
  workflow_call:

concurrency:
  group: component-changelog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter-commit-changes:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    name: Filter commit changes
    outputs:
      coordinator: ${{ steps.filter.outputs.coordinator }}
      postman: ${{ steps.filter.outputs.postman }}
      prover: ${{ steps.filter.outputs.prover }}
      tx-exclusion-api: ${{ steps.filter.outputs.tx-exclusion-api }}
      linea-besu-package: ${{ steps.filter.outputs.linea-besu-package }}
      maru: ${{ steps.filter.outputs.maru }}
      linea: ${{ steps.filter.outputs.linea }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Filter commit changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          base: ${{ github.ref }}
          list-files: "json"
          filters: |
            coordinator:
              - 'coordinator/**'
            maru:
              - 'maru/**'
            postman:
              - 'postman/**'
            prover:
              - 'prover/**'
            tx-exclusion-api:
              - 'transaction-exclusion-api/**'
            linea-besu-package:
              - 'tracer/**'
              - 'tracer-constraints/**'
              - 'linea-besu/plugins/linea-sequencer/**'
              - 'linea-besu/besu/**'
              - 'linea-besu/package/**'
              - 'gradle/libs.versions.toml'
            linea:
              - 'coordinator/**'
              - 'maru/**'
              - 'postman/**'
              - 'prover/**'
              - 'transaction-exclusion-api/**'
              - 'tracer/**'
              - 'tracer-constraints/**'
              - 'linea-besu/plugins/linea-sequencer/**'
              - 'linea-besu/besu/**'
              - 'linea-besu/package/**'
              - 'gradle/libs.versions.toml'

  upload-component-changelog:
    needs: [filter-commit-changes]
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    strategy:
      fail-fast: false
      matrix:
        component: [ coordinator, maru, prover, postman, tx-exclusion-api, linea-besu-package, linea ]
        include:
          # Scope-and-path gated: cliff-<component>.toml keeps only commits
          # scoped to that component, AND include-path restricts to its paths.
          - component: coordinator
            folder-name: coordinator
            cliff-config: coordinator/cliff.toml
            include-path: coordinator/**
          - component: maru
            folder-name: maru
            cliff-config: maru/cliff.toml
            include-path: maru/**
          - component: prover
            folder-name: prover
            cliff-config: prover/cliff.toml
            include-path: prover/**
          - component: postman
            folder-name: postman
            cliff-config: postman/cliff.toml
            include-path: postman/**
          - component: tx-exclusion-api
            folder-name: transaction-exclusion-api
            cliff-config: transaction-exclusion-api/cliff.toml
            include-path: transaction-exclusion-api/**
          - component: linea-besu-package
            folder-name: linea-besu/package
            artifact-name: linea-besu-package
            # Scope-and-path gated: linea-besu/package/cliff.toml keeps only `linea-besu`-scoped
            # commits, AND include-path restricts to the linea-besu package paths.
            cliff-config: linea-besu/package/cliff.toml
            include-path: |
              tracer/**
              tracer-constraints/**
              linea-besu/plugins/linea-sequencer/**
              linea-besu/besu/**
              linea-besu/package/**
              gradle/libs.versions.toml
          - component: linea
            folder-name: .
            artifact-name: linea
            # Scope-and-path gated: cliff.toml keeps only commits scoped to
            # any releasable component (coordinator, linea-besu, maru, prover,
            # postman, tx-exclusion-api), AND include-path restricts to the union
            # of all component paths.
            cliff-config: cliff.toml
            include-path: |
              coordinator/**
              maru/**
              postman/**
              prover/**
              transaction-exclusion-api/**
              tracer/**
              tracer-constraints/**
              linea-besu/plugins/linea-sequencer/**
              linea-besu/besu/**
              linea-besu/package/**
              gradle/libs.versions.toml

    name: Generate ${{ matrix.component }} [Unreleased] changelog
    steps:
      - name: Checkout
        if: needs.filter-commit-changes.outputs[matrix.component] == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # git-cliff needs full history + tags to compute changelog/version
          # Pin to the immutable triggering commit rather than a mutable ref name (CodeQL actions/untrusted-checkout).
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Install git-cliff
        if: needs.filter-commit-changes.outputs[matrix.component] == 'true'
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d #v2.82.5
        with:
          tool: git-cliff

      - name: Update [Unreleased] section in ${{ matrix.folder-name }}/CHANGELOG.md
        if: needs.filter-commit-changes.outputs[matrix.component] == 'true'
        id: changelog
        uses: ./.github/actions/run-git-cliff-commands
        with:
          component-name: ${{ matrix.component }}
          folder-name: ${{ matrix.folder-name }}
          include-path: ${{ matrix.include-path }}
          cliff-config: ${{ matrix.cliff-config }}
          prepend-changelog: 'true'

      - name: Upload CHANGELOG.md artifact
        if: github.ref == 'refs/heads/main' && needs.filter-commit-changes.outputs[matrix.component] == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unreleased-changelog-${{ matrix.artifact-name || matrix.folder-name }}
          path: ${{ matrix.folder-name }}/CHANGELOG.md

