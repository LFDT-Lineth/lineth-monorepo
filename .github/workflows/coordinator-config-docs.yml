name: "Coordinator config docs"

# Generates the committed Coordinator config reference (Markdown + JSON) and an ephemeral
# MDX partial, validates they stay in sync, and publishes only
# docs/stack/reference/_generated/coordinator/ to Consensys/doc.linea.
#
# Publishing is release-gated: automatic publishing fires only when a
# `releases/coordinator/*` tag is cut, so doc.linea always reflects a released
# Coordinator version (not in-flight main changes). Pushes to main run validation
# only. Manual dispatch with `publish: true` is available as an explicit override
# (gated to main or a `releases/coordinator/*` tag).

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/actions/setup-java-and-gradle/**"
      - ".github/workflows/coordinator-config-docs.yml"
      - "build.gradle"
      - "buildSrc/src/main/groovy/ConfigDocsExtension.groovy"
      - "buildSrc/src/main/groovy/ConfigDocsPlugin.groovy"
      - "buildSrc/build.gradle"
      - "coordinator/app/build.gradle"
      - "coordinator/app/src/configDocs/**"
      - "coordinator/app/src/main/kotlin/linea/coordinator/config/v2/toml/**"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "jvm-libs/linea/config-docs/**"
      - "settings.gradle"
  push:
    branches:
      - main
    paths:
      - ".github/actions/setup-java-and-gradle/**"
      - ".github/workflows/coordinator-config-docs.yml"
      - "build.gradle"
      - "buildSrc/src/main/groovy/ConfigDocsExtension.groovy"
      - "buildSrc/src/main/groovy/ConfigDocsPlugin.groovy"
      - "buildSrc/build.gradle"
      - "coordinator/app/build.gradle"
      - "coordinator/app/src/configDocs/**"
      - "coordinator/app/src/main/kotlin/linea/coordinator/config/v2/toml/**"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "jvm-libs/linea/config-docs/**"
      - "settings.gradle"
    # Automatic publishing fires only when a Coordinator release tag is cut, so docs on
    # doc.linea always describe a released version (not in-flight main changes).
    tags:
      - "releases/coordinator/*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish generated Coordinator config docs to Consensys/doc.linea"
        required: false
        type: boolean
        default: false

concurrency:
  group: >-
    ${{
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/releases/coordinator/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish)
      ) && 'coordinator-config-docs-publish' ||
      format('coordinator-config-docs-validation-{0}', github.ref)
    }}
  cancel-in-progress: >-
    ${{
      !(
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/releases/coordinator/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish)
      )
    }}

jobs:
  validate:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    permissions:
      contents: read
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-and-gradle

      - name: Verify every config key is documented
        run: ./gradlew -V :coordinator:app:checkConfigDocs

      - name: Generate committed outputs and ephemeral MDX partial
        run: ./gradlew -V :coordinator:app:generateConfigDocs

      - name: Assert committed Markdown and JSON are synchronized
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- \
              docs/tech/components/coordinator-config-reference.md \
              docs/tech/components/coordinator-config-schema.json; then
            echo "::error::Coordinator config docs are out of date. Run './gradlew :coordinator:app:generateConfigDocs' and commit the changes."
            exit 1
          fi

      - name: Validate ephemeral MDX partial
        run: |
          set -euo pipefail
          MDX="coordinator/app/build/config-docs-mdx/_generated/coordinator/reference.mdx"
          if [[ ! -s "$MDX" ]]; then
            echo "::error::Expected non-empty MDX partial at $MDX"
            exit 1
          fi
          if ! head -n 1 "$MDX" | grep -qE '^\{/\* Generated by .*\. Do not edit by hand\. \*/}$'; then
            echo "::error::MDX partial at $MDX is missing the generated-content banner"
            exit 1
          fi
          # After the banner line, every '{' must be backslash-escaped and every '<'/'>' must be
          # HTML-entity escaped, so the partial is safe to import as MDX.
          body="$(tail -n +2 "$MDX")"
          if printf '%s' "$body" | grep -nP '(?<!\\)\{' >/dev/null; then
            echo "::error::MDX partial contains an unescaped '{' that would break MDX imports"
            exit 1
          fi
          if printf '%s' "$body" | grep -nP '<(?!;)|(?<!&)>(?!;)' >/dev/null; then
            echo "::error::MDX partial contains a raw '<' or '>' that would break MDX imports"
            exit 1
          fi
          echo "MDX partial OK ($MDX, $(wc -c < "$MDX") bytes)"

      - name: Write provenance partial
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_SHA}" ]]; then
            echo "Refusing to publish: GITHUB_SHA / SOURCE_SHA is empty" >&2
            exit 1
          fi
          SHORT="${SOURCE_SHA:0:7}"
          OUT="coordinator/app/build/config-docs-mdx/_generated/coordinator/provenance.mdx"
          mkdir -p "$(dirname "$OUT")"
          LINE="Generated from [\`LFDT-Lineth/lineth-monorepo@${SHORT}\`](https://github.com/LFDT-Lineth/lineth-monorepo/commit/${SOURCE_SHA})."
          if [[ "${SOURCE_REF_TYPE}" == "tag" && "${SOURCE_REF_NAME}" == releases/coordinator/* ]]; then
            LINE="${LINE} (release \`${SOURCE_REF_NAME}\`)."
          fi
          {
            echo "${LINE}"
            echo ""
            echo "Keys may differ in other Coordinator releases."
            echo ""
          } > "$OUT"
          echo "Wrote $OUT"

      - name: Upload generated Coordinator config docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coordinator-config-docs-${{ github.sha }}
          path: coordinator/app/build/config-docs-mdx/
          if-no-files-found: error
          retention-days: 7

  publish-doc-linea:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/releases/coordinator/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: validate
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    permissions:
      contents: read
    steps:
      - name: Restrict manual publishing refs
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref != 'refs/heads/main' &&
          !startsWith(github.ref, 'refs/tags/releases/coordinator/')
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Manual Coordinator config docs publishing requires main or a releases/coordinator/* tag, got $REF"
          exit 1

      - name: Checkout monorepo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download validated output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coordinator-config-docs-${{ github.sha }}
          path: coordinator/app/build/config-docs-mdx

      - name: Generate App token for Consensys/doc.linea
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DOC_LINEA_PR_APP_ID }}
          private-key: ${{ secrets.DOC_LINEA_PR_PRIVATE_KEY }}
          owner: Consensys
          repositories: |
            doc.linea

      - name: Checkout doc.linea
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Consensys/doc.linea
          token: ${{ steps.app-token.outputs.token }}
          path: doc.linea

      - name: Copy only the Coordinator generated namespace
        shell: bash
        run: |
          set -euo pipefail
          SRC="coordinator/app/build/config-docs-mdx/_generated/coordinator"
          DEST="doc.linea/docs/stack/reference/_generated/coordinator"
          STAGING="doc.linea/.coordinator-config-docs-staging"
          if ! compgen -G "$SRC/*.mdx" >/dev/null; then
            echo "Refusing to publish: no MDX partials under $SRC" >&2
            exit 1
          fi
          # Copy into a staging directory first, then atomically swap it into place so a failed
          # cp never leaves the destination partially populated.
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$SRC/." "$STAGING/"
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          mv "$STAGING" "$DEST"

          invalid=0
          while IFS= read -r -d '' entry; do
            changed_path="${entry:3}"
            if [[ "$changed_path" != docs/stack/reference/_generated/coordinator/* ]]; then
              echo "::error::Refusing to publish changed path outside the Coordinator namespace: $changed_path"
              invalid=1
            fi
          done < <(git -C doc.linea status --porcelain=v1 -z --untracked-files=all)
          if [[ "$invalid" -ne 0 ]]; then
            exit 1
          fi
          git -C doc.linea status --short

      - name: Create pull request on doc.linea
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: doc.linea
          commit-message: "docs: update Linea Coordinator config partials"
          branch: ci/coordinator-config-docs
          delete-branch: true
          base: main
          title: "docs: update Linea Coordinator config partials"
          body: |
            Auto-generated Linea Coordinator TOML config MDX partials from `LFDT-Lineth/lineth-monorepo`.

            This PR updates **only** `docs/stack/reference/_generated/coordinator/`.
            The shared `_generated/` root and human-owned wrapper are intentionally untouched.
          add-paths: |
            docs/stack/reference/_generated/coordinator/**
