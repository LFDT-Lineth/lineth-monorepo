name: maru-testing

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      # N > 1 = up to N methods of a test class run concurrently inside
      # its fork JVM (-PmaruItMethodParallel=N, see maru/app/build.gradle).
      # 1 = test methods run sequentially.
      # Default as 0 (uses the default, i.e. 2, from maru/app/build.gradle).
      maru_it_method_parallel:
        required: false
        type: string
        default: '0'
      # 0 = default maxParallelForks min(nCpu, 9). N > 0 = override fork count
      # (-PmaruItMaxForks=N, see maru/app/build.gradle).
      maru_it_max_forks:
        required: false
        type: string
        default: '0'

concurrency:
  group: maru-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run-tests:
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-xl
    name: maru tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-and-gradle
      # Restores the Besu distribution prebuilt by prepare-linea-besu-maven (main.yml) and
      # publishes it to maven local; no-op when the Besu BOM is already in a remote maven repo.
      - name: Setup Besu in maven local
        uses: ./.github/actions/setup-besu-maven-local
      - name: Build maru and Unit tests
        run: |
          ./gradlew -V maru:app:buildNeeded
      - name: Run integration tests
        env:
          MARU_IT_METHOD_PARALLEL: ${{ inputs.maru_it_method_parallel }}
          MARU_IT_MAX_FORKS: ${{ inputs.maru_it_max_forks }}
        run: |
          EXTRA_ARGS=""
          if [ "$MARU_IT_METHOD_PARALLEL" != "0" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -PmaruItMethodParallel=$MARU_IT_METHOD_PARALLEL"
          fi
          if [ "$MARU_IT_MAX_FORKS" != "0" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -PmaruItMaxForks=$MARU_IT_MAX_FORKS"
          fi
          ./gradlew maru:app:integrationTest $EXTRA_ARGS
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test reports
          path: |
            maru/**/build/reports/tests/
            maru/**/build/integrationTest-logs/
          if-no-files-found: ignore
      - name: Upload Jacoco execution data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-maru-exec
          path: |
            maru/**/build/jacoco/*.exec
          if-no-files-found: ignore
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

