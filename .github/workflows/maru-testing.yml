name: maru-testing

permissions:
  contents: read
  actions: read

on:
  workflow_call:

concurrency:
  group: maru-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run-tests:
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    # update to on demand runner to avoid mid run termination and flakiness
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large-od
    name: maru tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-and-gradle
      # Restores the Besu distribution prebuilt by prepare-linea-besu-maven (main.yml) and
      # publishes it to maven local; no-op when the Besu BOM is already in a remote maven repo.
      - name: Setup Besu in maven local
        uses: ./.github/actions/setup-besu-maven-local
      - name: Build maru and Unit tests
        run: |
          ./gradlew -V maru:app:buildNeeded
      - name: Run integration tests
        run: |
          ./gradlew maru:app:integrationTest
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test reports
          path: |
            maru/**/build/reports/tests/
            maru/**/build/integrationTest-logs/
          if-no-files-found: ignore
      - name: Upload Jacoco execution data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-maru-exec
          # Must not be rooted at maru/: upload-artifact strips the matches' least common ancestor, so the
          # exec files would be restored without the maru/ prefix and jacocoRootReport would not find them.
          path: |
            **/build/jacoco/*.exec
          if-no-files-found: ignore
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

