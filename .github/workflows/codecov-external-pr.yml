name: Codecov coverage report upload for PRs from external forks

on:
  workflow_run:
    workflows: [main, sdk-testing]
    types:
      - completed

# Workflow-level permissions are denied by default; each job below declares
# the minimum scopes it needs (least privilege).
permissions: {}

jobs:
  get-commit-tag:
    if: github.event.workflow_run.head_repository.fork == true && github.event.workflow_run.conclusion == 'success'
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    name: get-commit-tag
    permissions: {}
    outputs:
      commit-tag: ${{ steps.compute-commit-tag.outputs.COMMIT_TAG }}
      sdk-commit-tag: ${{ steps.compute-commit-tag.outputs.SDK_COMMIT_TAG }}
    steps:
      - name: Compute commit tag
        shell: bash
        id: compute-commit-tag
        env:
          TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha || '' }}
        # COMMIT_TAG is derived from workflow_run.head_sha and used by workflows that upload artifacts using the shared commit_tag.
        # SDK_COMMIT_TAG is derived from the PR head SHA for sdk-testing PR runs to match sdk-testing.yml's cov-tag step.
        # We use bash substring (${VAR:0:7}) instead of `git rev-parse --short=7` to avoid checking out fork code in this privileged workflow_run context.
        run: |
          COMMIT_TAG="${WORKFLOW_RUN_HEAD_SHA:0:7}"
          SDK_COMMIT_TAG="$COMMIT_TAG"

          if [[ "$TRIGGERING_WORKFLOW" == "sdk-testing" ]] && [[ -n "$WORKFLOW_RUN_PR_HEAD_SHA" ]]; then
            SDK_COMMIT_TAG="${WORKFLOW_RUN_PR_HEAD_SHA:0:7}"
          fi

          echo "COMMIT_TAG=$COMMIT_TAG" >> "$GITHUB_OUTPUT"
          echo "SDK_COMMIT_TAG=$SDK_COMMIT_TAG" >> "$GITHUB_OUTPUT"
      - name: Show commit tag
        env:
          COMMIT_TAG: ${{ steps.compute-commit-tag.outputs.COMMIT_TAG }}
          SDK_COMMIT_TAG: ${{ steps.compute-commit-tag.outputs.SDK_COMMIT_TAG }}
        run: |
          echo "COMMIT_TAG: $COMMIT_TAG"
          echo "SDK_COMMIT_TAG: $SDK_COMMIT_TAG"

  # Ideally we would use dorny/paths-filter@v3 to conditionally trigger an upload job based on file changes
  # However there is a limitation in Github Actions where workflows triggered by a `workflow_run` event have no access to metadata on external fork PRs - https://github.com/orgs/community/discussions/25220
  # Hence we are unable to find the base commit (the common ancestor commit between the PR branch and main branch) without using very clunky workarounds
  # Hence we cannot provide the correct set of 'before' and 'after' commits for dorny/paths-filter@v3 to accurately assess PR file changes
  # So instead we unconditionally use 'continue-on-error: true' and try to download every possible test coverage report that we want to upload to Codecov

  upload-codecov:
    needs: [ get-commit-tag ]
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    name: upload-codecov-${{ matrix.component }}
    permissions:
      actions: read    # download artifacts from another workflow run
      contents: read   # codecov commit correlation
    strategy:
      fail-fast: false
      matrix:
        # The artifact is named "<artifact_prefix><tag><artifact_suffix>" and extracted to <dir>.
        # tag_output selects which get-commit-tag output the artifact name embeds.
        # Upload N sends <dir>/**/<files_N>. A lenient_N upload is skipped when that file is absent;
        # a strict one fails the job (the artifact downloaded but the expected report is missing).
        include:
          - component: coordinator
            artifact_prefix: jacocoRootReport-
            artifact_suffix: .xml
            tag_output: commit-tag
            dir: ci-coordinator-coverage
            files_1: jacocoRootReport.xml
            flags_1: kotlin
            name_1: codecov-coordinator
          - component: smart-contracts
            artifact_prefix: smart-contract-coverage-
            artifact_suffix: .json
            tag_output: commit-tag
            dir: ci-smart-contract-coverage
            files_1: coverage-final.json
            flags_1: hardhat
            name_1: codecov-contracts
          - component: ts
            artifact_prefix: ts-coverage-
            tag_output: commit-tag
            dir: ci-ts-coverage
            files_1: native-libs-lcov.info
            flags_1: linea-native-libs
            name_1: codecov-linea-native-libs-fork
            files_2: postman-lcov.info
            flags_2: postman
            name_2: codecov-postman
            lenient_2: false
            files_3: sdk-viem-lcov.info
            flags_3: sdk-viem
            name_3: codecov-sdk-viem
            lenient_3: true
          - component: native-yield-ts
            artifact_prefix: native-yield-ts-coverage-
            tag_output: commit-tag
            dir: ci-native-yield-coverage
            files_1: shared-utils-lcov.info
            flags_1: linea-shared-utils
            name_1: codecov-linea-shared-utils-native-yield-fork
            files_2: automation-service-lcov.info
            flags_2: native-yield-automation-service
            name_2: codecov-native-yield-automation-service-fork
          - component: lido-ts
            artifact_prefix: lido-ts-coverage-
            tag_output: commit-tag
            dir: ci-lido-coverage
            files_1: shared-utils-lcov.info
            flags_1: linea-shared-utils
            name_1: codecov-linea-shared-utils-lido-fork
            lenient_1: true
            files_2: lido-governance-monitor-lcov.info
            flags_2: lido-governance-monitor
            name_2: codecov-lido-governance-monitor-fork
          - component: sdk-ts
            artifact_prefix: sdk-ts-coverage-
            tag_output: sdk-commit-tag
            dir: ci-sdk-coverage
            files_1: sdk-core-lcov.info
            flags_1: sdk-core
            name_1: codecov-sdk-core-fork
            files_2: sdk-viem-lcov.info
            flags_2: sdk-viem
            name_2: codecov-sdk-viem-sdk-testing-fork
            files_3: sdk-ethers-lcov.info
            flags_3: sdk-ethers
            name_3: codecov-sdk-ethers-fork
    steps:
      - name: Download coverage artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact_prefix }}${{ needs.get-commit-tag.outputs[matrix.tag_output] }}${{ matrix.artifact_suffix }}
          path: |
            ${{ github.workspace }}/${{ matrix.dir }}
          # Required to download artifacts from another workflow run
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Gets run id of the preceding workflow that triggered this workflow_run
          run-id: ${{ github.event.workflow_run.id }}

      - name: Upload coverage (1)
        if: ${{ steps.download.outcome == 'success' && matrix.files_1 != '' && (!matrix.lenient_1 || hashFiles(format('{0}/**/{1}', matrix.dir, matrix.files_1)) != '') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: ${{ github.workspace }}/${{ matrix.dir }}/**/${{ matrix.files_1 }}
          flags: ${{ matrix.flags_1 }}
          os: linux
          name: ${{ matrix.name_1 }}
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage (2)
        if: ${{ steps.download.outcome == 'success' && matrix.files_2 != '' && (!matrix.lenient_2 || hashFiles(format('{0}/**/{1}', matrix.dir, matrix.files_2)) != '') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: ${{ github.workspace }}/${{ matrix.dir }}/**/${{ matrix.files_2 }}
          flags: ${{ matrix.flags_2 }}
          os: linux
          name: ${{ matrix.name_2 }}
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage (3)
        if: ${{ steps.download.outcome == 'success' && matrix.files_3 != '' && (!matrix.lenient_3 || hashFiles(format('{0}/**/{1}', matrix.dir, matrix.files_3)) != '') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: ${{ github.workspace }}/${{ matrix.dir }}/**/${{ matrix.files_3 }}
          flags: ${{ matrix.flags_3 }}
          os: linux
          name: ${{ matrix.name_3 }}
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
