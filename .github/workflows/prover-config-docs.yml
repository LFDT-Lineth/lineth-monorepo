name: "Prover config docs"

# Generates public-safe Prover configuration partials for review and publishes
# only docs/reference/component-configuration/_generated/prover/ to LFDT-Lineth/lineth-docs.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/prover-config-docs.yml"
      - ".nvmrc"
      - "prettier.config.mjs"
      - "prover/config/**"
      - "scripts/prover-options/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prover-config-docs.yml"
      - ".nvmrc"
      - "prettier.config.mjs"
      - "prover/config/**"
      - "scripts/prover-options/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish generated Prover config docs to LFDT-Lineth/lineth-docs"
        required: false
        type: boolean
        default: false

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish)
      ) && 'prover-config-docs-publish' ||
      format('prover-config-docs-validation-{0}', github.ref)
    }}
  cancel-in-progress: >-
    ${{
      !(
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish)
      )
    }}

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-with-cache
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: scripts/prover-options/pnpm-lock.yaml

      - name: Install generator dependencies
        working-directory: scripts/prover-options
        run: pnpm install --frozen-lockfile

      - name: Generate review output
        working-directory: scripts/prover-options
        run: pnpm run generate

      - name: Validate fresh generation and wrapper completeness
        working-directory: scripts/prover-options
        run: pnpm run check

      - name: Run unit tests
        working-directory: scripts/prover-options
        run: pnpm run test

      - name: Check formatting
        working-directory: scripts/prover-options
        run: pnpm run prettier:check

      - name: Upload generated Prover config docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prover-config-docs
          path: scripts/prover-options/output/
          if-no-files-found: error

  publish-lineth-docs:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: validate
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    permissions:
      contents: read
    steps:
      - name: Restrict manual publishing refs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/prover-')
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Manual Prover config docs publishing requires main or a prover-* tag, got $REF"
          exit 1

      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated Prover config docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prover-config-docs
          path: scripts/prover-options/output

      - name: Write provenance partial
        working-directory: scripts/prover-options
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_SHA}" ]]; then
            echo "Refusing to publish: GITHUB_SHA / SOURCE_SHA is empty" >&2
            exit 1
          fi
          SHORT="${SOURCE_SHA:0:7}"
          OUT="output/_generated/prover/provenance.mdx"
          mkdir -p "$(dirname "$OUT")"
          LINE="Generated from [\`LFDT-Lineth/lineth-monorepo@${SHORT}\`](https://github.com/LFDT-Lineth/lineth-monorepo/commit/${SOURCE_SHA})."
          if [[ "${SOURCE_REF_TYPE}" == "tag" && "${SOURCE_REF_NAME}" == prover-* ]]; then
            LINE="${LINE} (release \`${SOURCE_REF_NAME}\`)."
          fi
          {
            echo "${LINE}"
            echo ""
            echo "Keys may differ in other prover releases."
            echo ""
          } > "$OUT"

      - name: Generate App token for LFDT-Lineth/lineth-docs
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LINETH_DOCS_PR_APP_ID }}
          private-key: ${{ secrets.LINETH_DOCS_PR_PRIVATE_KEY }}
          owner: LFDT-Lineth
          repositories: |
            lineth-docs

      - name: Checkout lineth-docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LFDT-Lineth/lineth-docs
          token: ${{ steps.app-token.outputs.token }}
          path: lineth-docs

      - name: Copy generated Prover partials
        run: |
          set -euo pipefail
          SRC="scripts/prover-options/output/_generated/prover"
          DEST="lineth-docs/docs/reference/component-configuration/_generated/prover"
          if [[ -z "$(find "$SRC" -type f -name '*.mdx' -print -quit)" ]]; then
            echo "Refusing to publish: no MDX partials under $SRC" >&2
            exit 1
          fi
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRC/." "$DEST/"

      - name: Enforce lineth-docs change boundary
        run: |
          set -euo pipefail
          mapfile -t CHANGED_PATHS < <(
            {
              git -C lineth-docs diff --name-only
              git -C lineth-docs ls-files --others --exclude-standard
            } | sort -u
          )
          for CHANGED_PATH in "${CHANGED_PATHS[@]}"; do
            case "$CHANGED_PATH" in
              docs/reference/component-configuration/_generated/prover/*) ;;
              *)
                echo "::error::Refusing to publish changed path outside generated Prover docs: $CHANGED_PATH"
                exit 1
                ;;
            esac
          done
          git -C lineth-docs status --short

      - name: Create pull request on lineth-docs
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: lineth-docs
          commit-message: "docs: update Linea prover config partials"
          signoff: true
          branch: ci/prover-config-docs
          delete-branch: true
          base: main
          title: "docs: update Linea prover config partials"
          body: |
            Auto-generated Linea prover TOML config MDX partials from `LFDT-Lineth/lineth-monorepo`.

            This PR updates **only** `docs/reference/component-configuration/_generated/prover/`.
            The human-owned wrapper `linea-prover-options.mdx` is intentionally untouched.
          add-paths: |
            docs/reference/component-configuration/_generated/prover/**
