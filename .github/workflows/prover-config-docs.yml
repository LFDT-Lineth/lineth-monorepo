name: "Prover config docs"

# Generates public-safe Prover configuration partials for review and publishes
# only docs/stack/reference/_generated/prover/ to Consensys/doc.linea.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/prover-config-docs.yml"
      - ".nvmrc"
      - "prettier.config.mjs"
      - "prover/config/**"
      - "scripts/prover-options/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prover-config-docs.yml"
      - ".nvmrc"
      - "prettier.config.mjs"
      - "prover/config/**"
      - "scripts/prover-options/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish generated Prover config docs to Consensys/doc.linea"
        required: false
        type: boolean
        default: false

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish)
      ) && 'prover-config-docs-publish' ||
      format('prover-config-docs-validation-{0}', github.ref)
    }}
  cancel-in-progress: >-
    ${{
      !(
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish)
      )
    }}

jobs:
  validate:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: scripts/prover-options/pnpm-lock.yaml

      - name: Install generator dependencies
        working-directory: scripts/prover-options
        run: pnpm install --frozen-lockfile

      - name: Generate review output
        working-directory: scripts/prover-options
        run: pnpm run generate

      - name: Validate fresh generation and wrapper completeness
        working-directory: scripts/prover-options
        run: pnpm run check

      - name: Run unit tests
        working-directory: scripts/prover-options
        run: pnpm run test

      - name: Check formatting
        working-directory: scripts/prover-options
        run: pnpm run prettier:check

      - name: Upload generated Prover config docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prover-config-docs
          path: scripts/prover-options/output/
          if-no-files-found: error

  publish-doc-linea:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: validate
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    permissions:
      contents: read
    steps:
      - name: Restrict manual publishing refs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/prover-')
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Manual Prover config docs publishing requires main or a prover-* tag, got $REF"
          exit 1

      - name: Checkout monorepo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download generated Prover config docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prover-config-docs
          path: scripts/prover-options/output

      - name: Write provenance partial
        working-directory: scripts/prover-options
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_SHA}" ]]; then
            echo "Refusing to publish: GITHUB_SHA / SOURCE_SHA is empty" >&2
            exit 1
          fi
          SHORT="${SOURCE_SHA:0:7}"
          OUT="output/_generated/prover/provenance.mdx"
          mkdir -p "$(dirname "$OUT")"
          LINE="Generated from [\`LFDT-Lineth/lineth-monorepo@${SHORT}\`](https://github.com/LFDT-Lineth/lineth-monorepo/commit/${SOURCE_SHA})."
          if [[ "${SOURCE_REF_TYPE}" == "tag" && "${SOURCE_REF_NAME}" == prover-* ]]; then
            LINE="${LINE} (release \`${SOURCE_REF_NAME}\`)."
          fi
          {
            echo "${LINE}"
            echo ""
            echo "Keys may differ in other prover releases."
            echo ""
          } > "$OUT"

      - name: Generate App token for Consensys/doc.linea
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DOC_LINEA_PR_APP_ID }}
          private-key: ${{ secrets.DOC_LINEA_PR_PRIVATE_KEY }}
          owner: Consensys
          repositories: |
            doc.linea

      - name: Checkout doc.linea
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Consensys/doc.linea
          token: ${{ steps.app-token.outputs.token }}
          path: doc.linea

      - name: Copy generated Prover partials
        run: |
          set -euo pipefail
          SRC="scripts/prover-options/output/_generated/prover"
          DEST="doc.linea/docs/stack/reference/_generated/prover"
          if [[ -z "$(find "$SRC" -type f -name '*.mdx' -print -quit)" ]]; then
            echo "Refusing to publish: no MDX partials under $SRC" >&2
            exit 1
          fi
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRC/." "$DEST/"

      - name: Enforce doc.linea change boundary
        run: |
          set -euo pipefail
          mapfile -t CHANGED_PATHS < <(
            {
              git -C doc.linea diff --name-only
              git -C doc.linea ls-files --others --exclude-standard
            } | sort -u
          )
          for CHANGED_PATH in "${CHANGED_PATHS[@]}"; do
            case "$CHANGED_PATH" in
              docs/stack/reference/_generated/prover/*) ;;
              *)
                echo "::error::Refusing to publish changed path outside generated Prover docs: $CHANGED_PATH"
                exit 1
                ;;
            esac
          done
          git -C doc.linea status --short

      - name: Create pull request on doc.linea
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: doc.linea
          commit-message: "docs: update Linea prover config partials"
          branch: ci/prover-config-docs
          delete-branch: true
          base: main
          title: "docs: update Linea prover config partials"
          body: |
            Auto-generated Linea prover TOML config MDX partials from `LFDT-Lineth/lineth-monorepo`.

            This PR updates **only** `docs/stack/reference/_generated/prover/`.
            The human-owned wrapper `linea-prover-options.mdx` is intentionally untouched.
          add-paths: |
            docs/stack/reference/_generated/prover/**
