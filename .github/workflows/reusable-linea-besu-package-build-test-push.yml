name: "Reusable: Linea-besu-package Build, Test, and Push"

permissions:
  contents: write
  actions: read
  packages: write

on:
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      image_tag_suffix:
        required: false
        type: string
        default: ''
      changelog:
        required: false
        type: string
        default: ''
      draft_release:
        description: 'Draft Release'
        required: true
        type: boolean
      pre_release:
        description: 'Pre Release'
        required: true
        type: boolean
      run_test:
        required: true
        type: boolean
      run_e2e_test:
        required: true
        type: boolean
      with_besu_fleet_plugin:
        required: true
        type: boolean
      skip_docker_image_build_and_push:
        description: "Skip to build and push the docker image into dockerhub (e.g. for dry run release)"
        required: false
        type: boolean
        default: false
    outputs:
      docker_tag:
        description: "Docker image tag base (without suffix)"
        value: ${{ jobs.build-and-push-dockerhub.outputs.docker_tag }}
      docker_tag_with_suffix:
        description: "Docker image tag with suffix (same value as docker_tag if no suffix is given)"
        value: ${{ jobs.build-and-push-dockerhub.outputs.docker_tag_with_suffix }}
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      FLEET_GITHUB_APP_ID:
        required: false
      FLEET_GITHUB_APP_PRIVATE_KEY:
        required: false

jobs:
  build-and-upload-artifact:
    uses: ./.github/workflows/linea-besu-package-build-and-upload.yml
    if: ${{ inputs.run_test || inputs.run_e2e_test }}
    with:
      release_version: ${{ inputs.release_version }}
      with_besu_fleet_plugin: ${{ inputs.with_besu_fleet_plugin }}
    secrets: inherit

  run-test:
    needs: [ build-and-upload-artifact ]
    if: ${{ inputs.run_test }}
    concurrency:
      group: run-test-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-linea-besu-package-run-test.yml
    with:
      dockerimage: ${{ needs.build-and-upload-artifact.outputs.dockerimage }}

  run-e2e-tests:
    needs: [ build-and-upload-artifact ]
    if: ${{ inputs.run_e2e_test }}
    concurrency:
      group: run-e2e-tests-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    uses: ./.github/workflows/reusable-linea-besu-package-run-e2e-tests.yml
    with:
      linea_besu_package_tag: ${{ needs.build-and-upload-artifact.outputs.linea_besu_package_tag }}
      e2e-tests-logs-dump: true
      e2e-tests-with-besu-fleet: ${{ inputs.with_besu_fleet_plugin }}
    secrets: inherit

  build-and-push-dockerhub:
    needs: [ run-test, run-e2e-tests ]
    if: ${{ always() && !cancelled() && (!inputs.run_e2e_test || needs.run-e2e-tests.outputs.tests_outcome == 'success') && (!inputs.run-test || needs.run-test.result == 'success') }}
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    environment: dockerhub
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    outputs:
      docker_tag: ${{ steps.build-plugins-and-assemble.outputs.dockertag }}
      docker_tag_with_suffix: ${{ steps.build-plugins-and-assemble.outputs.dockertag_with_suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2   # need at least 2 commits so HEAD~1 resolves later would not fail on compute-version-tags

      - name: Build plugins and assemble
        id: build-plugins-and-assemble
        uses: ./.github/actions/linea-besu-package/build-plugins-and-assemble
        with:
          release_version: ${{ inputs.release_version }}
          image_tag_suffix: ${{ inputs.image_tag_suffix }}
          with_besu_fleet_plugin: ${{ inputs.with_besu_fleet_plugin }}
          fleet_github_app_id: ${{ secrets.FLEET_GITHUB_APP_ID }}
          fleet_github_app_private_key: ${{ secrets.FLEET_GITHUB_APP_PRIVATE_KEY }}

      - name: Set up QEMU
        if: ${{ !inputs.skip_docker_image_build_and_push }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 #v3.7.0

      - name: set up docker buildx
        if: ${{ !inputs.skip_docker_image_build_and_push }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f #v3.12.0

      - name: Login to Docker Hub
        if: ${{ !inputs.skip_docker_image_build_and_push && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f #v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: set docker build args
        if: ${{ !inputs.skip_docker_image_build_and_push }}
        run: |
          echo "Building docker image (without fleet): consensys/linea-besu-package:${{ steps.build-plugins-and-assemble.outputs.dockertag }}"
          if [[ "${{ inputs.with_besu_fleet_plugin }}" == "true" ]]; then
            echo "Building docker image (with fleet): consensys/linea-besu-package-with-fleet:${{ steps.build-plugins-and-assemble.outputs.dockertag }}"
          fi

      - name: build and push the combined manifest (if Besu fleet plugin is included)
        if: ${{ !inputs.skip_docker_image_build_and_push && inputs.with_besu_fleet_plugin }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: linea-besu/package/linea-besu/.
          platforms: linux/arm64,linux/amd64
          provenance: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          build-args: |
            VERSION=${{ steps.build-plugins-and-assemble.outputs.dockertag }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build-plugins-and-assemble.outputs.build_date }}
          push: true
          tags: |
            consensys/linea-besu-package-with-fleet:${{ steps.build-plugins-and-assemble.outputs.dockertag }}
            ${{ inputs.image_tag_suffix != '' && format('consensys/linea-besu-package-with-fleet:{0}', steps.build-plugins-and-assemble.outputs.dockertag_with_suffix) || ''}}
            ${{ github.ref == 'refs/heads/main' && 'consensys/linea-besu-package-with-fleet:develop' || '' }}

      - name: Calculate the checksum of Besu fleet plugin
        id: besu-fleet-plugin-checksum
        if: ${{ inputs.with_besu_fleet_plugin }}
        shell: bash
        run: |
          echo "sha256sum=$(sha256sum linea-besu/package/linea-besu/besu/plugins/besu-fleet-plugin-${{ steps.build-plugins-and-assemble.outputs.besu_fleet_version }}.jar | awk '{ print $1 }' )" >> $GITHUB_OUTPUT

      - name: Remove the Besu fleet plugin after image build (if existed)
        shell: bash
        run: |
          rm -fr linea-besu/package/linea-besu/besu/plugins/besu-fleet-plugin* || true

      - name: build and push the combined manifest (without Besu fleet plugin)
        if: ${{ !inputs.skip_docker_image_build_and_push }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: linea-besu/package/linea-besu/.
          platforms: linux/arm64,linux/amd64
          provenance: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          build-args: |
            VERSION=${{ steps.build-plugins-and-assemble.outputs.dockertag }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build-plugins-and-assemble.outputs.build_date }}
          push: true
          tags: |
            consensys/linea-besu-package:${{ steps.build-plugins-and-assemble.outputs.dockertag }}
            ${{ inputs.image_tag_suffix != '' && format('consensys/linea-besu-package:{0}', steps.build-plugins-and-assemble.outputs.dockertag_with_suffix) || ''}}
            ${{ github.ref == 'refs/heads/main' && 'consensys/linea-besu-package:develop' || '' }}

      ### update the release notes with docker hashes
      - name: create the release notes and then the release
        id: release_create_artifacts
        env:
         SKIP_DOCKER_IMAGE_INFO: ${{ inputs.skip_docker_image_build_and_push }}
        run: |
          mkdir release && cd release
          tar -czvf linea-besu-package-${{ steps.build-plugins-and-assemble.outputs.dockertag }}.tar.gz ../linea-besu/package/linea-besu/
          echo "# Release Artifact: Linea Besu Package" > output.md
          echo "**Name:** linea-besu-package-${{ steps.build-plugins-and-assemble.outputs.dockertag }}.tar.gz" >> output.md
          echo "**SHA256:** $(sha256sum linea-besu-package-${{ steps.build-plugins-and-assemble.outputs.dockertag }}.tar.gz | awk '{ print $1 }' )" >> output.md
          echo "**From:** [${{ github.ref_name }} (${{ github.event_name }})](https://github.com/LFDT-Lineth/lineth-monorepo/actions/runs/${{ github.run_id }})" >> output.md
          echo "" >> output.md

          echo "### Besu and Plugin Details" >> output.md
          echo "| Module | Version | SHA-256 |" >> output.md
          echo "|--------|---------|--------------|" >> output.md
          echo "| linea-besu | ${{ steps.build-plugins-and-assemble.outputs.besu_version }} | $(sha256sum ../linea-besu/package/tmp/besu-${{ steps.build-plugins-and-assemble.outputs.besu_version }}.tar.gz | awk '{ print $1 }' ) |" >> output.md
          echo "| linea-sequencer-plugin | ${{ steps.build-plugins-and-assemble.outputs.sequencer_plugin_version }} | $(sha256sum ../linea-besu/package/linea-besu/besu/plugins/linea-sequencer-${{steps.build-plugins-and-assemble.outputs.sequencer_plugin_version }}.jar | awk '{ print $1 }' ) |" >> output.md
          echo "| linea-tracer-plugin | ${{ steps.build-plugins-and-assemble.outputs.tracer_plugin_version }} | $(sha256sum ../linea-besu/package/linea-besu/besu/plugins/linea-tracer-${{ steps.build-plugins-and-assemble.outputs.tracer_plugin_version }}.jar | awk '{ print $1 }' ) |" >> output.md
          echo "| linea-staterecovery-plugin | ${{ steps.build-plugins-and-assemble.outputs.staterecovery_version }} | $(sha256sum ../linea-besu/package/linea-besu/besu/plugins/linea-staterecovery-besu-plugin-v${{ steps.build-plugins-and-assemble.outputs.staterecovery_version }}.jar | awk '{ print $1 }' ) |" >> output.md
          echo "| shomei-plugin | ${{ steps.build-plugins-and-assemble.outputs.shomei_version }} | $(sha256sum ../linea-besu/package/linea-besu/besu/plugins/besu-shomei-plugin-v${{ steps.build-plugins-and-assemble.outputs.shomei_version }}.jar | awk '{ print $1 }' ) |" >> output.md
          if [[ "${{ inputs.with_besu_fleet_plugin }}" == "true" ]]; then
            echo "| besu-fleet-plugin | ${{ steps.build-plugins-and-assemble.outputs.besu_fleet_version }} | ${{ steps.besu-fleet-plugin-checksum.outputs.sha256sum }} |" >> output.md
          fi
          echo "" >> output.md

          if [ "$SKIP_DOCKER_IMAGE_INFO" != "true" ]; then
            MANIFEST=$(docker manifest inspect consensys/linea-besu-package:${{ steps.build-plugins-and-assemble.outputs.dockertag }})
            if [ $? -eq 0 ]; then
              echo "### Docker Image Details" >> output.md
              echo "" >> output.md
              echo "To pull the image, use any of the following commands:" >> output.md
              echo "\`\`\`" >> output.md
              echo "docker pull consensys/linea-besu-package:${{ steps.build-plugins-and-assemble.outputs.dockertag }}" >> output.md
              echo "\`\`\`" >> output.md
              if [[ -n "${{ steps.build-plugins-and-assemble.outputs.dockertag_with_suffix }}" ]] && [[ "${{ steps.build-plugins-and-assemble.outputs.dockertag }}" != "${{ steps.build-plugins-and-assemble.outputs.dockertag_with_suffix }}" ]]; then
                echo "\`\`\`" >> output.md
                echo "docker pull consensys/linea-besu-package:${{ steps.build-plugins-and-assemble.outputs.dockertag_with_suffix }}" >> output.md
                echo "\`\`\`" >> output.md
              fi
              if [[ "${{ inputs.with_besu_fleet_plugin }}" == "true" ]]; then
                echo "To pull the image with Besu fleet plugin, use any of the following commands:" >> output.md
                echo "\`\`\`" >> output.md
                echo "docker pull consensys/linea-besu-package-with-fleet:${{ steps.build-plugins-and-assemble.outputs.dockertag }}" >> output.md
                echo "\`\`\`" >> output.md
                if [[ -n "${{ steps.build-plugins-and-assemble.outputs.dockertag_with_suffix }}" ]] && [[ "${{ steps.build-plugins-and-assemble.outputs.dockertag }}" != "${{ steps.build-plugins-and-assemble.outputs.dockertag_with_suffix }}" ]]; then
                  echo "\`\`\`" >> output.md
                  echo "docker pull consensys/linea-besu-package-with-fleet:${{ steps.build-plugins-and-assemble.outputs.dockertag_with_suffix }}" >> output.md
                  echo "\`\`\`" >> output.md
                fi
              fi
              echo "" >> output.md
              echo "| Digest | OS | Architecture |" >> output.md
              echo "|--------|----|--------------|" >> output.md
              echo "$MANIFEST" | jq -r '.manifests[] | select(.platform.architecture != "unknown" and .platform.os != "unknown") | "| \(.digest) | \(.platform.os) | \(.platform.architecture) |"' >> output.md
            else
              echo "Docker image consensys/linea-besu-package:${{ steps.build-plugins-and-assemble.outputs.dockertag }} does not exist on dockerhub"
              exit 1
            fi
          fi

      - name: Append Changelog input to release note
        id: append_change_log_input
        if: ${{ inputs.changelog != '' }}
        shell: bash
        env:
          # Pass via env to avoid shell injection: changelog content is derived
          # from commit messages (via git-cliff) and may contain backticks, $(...), etc.
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          cd release
          echo "## What's Changed" >> output.md
          printf '%s\n' "$CHANGELOG" >> output.md
          echo "output.md=$(cat output.md)"

      - name: release - publish artifacts and release notes
        id: release_publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 #v2.6.2
        with:
          name: Linea Besu ${{ inputs.release_version && format('v{0}', inputs.release_version) }}
          tag_name: ${{ inputs.release_tag }}
          body_path: release/output.md
          draft: ${{ inputs.draft_release }}
          prerelease: ${{ inputs.pre_release }}
          generate_release_notes: false
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            release/linea-besu-package-${{ steps.build-plugins-and-assemble.outputs.dockertag }}.tar.gz

