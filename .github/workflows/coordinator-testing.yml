name: coordinator-testing

permissions:
  contents: read
  actions: read
  id-token: write

on:
  workflow_call:
    inputs:
      commit_tag:
        required: true
        type: string

concurrency:
  group: coordinator-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run-tests:
    env:
      COMMIT_TAG: ${{ inputs.commit_tag }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    # update to on demand runner to avoid mid run termination and flakiness
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-xl-od
    environment: dockerhub-pull
    name: Coordinator tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Setup Java, Gradle and Besu
        uses: ./.github/actions/setup-jvm-with-besu

      # Install pnpm to compile smart contracts
      - name: Setup nodejs environment
        uses: ./.github/actions/setup-nodejs
        with:
          pnpm-install-options: '--frozen-lockfile --prefer-offline --filter contracts --ignore-scripts'
      - name: Build coordinator and Unit tests
        run: |
          ./gradlew -V coordinator:app:buildNeeded
      - name: Verify generated coordinator config docs are up to date
        run: |
          ./gradlew -V :coordinator:config:generateConfigDocs
          if ! git diff --exit-code -- \
              docs/tech/components/coordinator-config-reference.md \
              docs/tech/components/coordinator-config-schema.json; then
            echo "::error::Coordinator config docs are out of date. Run './gradlew :coordinator:config:generateConfigDocs' and commit the changes."
            exit 1
          fi
      - name: Login to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID_PULL }}
      - name: Pre-pull images for running integration tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 10
          retry_on: error
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: ./gradlew composePullLocalStackStartedImages
      - name: Run integration tests
        timeout-minutes: 15
        run: |
          ./gradlew coordinator:app:integrationTestAllNeeded
      - name: Upload Jacoco execution data
        if: always()
        uses: ./.github/actions/upload-jacoco-exec
        with:
          name: jacoco-coordinator-exec
