name: coordinator-testing

permissions:
  contents: read
  actions: read
  id-token: write

on:
  workflow_call:
    inputs:
      commit_tag:
        required: true
        type: string

concurrency:
  group: coordinator-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run-tests:
    env:
      COMMIT_TAG: ${{ inputs.commit_tag }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    # ? Seems to fail more often on xl
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    environment: publish
    name: Coordinator tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-and-gradle

      # Restores the Besu distribution prebuilt by prepare-linea-besu-maven (main.yml) and
      # publishes it to maven local; no-op when the Besu BOM is already in a remote maven repo.
      - name: Setup Besu in maven local
        uses: ./.github/actions/setup-besu-maven-local

      # Install pnpm to compile smart contracts
      - name: Setup nodejs environment
        uses: ./.github/actions/setup-nodejs
        with:
          pnpm-install-options: '--frozen-lockfile --prefer-offline --filter contracts --ignore-scripts'
      - name: Build coordinator and Unit tests
        run: |
          ./gradlew -V coordinator:app:buildNeeded
      - name: Verify generated coordinator config docs are up to date
        run: |
          ./gradlew -V :coordinator:config:generateConfigDocs
          if ! git diff --exit-code -- \
              docs/tech/components/coordinator-config-reference.md \
              docs/tech/components/coordinator-config-schema.json; then
            echo "::error::Coordinator config docs are out of date. Run './gradlew :coordinator:config:generateConfigDocs' and commit the changes."
            exit 1
          fi
      - name: Login to Docker Hub
        if: ${{ github.event.pull_request.head.repo.fork != true }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: 1800
        with:
          username: consensys
      - name: Pre-pull images for running integration tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 10
          retry_on: error
          retry_wait_seconds: 30
          timeout_minutes: 10
          command: ./gradlew composePullLocalStackStartedImages
      - name: Run integration tests
        timeout-minutes: 15
        run: |
          ./gradlew coordinator:app:integrationTestAllNeeded
      - name: Upload Jacoco execution data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-coordinator-exec
          path: |
            **/build/jacoco/*.exec
          if-no-files-found: ignore
