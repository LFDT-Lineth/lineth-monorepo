name: Arithmetization zkc keccak vs riscv keccak benchmark

on:
  workflow_dispatch:
    inputs:
      zkc-ref:
        description: 'zkc commit/branch/tag (defaults to pinned ref below)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-large
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.24.6'
          cache-dependency-path: "**/*.sum"

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: '0.16.0'
          dependency-hash-paths: arithmetization/src/test/zig/build.zig.zon

      - name: Install GNU time
        run: sudo apt-get update && sudo apt-get install -y time

      - name: Install zkc
        env:
          ZKC_REF_OVERRIDE: ${{ inputs.zkc-ref }}
        run: |
          if [ -n "$ZKC_REF_OVERRIDE" ]; then
            make -C arithmetization install-zkc ZKC_REF="$ZKC_REF_OVERRIDE"
          else
            make -C arithmetization install-zkc
          fi

      - name: Run batched 512-byte input benchmark
        shell: bash
        run: |
          set -o pipefail
          ZKC_REF= GO111MODULE=off go run ./arithmetization/src/test/scripts/keccak_zkc_vs_reference_speedup \
            --intervals 5 --size 5 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run increasing-length input benchmark
        shell: bash
        run: |
          set -o pipefail
          ZKC_REF= GO111MODULE=off go run ./arithmetization/src/test/scripts/keccak_zkc_vs_reference_speedup \
            --single-input-lengths 512,1024,2048,4096,8192,16384,32768 \
            | tee -a "$GITHUB_STEP_SUMMARY"

