name: "Component Changelog Update"

# Single-job replacement for the old component-changelog-upload.yml +
# component-changelog-commit.yml pair: one runner detects which components
# changed, regenerates their [Unreleased] CHANGELOG.md sections with git-cliff
# (all components in parallel as background subshells) and pushes one commit
# with everything. Compared to the matrix design this saves one runner per
# changed component (each previously paying its own full-history checkout and
# git-cliff install) and the artifact upload/download round-trip between the
# two workflows.
#
# The parallel generation logic lives in
# .github/actions/run-git-cliff-commands/scripts/update-unreleased-changelogs.sh
# so it can be reproduced locally (see the script's header for usage).
#
# Security note: the release-bot App token is minted only after all git-cliff
# work is done, and only when a CHANGELOG.md actually changed on disk, so the
# generation phase (tool installers, git-cliff) never runs with credentials
# that can bypass branch protection. The checkout uses the default
# GITHUB_TOKEN with persist-credentials: false.

permissions:
  contents: read

on:
  workflow_call:

concurrency:
  group: component-changelog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-changelogs:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    environment: ${{ github.ref == 'refs/heads/main' && 'release-bot' || 'release-bot-approval' }}
    name: Update [Unreleased] changelogs
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only GITHUB_TOKEN, not persisted: the push at the end
          # authenticates as the release-bot App via the remote URL instead.
          persist-credentials: false
          # Pin to the immutable triggering commit rather than a mutable ref name (CodeQL actions/untrusted-checkout).
          ref: ${{ github.sha }}
          # Shallow is enough for the path filter; full history is fetched
          # below only when a component actually changed (git-cliff needs it).
          submodules: false

      - name: Filter commit changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          list-files: "json"
          filters: .github/path-filters/changelog.yml

      - name: Resolve changed components
        id: check
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          echo "Changed components: ${CHANGES:-[]}"
          if [ "${CHANGES:-[]}" = "[]" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # git-cliff needs full history + tags to compute changelog/version, but
      # most pushes touch no component — pay the full fetch only when needed.
      - name: Fetch full history for git-cliff
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          clean: false

      - name: Install git-cliff
        if: steps.check.outputs.has_changes == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: git-cliff

      - name: Generate changelogs for changed components (parallel)
        id: changelogs
        if: steps.check.outputs.has_changes == 'true'
        env:
          CHANGED_COMPONENTS: ${{ steps.filter.outputs.changes }}
        run: .github/actions/run-git-cliff-commands/scripts/update-unreleased-changelogs.sh

      # Mint the App token only now — after git-cliff, and only when a
      # CHANGELOG.md actually changed on disk — so the generation phase above
      # never runs with credentials that bypass branch protection.
      - name: Start release bot session
        if: steps.changelogs.outputs.updated == 'true'
        uses: ./.github/actions/app-bot-session
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Commit and push all CHANGELOG.md
        if: steps.changelogs.outputs.updated == 'true'
        uses: ./.github/actions/commit-and-push
        with:
          paths: |
            CHANGELOG.md
            **/CHANGELOG.md
          message: "chore(misc): update CHANGELOG.md unreleased section of each updated component and milestone [skip ci]"
