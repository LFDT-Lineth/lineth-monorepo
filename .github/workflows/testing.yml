name: Testing CI

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      commit_tag:
        required: true
        type: string
      coordinator_changed:
        required: true
        type: string
      staterecovery_changed:
        required: true
        type: string
      native_yield_automation_service_changed:
        required: true
        type: string
      lido_governance_monitor_changed:
        required: true
        type: string
      postman_changed:
        required: true
        type: string
      sdk_changed:
        description: Whether standalone sdk-testing is running for this change
        required: false
        type: string
        default: 'false'
      prover_changed:
        required: true
        type: string
      prover_ray_changed:
        required: true
        type: string
      rollup_spec_changed:
        required: true
        type: string
      transaction_exclusion_api_changed:
        required: true
        type: string
      smart_contracts_changed:
        required: true
        type: string
      linea_sequencer_changed:
        required: true
        type: string
      tracer_changed:
        required: true
        type: string
      constraints_changed:
        required: true
        type: string
      maru_changed:
        required: true
        type: string

jobs:
  # Cache for pulling Docker images is disabled as we empirically found that this
  # (retrieving cache and loading Docker images) actually increased test time-to-completion
  coordinator:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/coordinator-testing.yml
    if: ${{ inputs.coordinator_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
    secrets: inherit

  prover:
    uses: ./.github/workflows/prover-testing.yml
    if: ${{ inputs.prover_changed == 'true' }}
    secrets: inherit

  prover-ray:
    uses: ./.github/workflows/prover-ray-testing.yml
    if: ${{ inputs.prover_ray_changed == 'true' }}
    secrets: inherit

  rollup-spec:
    uses: ./.github/workflows/rollup-spec-testing.yml
    if: ${{ inputs.rollup_spec_changed == 'true' }}
    secrets: inherit

  native-yield-automation-service:
    uses: ./.github/workflows/native-yield-automation-service-testing.yml
    if: ${{ inputs.native_yield_automation_service_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
    secrets: inherit

  lido-governance-monitor:
    uses: ./.github/workflows/lido-governance-monitor-testing.yml
    if: ${{ inputs.lido_governance_monitor_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
      run_shared_utils_tests: ${{ inputs.native_yield_automation_service_changed != 'true' }}
    secrets: inherit

  postman:
    uses: ./.github/workflows/postman-testing.yml
    if: ${{ inputs.postman_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
      run_sdk_viem_tests: ${{ inputs.sdk_changed != 'true' }}
    secrets: inherit

  transaction-exclusion-api:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/transaction-exclusion-api-testing.yml
    if: ${{ inputs.transaction_exclusion_api_changed == 'true' }}
    secrets: inherit

  staterecovery:
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/staterecovery-testing.yml
    if: ${{ inputs.staterecovery_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
    secrets: inherit

  smart-contracts:
    uses: ./.github/workflows/run-smc-tests.yml
    if: ${{ inputs.smart_contracts_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
    secrets: inherit

  linea-sequencer:
    uses: ./.github/workflows/linea-sequencer-plugin-testing.yml
    if: ${{ inputs.linea_sequencer_changed == 'true' || inputs.tracer_changed == 'true' }}
    secrets: inherit

  # tracer:
  #   uses: ./.github/workflows/tracer-gradle-tests.yml
  #   if: ${{ inputs.tracer_changed == 'true' }}
  #   secrets: inherit

  constraints:
    uses: ./.github/workflows/tracer-constraints-check-compilation.yml
    if: ${{ inputs.constraints_changed == 'true' }}
    secrets: inherit

  maru:
    uses: ./.github/workflows/maru-testing.yml
    if: ${{ inputs.maru_changed == 'true' }}
    secrets: inherit

  # Run Jacoco report after all JVM tests complete
  jacoco-report:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    name: Generate Jacoco Coverage Report
    # Run only when every JVM test job that ran passed, and at least one ran.
    # After a failed or cancelled test job the report is incomplete or missing, so
    # this job would fail too. "Re-run failed jobs" re-runs it with the fixed tests.
    if: |
      !cancelled() &&
      contains(needs.*.result, 'success') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs:
      - coordinator
      - linea-sequencer
      - maru
      - staterecovery
      - transaction-exclusion-api
    env:
      COMMIT_TAG: ${{ inputs.commit_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup Tracer Environment # configures Go, Java, and Gradle
        uses: ./.github/actions/setup-tracer-environment

      # Every JVM suite uploads `jacoco-<suite>-exec` (upload-jacoco-exec); suites that were skipped
      # upload nothing, so no per-suite condition is needed.
      - name: Download Jacoco execution data from all JVM test jobs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jacoco-*-exec
          merge-multiple: true
          path: .

      - name: Run Jacoco Root Report
        run: |
          ./gradlew jacocoRootReport
      - name: Upload Jacoco test coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacocoRootReport-${{ env.COMMIT_TAG }}.xml
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
      - name: Upload coverage to Codecov
        uses: ./.github/actions/upload-coverage
        with:
          files: ${{ github.workspace }}/build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
          flags: kotlin
          name: codecov-jvm-tests
          token: ${{ secrets.CODECOV_TOKEN }}
