name: Testing CI

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      commit_tag:
        required: true
        type: string
      coordinator_changed:
        required: true
        type: string
      staterecovery_changed:
        required: true
        type: string
      native_yield_automation_service_changed:
        required: true
        type: string
      lido_governance_monitor_changed:
        required: true
        type: string
      postman_changed:
        required: true
        type: string
      prover_changed:
        required: true
        type: string
      prover_ray_changed:
        required: true
        type: string
      rollup_spec_changed:
        required: true
        type: string
      transaction_exclusion_api_changed:
        required: true
        type: string
      smart_contracts_changed:
        required: true
        type: string
      linea_sequencer_changed:
        required: true
        type: string
      tracer_changed:
        required: true
        type: string
      constraints_changed:
        required: true
        type: string
      maru_changed:
        required: true
        type: string

jobs:
  # Runs once before the JVM testing jobs: checks whether the Besu version pinned by
  # besuCommit (gradle/libs.versions.toml) is published to a remote maven repo and, if not,
  # builds the Besu source distribution a single time and shares it as a workflow artifact.
  # The JVM testing jobs restore it via actions/setup-besu-maven-local instead of each
  # building Besu from source in parallel.
  prepare-linea-besu-maven:
    uses: ./.github/workflows/prepare-linea-besu-maven.yml

  # Lightweight gate that runs before every JVM testing job which may need Besu artifacts.
  # It always runs (even when all those jobs are skipped due to no changes) so that a failed
  # Besu preparation fails the dependent jobs instead of silently skipping them, and a
  # successful preparation lets skipped jobs stay skipped without wasting a runner.
  besu-maven-ready:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    needs: [prepare-linea-besu-maven]
    steps:
      - name: Check Besu maven preparation result
        run: |
          echo "Besu version: ${{ needs.prepare-linea-besu-maven.outputs.besu_version }}"
          echo "Published remotely: ${{ needs.prepare-linea-besu-maven.outputs.published_remotely }}"

  # Cache for pulling Docker images is disabled as we empirically found that this
  # (retrieving cache and loading Docker images) actually increased test time-to-completion
  coordinator:
    needs: [besu-maven-ready]
    uses: ./.github/workflows/coordinator-testing.yml
    if: ${{ inputs.coordinator_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
    secrets: inherit

  prover:
    uses: ./.github/workflows/prover-testing.yml
    if: ${{ inputs.prover_changed == 'true' }}
    secrets: inherit

  prover-ray:
    uses: ./.github/workflows/prover-ray-testing.yml
    if: ${{ inputs.prover_ray_changed == 'true' }}
    secrets: inherit

  rollup-spec:
    uses: ./.github/workflows/rollup-spec-testing.yml
    if: ${{ inputs.rollup_spec_changed == 'true' }}
    secrets: inherit

  native-yield-automation-service:
    uses: ./.github/workflows/native-yield-automation-service-testing.yml
    if: ${{ inputs.native_yield_automation_service_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
    secrets: inherit

  lido-governance-monitor:
    uses: ./.github/workflows/lido-governance-monitor-testing.yml
    if: ${{ inputs.lido_governance_monitor_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
    secrets: inherit

  postman:
    uses: ./.github/workflows/postman-testing.yml
    if: ${{ inputs.postman_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
    secrets: inherit

  transaction-exclusion-api:
    needs: [besu-maven-ready]
    uses: ./.github/workflows/transaction-exclusion-api-testing.yml
    if: ${{ inputs.transaction_exclusion_api_changed == 'true' }}
    secrets: inherit

  staterecovery:
    needs: [besu-maven-ready]
    uses: ./.github/workflows/staterecovery-testing.yml
    if: ${{ inputs.staterecovery_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
    secrets: inherit

  smart-contracts:
    uses: ./.github/workflows/run-smc-tests.yml
    if: ${{ inputs.smart_contracts_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
    secrets: inherit

  linea-sequencer:
    needs: [besu-maven-ready]
    uses: ./.github/workflows/linea-sequencer-plugin-testing.yml
    if: ${{ inputs.linea_sequencer_changed == 'true' || inputs.tracer_changed == 'true' }}
    secrets: inherit

  # tracer:
  #   uses: ./.github/workflows/tracer-gradle-tests.yml
  #   if: ${{ inputs.tracer_changed == 'true' }}
  #   secrets: inherit

  constraints:
    uses: ./.github/workflows/tracer-constraints-check-compilation.yml
    if: ${{ inputs.constraints_changed == 'true' }}
    secrets: inherit

  maru:
    needs: [besu-maven-ready]
    uses: ./.github/workflows/maru-testing.yml
    if: ${{ inputs.maru_changed == 'true' }}
    with:
      commit_tag: ${{ inputs.commit_tag }}
    secrets: inherit

  # Run Jacoco report after all JVM tests complete
  jacoco-report:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    name: Generate Jacoco Coverage Report
    # Run if at least one JVM test job completed (whether passed, failed, or cancelled)
    # Don't run if all test jobs were skipped due to no changes
    if: |
      always() && (
        needs.coordinator.result == 'success' ||
        needs.coordinator.result == 'failure' ||
        needs.coordinator.result == 'cancelled' ||
        needs.linea-sequencer.result == 'success' ||
        needs.linea-sequencer.result == 'failure' ||
        needs.linea-sequencer.result == 'cancelled' ||
        needs.maru.result == 'success' ||
        needs.maru.result == 'failure' ||
        needs.maru.result == 'cancelled' ||
        needs.staterecovery.result == 'success' ||
        needs.staterecovery.result == 'failure' ||
        needs.staterecovery.result == 'cancelled' ||
        needs.transaction-exclusion-api.result == 'success' ||
        needs.transaction-exclusion-api.result == 'failure' ||
        needs.transaction-exclusion-api.result == 'cancelled'
      )
    needs:
      - coordinator
      - linea-sequencer
      - maru
      - staterecovery
      - transaction-exclusion-api
    env:
      COMMIT_TAG: ${{ inputs.commit_tag }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup Tracer Environment # configures Go, Java, and Gradle
        uses: ./.github/actions/setup-tracer-environment

      - name: Download Jacoco execution data from coordinator
        if: needs.coordinator.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-coordinator-exec
          path: .
      - name: Download Jacoco execution data from linea-sequencer tests
        if: needs.linea-sequencer.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-linea-sequencer-exec
          path: .
      - name: Download Jacoco execution data from maru
        if: needs.maru.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-maru-exec
          path: .
      - name: Download Jacoco execution data from staterecovery
        if: needs.staterecovery.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-staterecovery-exec
          path: .
      - name: Download Jacoco execution data from transaction-exclusion-api
        if: needs.transaction-exclusion-api.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jacoco-transaction-exclusion-api-exec
          path: .

      - name: Run Jacoco Root Report
        run: |
          ./gradlew jacocoRootReport
      - name: Upload Jacoco test coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacocoRootReport-${{ env.COMMIT_TAG }}.xml
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: ${{ github.workspace }}/build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
          flags: kotlin
          os: linux
          name: codecov-jvm-tests
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # If all jobs are skipped, the workflow will still succeed.
  always_succeed:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-small
    if: >
      inputs.coordinator_changed == 'false' &&
      inputs.prover_changed == 'false' &&
      inputs.prover_ray_changed == 'false' &&
      inputs.rollup_spec_changed == 'false' &&
      inputs.native_yield_automation_service_changed == 'false' &&
      inputs.lido_governance_monitor_changed == 'false' &&
      inputs.postman_changed == 'false' &&
      inputs.transaction_exclusion_api_changed == 'false' &&
      inputs.staterecovery_changed == 'false' &&
      inputs.smart_contracts_changed == 'false' &&
      inputs.linea_sequencer_changed == 'false' &&
      inputs.tracer_changed == 'false' &&
      inputs.constraints_changed == 'false' &&
      inputs.maru_changed == 'false'
    steps:
      - name: Ensure Workflow Success
        run: echo "All jobs were skipped, but workflow succeeds."
