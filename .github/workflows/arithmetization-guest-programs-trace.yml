name: Tracer guest programs trace - l2-execution, Add in Zkc

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'arithmetization/**'
      - '.github/actions/setup-arithmetization-riscv/**'
      - '.github/actions/setup-zig/**'
      - '.github/workflows/arithmetization-guest-programs-trace.yml'
      - '.github/workflows/arithmetization-*.yml'
      - "riscv-guests/**"
  push:
    branches:
      - main
    paths:
     - 'arithmetization/**'
     - '.github/actions/setup-arithmetization-riscv/**'
     - '.github/actions/setup-zig/**'
     - '.github/workflows/arithmetization-guest-programs-trace.yml'
     - '.github/workflows/arithmetization-*.yml'
  workflow_call:
    inputs:
      zkc-ref:
        description: 'Optional zkc commit/branch/tag (default: version pinned in arithmetization/go.mod)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      zkc-ref:
        description: 'Optional zkc commit/branch/tag (default: version pinned in arithmetization/go.mod)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  binary-run-and-zkc-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-xxl
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup Environment
        uses: ./.github/actions/setup-arithmetization-riscv
        with:
          zkc-ref: ${{ inputs.zkc-ref }}
          # Share caches for go.mod-pinned runs from trusted refs; fork PRs and custom ZKC refs must not write to shared caches.
          cache-save: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && inputs.zkc-ref == '' }}

      - name: Compile risc binary for simple zkc test program and check it
        run: make -C arithmetization zkc-compile-and-check
        env:
          ZKC_MAIN: src/test/zkc/simple_add.zkc
          ZKC_FILES: src/test/zkc/simple_add.zkc
          ZKC_INPUT: src/test/zkc/simple_add.json

      # - name: Trace l2-execution guest program with Amsterdam block 500k sharding 500000
      #   # 500k references the amount of gas used in the block
      #   run: make -C riscv-guests/l2-execution trace
      #   timeout-minutes: 45
      #   env:
      #     ZKC_REF: "1183cd10e59fe08d4cb5d4184c30bcf041f4512e"
      #     INPUT: test/testdata/block_amsterdam_51584_500k.ssz
      #     KECCAK_ACCEL: true
      #     ZKC_TRACE_FLAGS: "--stats -vv --sharding interpreter:500000"

      # - name: Trace l2-execution guest program with Amsterdam block 786k sharding 500000, no pb
      #   # 786k references the amount of gas used in the block
      #   run: make -C riscv-guests/l2-execution trace
      #   timeout-minutes: 45
      #   env:
      #     ZKC_REF: "1183cd10e59fe08d4cb5d4184c30bcf041f4512e"
      #     INPUT: test/testdata/block_amsterdam_786k_nopb.ssz
      #     KECCAK_ACCEL: true
      #     ZKC_TRACE_FLAGS: "--stats -vv --sharding interpreter:500000"

      - name: Trace l2-execution guest program with Amsterdam block 175k sharding 500000, no pb
        # 175k references the amount of gas used in the block.
        # taskset fixes NumCPU() at 8, which is the shard worker-pool size.
        run: taskset -c 0-15 make -C riscv-guests/l2-execution trace -j 16
        timeout-minutes: 45
        env:
          ZKC_REF: "1183cd10e59fe08d4cb5d4184c30bcf041f4512e"
          INPUT: test/testdata/block_amsterdam_175k_nopb.ssz
          KECCAK_ACCEL: true
          ZKC_TRACE_FLAGS: "--stats -vv --sharding interpreter:500000"

      - name: Trace l2-execution guest program with Amsterdam block 2.5M sharding 500000
        # 2.5M references the amount of gas used in the block
        run: taskset -c 0-31 make -C riscv-guests/l2-execution trace
        timeout-minutes: 45
        env:
          ZKC_REF: "1183cd10e59fe08d4cb5d4184c30bcf041f4512e"
          INPUT: test/testdata/block_amsterdam_52861_2M.ssz
          KECCAK_ACCEL: true
          ZKC_TRACE_FLAGS: "--stats -vv --sharding interpreter:500000"


