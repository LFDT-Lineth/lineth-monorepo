name: "Postman config docs"

# Auto-generates Linea Postman env-var config MDX partials and opens a PR
# into LFDT-Lineth/lineth-docs writing ONLY docs/reference/component-configuration/_generated/postman/.
#
# Triggers automatically when envLoader.ts, schema.ts, or the generator script
# change on main. Can also be triggered manually via workflow_dispatch.

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "postman/src/application/postman/app/config/envLoader.ts"
      - "postman/src/application/postman/app/config/schema.ts"
      - "postman/scripts/generate-config-docs.ts"
  workflow_dispatch:

concurrency:
  group: postman-config-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-doc-linea:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    permissions:
      contents: read
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: ./.github/actions/setup-node-with-cache
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -F "@lfdt-lineth/postman..." install --frozen-lockfile

      - name: Generate partials
        run: pnpm --filter @lfdt-lineth/postman run docs:generate

      - name: Write provenance partial
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_SHA}" ]]; then
            echo "Refusing to publish: GITHUB_SHA / SOURCE_SHA is empty" >&2
            exit 1
          fi
          SHORT="${SOURCE_SHA:0:7}"
          OUT="postman/docs/_generated/postman/provenance.mdx"
          mkdir -p "$(dirname "$OUT")"
          LINE="Generated from [\`LFDT-Lineth/lineth-monorepo@${SHORT}\`](https://github.com/LFDT-Lineth/lineth-monorepo/commit/${SOURCE_SHA})."
          if [[ "${SOURCE_REF_TYPE}" == "tag" && "${SOURCE_REF_NAME}" == postman-* ]]; then
            LINE="${LINE} (release \`${SOURCE_REF_NAME}\`)."
          fi
          {
            echo "${LINE}"
            echo ""
            echo "Env vars may differ in other Postman releases."
            echo ""
          } > "$OUT"
          echo "Wrote $OUT"
          cat "$OUT"

      - name: Generate App token for LFDT-Lineth/lineth-docs
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.LINETH_DOCS_PR_APP_ID }}
          private-key: ${{ secrets.LINETH_DOCS_PR_PRIVATE_KEY }}
          owner: LFDT-Lineth
          repositories: |
            lineth-docs

      - name: Checkout lineth-docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LFDT-Lineth/lineth-docs
          token: ${{ steps.app-token.outputs.token }}
          path: lineth-docs

      - name: Copy only _generated/postman partials
        run: |
          set -euo pipefail
          DEST="lineth-docs/docs/reference/component-configuration/_generated/postman"
          SRC="postman/docs/_generated/postman"
          if [[ -z "$(find "$SRC" -type f -name '*.mdx' | head -1)" ]]; then
            echo "Refusing to publish: no MDX partials under $SRC" >&2
            exit 1
          fi
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRC/." "$DEST/"
          # Hard invariant: never touch the human-owned wrapper.
          if git -C lineth-docs status --porcelain -- "docs/reference/component-configuration/linea-postman-options.md" | grep -q .; then
            echo "Refusing to proceed: wrapper page would be modified." >&2
            exit 1
          fi
          echo "Staged lineth-docs changes (should be under _generated/postman only):"
          git -C lineth-docs status --short

      - name: Set timestamp
        id: timestamp
        shell: bash
        run: echo "TIMESTAMP=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create pull request on lineth-docs
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: lineth-docs
          commit-message: "docs: update Linea Postman config partials"
          signoff: true
          branch: ci/postman-config-docs-${{ steps.timestamp.outputs.TIMESTAMP }}
          base: main
          title: "docs: update Linea Postman config partials"
          body: |
            Auto-generated Linea Postman env-var config MDX partials from `LFDT-Lineth/lineth-monorepo`.

            This PR updates **only** `docs/reference/component-configuration/_generated/postman/`.
            The human-owned wrapper `linea-postman-options.mdx` is intentionally untouched.
          add-paths: |
            docs/reference/component-configuration/_generated/postman/**
