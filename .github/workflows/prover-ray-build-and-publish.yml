name: prover-ray-build-and-publish

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      image_tag_with_suffix:
        required: false
        type: string
        default: ''
      develop_tag:
        required: true
        type: string
      image_name:
        required: false
        type: string
        default: consensys/lineth-prover-ray
      push_image:
        required: false
        type: boolean
        default: false

concurrency:
  group: prover-ray-build-and-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GOPROXY: "https://proxy.golang.org"

jobs:
  build-and-publish:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    environment: ${{ !inputs.push_image && 'dockerhub-pull' || github.ref == 'refs/heads/main' && 'dockerhub-lineth-prover-ray' || 'dockerhub-lineth-prover-ray-approval' }}
    name: Prover-ray build
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_TAG_WITH_SUFFIX: ${{ inputs.image_tag_with_suffix }}
      DEVELOP_TAG: ${{ inputs.develop_tag }}
      IMAGE_NAME: ${{ inputs.image_name }}
      PUSH_IMAGE: ${{ inputs.push_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Login to Docker Hub
        uses: ./.github/actions/dockerhub-login
        with:
          connection-id: ${{ inputs.push_image && vars.DOCKERHUB_OIDC_CONNECTIONID_LINETH_PROVER_RAY || vars.DOCKERHUB_OIDC_CONNECTIONID_PULL }}

      - name: Build and publish Docker image
        uses: ./.github/actions/docker-build-publish
        with:
          image_name: ${{ env.IMAGE_NAME }}
          image_tags: ${{ env.IMAGE_TAG_WITH_SUFFIX && format('{0},{1}', env.IMAGE_TAG, env.IMAGE_TAG_WITH_SUFFIX) || env.IMAGE_TAG }}
          develop_tag: ${{ env.DEVELOP_TAG }}
          push_image: ${{ env.PUSH_IMAGE }}
          dockerfile_path: ./prover-ray/Dockerfile
          docker_context: prover-ray
          build_contexts: |
            licenses=.
          push_platforms: linux/amd64

      # Smoke gate on the local (push_image=false) build, against the guest built
      # from this commit. If it fails, the release is blocked before any push.
      - name: Build guest artifacts
        if: ${{ env.PUSH_IMAGE == 'false' }}
        run: make -C riscv-guests docker-artifacts GUEST=l2-execution OUT="$RUNNER_TEMP/guest-artifacts"

      - name: Smoke test the image
        if: ${{ env.PUSH_IMAGE == 'false' }}
        run: ./prover-ray/scripts/docker-smoke.sh "${IMAGE_NAME}:${IMAGE_TAG}" "$RUNNER_TEMP/guest-artifacts"
