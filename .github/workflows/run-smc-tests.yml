name: smart-contracts-testing

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      commit_tag:
        required: true
        type: string

env:
  GOPROXY: "https://proxy.golang.org"
  COMMIT_TAG: ${{ inputs.commit_tag }}

jobs:
  run-contract-tests:
    # ~2 mins saved vs small
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    name: Run smart contracts tests
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.7
          cache-dependency-path: |
                prover/go.sum

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            %LocalAppData%\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('prover/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup nodejs environment
        uses: ./.github/actions/setup-nodejs

      - name: Cache Hardhat compiler
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/hardhat-nodejs
          key: ${{ runner.os }}-hardhat-compilers-${{ hashFiles('contracts/hardhat.config.ts', 'contracts/hardhat_overrides.ts') }}
          restore-keys: |
            ${{ runner.os }}-hardhat-compilers-

      - name: Check JS formatting
        run: pnpm -F contracts run lint:ts

      - name: Test Forge contract deployer
        working-directory: contracts/forge-deployer
        run: |
          pnpm test
          pnpm typecheck
          pnpm build

      # Required for hardhat commands due to @nomicfoundation/hardhat-foundry package
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 #v1.9.1

      - name: Compile kzg.node
        run: pnpm -F contracts exec node-gyp --directory=node_modules/c-kzg rebuild # explicitly running rebuild to get the .node file

      - name: Pre-compile contracts to cache solc
        run: pnpm -F contracts run build

      - name: Run smart contracts tests and generate coverage report
        # @openzeppelin/upgrades-core hardcodes 3 lock-acquisition retries (~7s) around a
        # 10s staleness threshold when guarding its gitignored contracts/.openzeppelin
        # manifest. Under coverage's instrumented (slower) execution this occasionally
        # loses the race against a legitimately (not abandoned) held lock and throws
        # "Lock file is already being held", not a real test/code failure. Retry the
        # whole run, wiping the ephemeral manifest first so a stale lock can't persist
        # across attempts.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4.0.0
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 15
          command: |
            rm -rf contracts/.openzeppelin
            pnpm -F contracts run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smart-contract-coverage-${{ env.COMMIT_TAG }}.json
          if-no-files-found: error
          path: |
            ./contracts/coverage/coverage-final.json

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f #v7.0.0
        with:
          fail_ci_if_error: true
          files: ./contracts/coverage/coverage-final.json
          flags: hardhat
          os: linux
          name: codecov-contracts
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  solidity-format-check:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    name: Solidity format check
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup nodejs environment
        uses: ./.github/actions/setup-nodejs

      - name: Check Solidity formatting
        run: |
          pnpm -F contracts run lint:sol
          pnpm -F contracts run prettier:sol

