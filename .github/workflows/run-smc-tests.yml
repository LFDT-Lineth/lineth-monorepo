name: smart-contracts-testing

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      commit_tag:
        required: true
        type: string

env:
  GOPROXY: "https://proxy.golang.org"
  COMMIT_TAG: ${{ inputs.commit_tag }}

jobs:
  run-contract-tests:
    # ~2 mins saved vs small
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    name: Run smart contracts tests
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: ./.github/actions/setup-go
        with:
          go-version: 1.25.7
          cache-dependency-path: |
                prover/go.sum

      - uses: ./.github/actions/cache
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            %LocalAppData%\go-build
          key: ${{ runner.os }}-go-${{ hashFiles('prover/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup nodejs environment
        uses: ./.github/actions/setup-nodejs

      - name: Cache Hardhat compiler
        uses: ./.github/actions/cache
        with:
          path: ~/.cache/hardhat-nodejs
          key: ${{ runner.os }}-hardhat-compilers-${{ hashFiles('contracts/hardhat.config.ts', 'contracts/hardhat_overrides.ts') }}
          restore-keys: |
            ${{ runner.os }}-hardhat-compilers-

      - name: Check JS formatting
        run: pnpm -F contracts run lint:ts

      - name: Compile kzg.node
        run: pnpm -F contracts exec node-gyp --directory=node_modules/c-kzg rebuild # explicitly running rebuild to get the .node file

      - name: Pre-compile contracts to cache solc
        run: pnpm -F contracts run build

      - name: Run smart contracts tests and generate coverage report
        run: pnpm -F contracts run coverage

      # Hardhat 3 writes lcov paths relative to contracts/ (SF:src/...); make them repo-relative for codecov.yml paths.
      - name: Make coverage paths repository-relative
        run: sed -i 's|^SF:|SF:contracts/|' contracts/coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smart-contract-coverage-${{ env.COMMIT_TAG }}.lcov
          if-no-files-found: error
          path: |
            ./contracts/coverage/lcov.info

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: ./contracts/coverage/lcov.info
          flags: hardhat
          os: linux
          name: codecov-contracts
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  solidity-format-check:
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    name: Solidity format check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup nodejs environment
        uses: ./.github/actions/setup-nodejs

      - name: Check Solidity formatting
        run: |
          pnpm -F contracts run lint:sol
          pnpm -F contracts run prettier:sol

