# Host-machine CI for the RISC-V guest programs (riscv-guests/):
#   - host-tests: `make test` — the top-level orchestrator fans the native unit tests out to every
#     guest in GUESTS (single-fixture smoke test, delegated-accel integration test, …).
#   - reference-tests: after the unit tests, `make reference-test` runs the dummy-wrap-vs-fixture-truth
#     guard (extended_vanilla_runner.zig) over the Amsterdam EF corpus.
# Both run the guest logic natively (no RISC-V, no ZKC); running the guest through the ZKC
# interpreter is covered separately, by its own dedicated workflow.
name: riscv-guests host tests

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  host-tests:
    name: Guest unit tests (host)
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Run guest host tests
        uses: ./.github/actions/run-riscv-guests-host-tests

  reference-tests:
    name: l2-execution extended-guest reference-test guards (host)
    needs: host-tests
    runs-on: gha-lfdt-lineth-ss-ubuntu-24-amd64-med
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Run guest reference tests
        uses: ./.github/actions/run-riscv-guests-reference-tests
