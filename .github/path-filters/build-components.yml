# Component path filters for the `plan` job in .github/workflows/main.yml (dorny/paths-filter).
# Each key becomes a `plan` output of the same name; adding a component also needs that output
# declared in main.yml. Filters that list main.yml also list this file, so editing a filter
# re-runs the tests it affects.
coordinator:
  - 'coordinator/**'
  - 'testdata/**'
  - 'rollup_spec/src/rollup_spec/prover_io/**'
  - 'buildSrc/**'
  - 'jvm-libs/**'
  - 'gradle/**'
  - 'build.gradle'
  - 'gradle.properties'
  - 'settings.gradle'
  - '.github/workflows/coordinator-*.yml'
  - '.github/workflows/build-and-publish.yml'
  - '.github/workflows/main.yml'
  - '.github/path-filters/build-components.yml'
staterecovery:
  - 'state-recovery/**'
  - 'buildSrc/**'
  - 'jvm-libs/**'
  - 'gradle/**'
  - 'build.gradle'
  - 'gradle.properties'
  - 'settings.gradle'
  - '.github/workflows/staterecovery-*.yml'
  - '.github/workflows/main.yml'
  - '.github/path-filters/build-components.yml'
postman:
  - 'postman/**'
  - 'ts-libs/sdk/**'
  - 'ts-libs/linea-native-libs/**'
  - 'ts-libs/linea-shared-utils/**'
  - '.github/workflows/postman-*.yml'
  - '.github/workflows/build-and-publish.yml'
  - '.github/workflows/main.yml'
  - '.github/path-filters/build-components.yml'
  - '.nvmrc'
prover:
  - 'prover/**'
  - '.github/workflows/prover-testing.yml'
  - '.github/workflows/build-and-publish.yml'
  - '.github/workflows/main.yml'
  - '.github/path-filters/build-components.yml'
prover-ray:
  - 'prover-ray/**'
  - 'rollup_spec/src/**'
  - 'riscv-guests/l2_execution/test/testdata/**'
  - 'riscv-guests/build_common/linker_script.ld'
  - '.github/workflows/prover-ray-testing.yml'
  - '.github/workflows/main.yml'
  - '.github/path-filters/build-components.yml'
rollup-spec:
  - 'rollup_spec/src/**'
  - 'rollup_spec/tests/**'
  - 'rollup_spec/requirements.txt'
  - 'rollup_spec/pyproject.toml'
  - '.github/workflows/rollup-spec-testing.yml'
transaction-exclusion-api:
  - 'transaction-exclusion-api/**'
  - 'jvm-libs/generic/extensions/futures/**'
  - 'jvm-libs/generic/extensions/kotlin/**'
  - 'jvm-libs/generic/json-rpc/**'
  - 'jvm-libs/generic/persistence/**'
  - 'jvm-libs/generic/vertx-helper/**'
  - 'jvm-libs/linea/core/long-running-service/**'
  - 'jvm-libs/linea/core/metrics/**'
  - 'jvm-libs/linea/metrics/**'
  - '.github/workflows/transaction-exclusion-api-*.yml'
  - '.github/workflows/build-and-publish.yml'
  - '.github/workflows/main.yml'
  - '.github/path-filters/build-components.yml'
  - 'buildSrc/**'
  - 'gradle/**'
  - 'build.gradle'
  - 'gradle.properties'
  - 'settings.gradle'
smart-contracts:
  - 'contracts/**'
  - 'testdata/**'
  - 'prover/**'
  - '.github/workflows/main.yml'
  - '.github/path-filters/build-components.yml'
  - '.github/workflows/run-smc-tests.yml'
linea-sequencer-plugin:
