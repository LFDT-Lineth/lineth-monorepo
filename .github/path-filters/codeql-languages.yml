# CodeQL language filters for .github/actions/codeql-languages (dorny/paths-filter). Each key is a
# CodeQL language; the action analyzes the languages whose files changed.
go:
  - '**/*.go'
  - '**/go.mod'
  - '**/go.sum'
java-kotlin:
  - '**/*.java'
  - '**/*.kt'
  - '**/*.gradle'
  - '**/*.gradle.kts'
  - '**/pom.xml'
  - '**/build.gradle'
  - '**/gradle.properties'
  - '**/settings.gradle'
  - 'build.gradle'
  - 'gradle.properties'
  - 'settings.gradle'
  - 'gradle/**'
javascript-typescript:
  - '**/*.js'
  - '**/*.ts'
  - '**/*.tsx'
  - '**/*.jsx'
  - '**/*.json'
  - '**/package.json'
  - '**/tsconfig.json'
  - '**/pnpm-lock.yaml'
  - '**/yarn.lock'
  - '**/package-lock.json'
actions:
  - '.github/workflows/**'
  - '.github/actions/**'
python:
  - '**/*.py'
  - '**/requirements.txt'
  - '**/pyproject.toml'
  - '**/setup.py'
  - '**/Pipfile'
