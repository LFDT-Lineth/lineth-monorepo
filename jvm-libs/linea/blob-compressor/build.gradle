plugins {
  id 'lineth.kotlin-common-minimal-conventions'
  id 'lineth.download-native-libs'
  id 'java-test-fixtures'
}

description = 'Java JNA wrapper for Lineth Blob Compressor Library implemented in GO Lang'

dependencies {
  api project(':jvm-libs:linea:core:da-interfaces')
  compileOnly "net.java.dev.jna:jna:${libs.versions.jna.get()}"
  compileOnly project(":jvm-libs:generic:extensions:kotlin")
  compileOnly "org.apache.logging.log4j:log4j-api:${libs.versions.log4j.get()}"
  compileOnly "org.apache.logging.log4j:log4j-core:${libs.versions.log4j.get()}"

  testImplementation "net.java.dev.jna:jna:${libs.versions.jna.get()}"
  testImplementation project(":jvm-libs:linea:blob-shnarf-calculator")
  testImplementation project(":jvm-libs:generic:extensions:kotlin")
  testImplementation(testFixtures(project(':jvm-libs:linea:core:da-interfaces')))
  testImplementation platform("io.vertx:vertx-stack-depchain:${libs.versions.vertx.get()}")
  testImplementation "io.vertx:vertx-core"
  testFixturesImplementation project(':jvm-libs:linea:besu-libs')
  testFixturesImplementation project(':jvm-libs:linea:besu-rlp-and-mappers')
  testFixturesImplementation(project(":jvm-libs:linea:testing:file-system"))
}

test {
  // we cannot have more 1 compressor per JVM, hence we disable parallel execution
  // because multiple threads would cause issues with the native library
  systemProperties["junit.jupiter.execution.parallel.enabled"] = false
  maxParallelForks = 1

  // the Linea mainnet blocks the Zig-backed tests compress; they are skipped without them
  def daTestBlocks = rootProject.file("riscv-guests/rollup/test/testdata/linea_mainnet_27434569_27434718.json.gz")
  systemProperty "lineth.da.testBlocks", daTestBlocks
  inputs.files(daTestBlocks).withPropertyName("daTestBlocks")
}

downloadNativeLibs {
  fetchLibs {
    urls = [
      "https://github.com/LFDT-Lineth/lineth-monorepo/releases/download/blob-libs-v2.1.0-rc1/linea-blob-libs-v2.1.0-rc1.zip",
      "https://github.com/LFDT-Lineth/lineth-monorepo/releases/download/blob-libs-v4.0.1/linea-blob-libs-v4.0.1.zip",
    ]
    libs = ["blob_compressor"]
  }
  fetchLibs {
    url = "https://github.com/LFDT-Lineth/lineth-monorepo/releases/download/releases/riscv-lineth-da/v0.1.0-rc1/lineth-da-libs-v0.1.0-rc1.zip"
    libs = ["lineth_da"]
    dictionaries = ["v2025-04-21.bin"]
  }
}
