buildscript {
  dependencies {
    classpath(libs.jreleaser)
  }
}

plugins {
  id 'lineth.kotlin-library-minimal-conventions'
}

// These libs are public, so we're commited on their artifactIds and `build.linea` group id, unlike the internal ones
Set<String> publicApiLibs = [
  "blob-compressor",
  "blob-decompressor",
  "blob-shnarf-calculator",
  "l1-rollup",
  "l2-message-service",
  "signer-interfaces"
]

subprojects { sub ->
  def hasSourceFiles = sub.fileTree(dir: 'src', includes: ['**/*.java', '**/*.kt']).files.size() > 0

  afterEvaluate {
    // Modules whose sources are all generated (e.g. web3j contract clients) are published too.
    // Decided from the applied plugin rather than build/generated, so the result doesn't depend on a previous build.
    def hasGeneratedSources = sub.plugins.hasPlugin('linea.web3j-codegen')

    if (hasSourceFiles || hasGeneratedSources) {
      // !in operator doesn't work with spotless plugin
      if (!publicApiLibs.contains(sub.name)) {
        sub.group = "${rootProject.group}.internal"
      }
      sub.apply from: rootProject.file("gradle/publishing.gradle")
    }
  }
}
