
volumes:
  local-dev:
    name: "linea-local-dev"
  logs:
    name: "linea-logs"

  l1-el-data:
    name: "linea-l1-el-data"
  l1-cl-data:
    name: "linea-l1-cl-data"
  sequencer-data:
    name: "linea-sequencer-data"
  maru-data:
    name: "linea-maru-data"
  postgres-data:
    name: "linea-postgres-data"

networks:
  linea:
    driver: bridge
    ipam:
      config:
        - subnet: 11.11.11.0/24
  l1network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24

# To debug inside the network and volumes
# docker run --rm -it --network=docker_linea -v=linea-local-dev:/data -v=linea-logs:/logs weibeld/ubuntu-networking bash

services:
  local-data-initialization:
    image: busybox:latest
    user: "0:0"
    # Besu and Teku run as uid/gid 1000. Their images do not contain these
    # directories, so newly created volumes otherwise belong to root.
    command: ["sh", "-ec", "chown 1000:1000 /l1-el /l1-cl /sequencer"]
    volumes:
      - l1-el-data:/l1-el
      - l1-cl-data:/l1-cl
      - sequencer-data:/sequencer

  l1-el-node:
    extends:
      file: compose-spec-l1-services.yml
      service: l1-el-node

  l1-cl-node:
    extends:
      file: compose-spec-l1-services.yml
      service: l1-cl-node

  l1-node-genesis-generator:
    extends:
      file: compose-spec-l1-services.yml
      service: l1-node-genesis-generator

  l2-genesis-initialization:
    extends:
      file: compose-spec-l2-services.yml
      service: l2-genesis-initialization

  maru:
    extends:
      file: compose-spec-l2-services.yml
      service: maru

  sequencer:
    extends:
      file: compose-spec-l2-services.yml
      service: sequencer

  l2-node-besu:
    extends:
      file: compose-spec-l2-services.yml
      service: l2-node-besu

  prover-v3:
    extends:
      file: compose-spec-l2-services.yml
      service: prover-v3

  coordinator:
    extends:
      file: compose-spec-l2-services.yml
      service: coordinator

  postgres:
    extends:
      file: compose-spec-l2-services.yml
      service: postgres

  shomei:
    extends:
      file: compose-spec-l2-services.yml
      service: shomei
