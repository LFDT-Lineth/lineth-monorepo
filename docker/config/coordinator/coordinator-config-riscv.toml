# RISC-V-from-genesis smoke scenario; do not use for a zkEVM transition.
[protocol.l1]
contract-address = "0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9"

[conflation]
blocks-limit = 1
riscv-starting-block-timestamp-inclusive = 0

[conflation.proof-aggregation]
timestamp-based-hard-forks = [0]

[traces.counters]
endpoints = ["http://sequencer:8545/"]

[traces.conflation]
endpoints = ["http://sequencer:8545/"]

[type2-state-proof-provider]
disabled = true

[l1-submission.blob]
disabled = true

[l1-submission.blob.signer]
type = "Web3j"

[l1-submission.aggregation]
disabled = true

[l1-submission.aggregation.signer]
type = "Web3j"

[message-anchoring]
disabled = true

[message-anchoring.signer]
type = "Web3j"

[forced-transactions]
disabled = true

[l2-network-gas-pricing]
disabled = true
