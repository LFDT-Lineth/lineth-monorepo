# Apply on top of compose-tracing-v2.yml. Both proof pipelines share the same
# project, L1, databases, networks and /data directory. Fork activation, execution
# client migration and contract upgrades belong to the transition scenario.
services:
  riscv-proof-responder:
    image: busybox:latest
    profiles: ["riscv"]
    entrypoint: ["/bin/sh", "/opt/linea/proof-responder.sh"]
    environment:
      R5_L2_EXECUTION_PROGRAM_VK: ${R5_L2_EXECUTION_PROGRAM_VK:-0x17d2e0660946012c80c5fe6bbecc2076a6f6f5aa58606efe66a14426d2ffe46f}
    volumes:
      - ./config/riscv/proof-responder.sh:/opt/linea/proof-responder.sh:ro
      - ../tmp/local/prover/riscv:/data/prover/riscv
    networks:
      - linea

  coordinator:
    environment:
      COORDINATOR_CONFIG_FILES: config/coordinator-config.toml config/coordinator-config-riscv-prover.toml
    volumes:
      - ./config/coordinator/coordinator-config-riscv-prover.toml:/opt/consensys/linea/coordinator/config/coordinator-config-riscv-prover.toml:ro
