# RISC-V overrides for the shared local stack in compose-tracing-v2.yml.
x-riscv-execution-program-id: &riscv-execution-program-id ${R5_L2_EXECUTION_PROGRAM_ID:-0x17d2e0660946012c80c5fe6bbecc2076a6f6f5aa58606efe66a14426d2ffe46f}

services:
  l2-genesis-initialization:
    environment:
      L2_GENESIS_MODE: riscv

  maru:
    environment:
      LINETH_USE_MARU_OVERRIDE_CONFIG: "false"
    volumes:
      - ./config/maru/sequencer.riscv.config.overrides.toml:/opt/consensys/maru/configs/config.mode.toml:ro

  sequencer:
    command:
      - --config-file=/var/lib/besu/sequencer.config.toml
      - --node-private-key-file=/var/lib/besu/key
      - --plugin-linea-node-type=SEQUENCER
      - --data-storage-format=BONSAI
      - --plugin-linea-tracing-end-timestamp=0
      # The RISC-V local deployment does not include the liveness contract.
      - --plugin-linea-liveness-enabled=false

  # These zkEVM-only services are not used by the RISC-V execution flow.
  l2-node-besu:
    profiles: !override ["zkevm"]
  prover-v3:
    profiles: !override ["zkevm"]
  shomei:
    profiles: !override ["zkevm"]

  prover-ray:
    container_name: prover-ray
    hostname: prover-ray
    image: consensys/lineth-prover-ray:${LINEA_PROVER_RAY_TAG:-0.1.1-20261006-f1f4280}
    platform: linux/amd64
    profiles: ["riscv"]
    environment:
      CONFIG_FILE: /opt/linea/prover-ray/config/config.toml
      WORKER_ID: prover-ray-0
    volumes:
      - ./config/prover/riscv/prover-ray-config.toml:/opt/linea/prover-ray/config/config.toml:ro
      - ../tmp/local/prover/riscv:/data/prover/riscv
    networks:
      - linea

  coordinator:
    # The RISC-V prover config requires coordinator >= 2.0.0.
    image: ${LINEA_COORDINATOR_IMAGE_NAME:-consensys/linea-coordinator}:${LINEA_COORDINATOR_TAG:-2.0.1-20261006-a95a2ad}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9545;
          printf "GET /health HTTP/1.0\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
    depends_on: !override
      l2-genesis-initialization:
        condition: service_completed_successfully
      l1-el-node:
        condition: service_started
      postgres:
        condition: service_healthy
      sequencer:
        condition: service_healthy
    environment:
      COORDINATOR_CONFIG_FILES: config/coordinator-config.toml config/coordinator-config-riscv.toml
      config__override__prover__l2_execution__program_id: *riscv-execution-program-id
    volumes:
      - ./config/coordinator/coordinator-config-riscv.toml:/opt/consensys/linea/coordinator/config/coordinator-config-riscv.toml:ro
