# RISC-V overrides for the shared local stack in compose-tracing-v2.yml.
services:
  l2-genesis-initialization:
    environment:
      L2_GENESIS_MODE: riscv

  maru:
    environment:
      LINETH_USE_MARU_OVERRIDE_CONFIG: "false"
    volumes:
      - ./config/maru/sequencer.riscv.config.toml:/opt/consensys/maru/configs/config.toml:ro

  sequencer:
    volumes:
      - ./config/riscv/sequencer.config.toml:/var/lib/besu/sequencer.config.toml:ro
    command:
      - --config-file=/var/lib/besu/sequencer.config.toml
      - --node-private-key-file=/var/lib/besu/key

  # These zkEVM-only services are not used by the RISC-V execution flow.
  l2-node-besu:
    profiles: !override ["zkevm"]
  prover-v3:
    profiles: !override ["zkevm"]
  shomei:
    profiles: !override ["zkevm"]

  riscv-proof-responder:
    image: busybox:latest
    profiles: ["riscv"]
    entrypoint: ["/bin/sh", "/opt/linea/proof-responder.sh"]
    environment:
      R5_L2_EXECUTION_PROGRAM_VK: ${R5_L2_EXECUTION_PROGRAM_VK:-0x17d2e0660946012c80c5fe6bbecc2076a6f6f5aa58606efe66a14426d2ffe46f}
    volumes:
      - ./config/riscv/proof-responder.sh:/opt/linea/proof-responder.sh:ro
      - ../tmp/local/prover/riscv:/data/prover/riscv
    networks:
      - linea

  coordinator:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9545;
          printf "GET /health HTTP/1.0\r\n\r\n" >&3;
          grep -q "200 OK" <&3'
    depends_on: !override
      l2-genesis-initialization:
        condition: service_completed_successfully
      l1-el-node:
        condition: service_started
      postgres:
        condition: service_healthy
      sequencer:
        condition: service_healthy
    environment:
      COORDINATOR_CONFIG_FILES: config/coordinator-config.toml config/coordinator-config-riscv.toml
    volumes:
      - ./config/coordinator/coordinator-config-riscv.toml:/opt/consensys/linea/coordinator/config/coordinator-config-riscv.toml:ro
